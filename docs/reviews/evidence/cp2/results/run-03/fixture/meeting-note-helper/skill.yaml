{
  "apiVersion": "skillforge/v1alpha1",
  "kind": "SkillSource",
  "skill": {
    "name": "meeting-note-helper",
    "source-version": "0.1.0",
    "recommended-skill-md-max-bytes": 20000,
    "description": "Turn supplied meeting notes into a concise summary and action list. Use for summarizing an existing meeting record; not for inventing decisions or participants."
  },
  "fragments": {},
  "references": [
    {
      "id": "actions",
      "source": "references/action-items.md",
      "target": "references/action-items.md",
      "title": "Action item formatting",
      "trigger": "Read this when the supplied meeting record contains action items; it is not required for records with no actions.",
      "required": true
    }
  ],
  "assets": [],
  "copies": [],
  "supporting": [
    {
      "id": "history",
      "source": "docs/migration-note.md",
      "target": "docs/migration-note.md"
    }
  ],
  "surfaces": {
    "active": {
      "requiredReferences": [
        "actions"
      ],
      "optionalReferences": []
    },
    "supportingGlobs": [
      "docs/*"
    ]
  },
  "sections": {
    "startHere": [
      "Use the supplied meeting record as the factual source. Return a concise summary and, when present, an action list.",
      "Do not contact participants or update external systems. If the meeting record is absent, request it before summarizing.",
      "When the supplied meeting record contains action items, read references/action-items.md before writing the action list. For records without actions, return the summary only."
    ],
    "whenToUse": [
      "Summarize a supplied meeting record into a summary and action list."
    ],
    "whenNotToUse": [
      "No meeting record is available or the task requires inventing meeting decisions."
    ],
    "workflow": [
      {
        "id": "summarize",
        "title": "Summarize the record",
        "goal": "The requester receives a faithful summary and explicit actions supported by the record.",
        "steps": [
          "Extract the stated decisions and actions without inventing facts."
        ],
        "validation": [
          "Check each decision and action against the supplied record; mark unknown facts rather than guessing."
        ]
      }
    ],
    "interop": [],
    "commands": [],
    "gotchas": [],
    "policies": [
      {
        "id": "facts",
        "title": "Factual boundary",
        "text": "Omit unsupported decisions. This summary does not confirm participant agreement or execute the listed actions."
      }
    ],
    "portability": {
      "required": true,
      "rules": [
        "Use only the supplied record and guidance inside this folder."
      ],
      "checklist": [
        "Confirm every required local reference travels with the folder."
      ]
    }
  }
}
