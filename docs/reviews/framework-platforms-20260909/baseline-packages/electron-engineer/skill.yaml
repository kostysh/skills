apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: electron-engineer
  source-version: 0.1.10
  recommended-skill-md-max-bytes: 24000
  description: >-
    Build, modernize, review, test, package, and release Electron apps for macOS,
    Windows, and Linux. Use for process and trust boundaries, typed IPC, security,
    protocols, OS integration, storage, source exposure, builds, performance,
    observability, signing, notarization, updates, and migrations.

