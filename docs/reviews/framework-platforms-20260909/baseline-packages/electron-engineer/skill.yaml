sections:
  startHere:
    - Confirm the task is Electron-specific and state the intended user-visible outcome before changing code.
    - "Preserve the core trust boundary: renderer is untrusted UI, preload is a minimal capability facade, and main owns privileged desktop services."
    - Load the smallest matching reference for the task; do not load every reference by default.
    - Before adding a desktop abstraction, wrapper, or renderer-facing capability, check whether a built-in Electron API, native OS behavior, or existing project service already satisfies the boundary-safe behavior.
    - Prefer existing project conventions unless they violate Electron security, packaging, or release invariants.
    - Finish only after running the narrowest meaningful validation, or explicitly reporting why validation could not run.
  whenToUse:
    - Building a new Electron desktop application for macOS, Windows, Linux, or a cross-platform target matrix.
    - Modernizing or reviewing Electron main/preload/renderer architecture, IPC, BrowserWindow, custom protocols, menus, tray, native OS integration, or multi-window flows.
    - Hardening Electron security, including context isolation, sandboxing, CSP, navigation, external URL handling, sender validation, and preload surface review.
    - Configuring TypeScript across Electron main, preload, renderer, utility, shared contracts, electron-vite, and Forge surfaces.
    - Designing local data, file, secret storage, source exposure reduction, build process, native module, offline-first, or crash recovery behavior in an Electron app.
    - Packaging, signing, notarizing, distributing, updating, testing, debugging, observing, or migrating Electron applications.
  whenNotToUse:
    - The app is Tauri, Flutter, native Swift/Kotlin/C# desktop, browser-only web, mobile, or CLI-only.
    - The work is pure TypeScript language or type-system behavior with no Electron boundary; use `typescript-engineer`.
    - The work is pure Node runtime behavior with no Electron integration; use `node-engineer`.
    - The work is pure React SPA architecture inside a renderer with no desktop boundary; use `react-spa-engineer`.
  workflow:
    - id: stage-frame-outcome
      title: Frame outcome and risk
      goal: Define what good looks like, which Electron boundary is touched, and what evidence is needed.
      steps:
        - "Identify the touched boundary first: main, preload, renderer, shared contracts, source build, packaging, updater, native module, or release pipeline."
        - "Inspect local project facts before asking: Electron major, target platforms, build tool, renderer framework, native modules, updater model, and release channel when relevant."
        - Read only the matching reference. Use version-matched official Electron docs only when a version-sensitive fact, API, or migration point is needed.
        - Ask a narrow clarification only when the missing choice materially changes architecture, security posture, distribution, or irreversible release behavior.
      validation:
        - The success criteria, touched boundary, and validation target are explicit.
        - Assumptions are labeled if evidence is unavailable.
    - id: stage-preserve-boundaries
      title: Preserve Electron boundaries
      goal: Make the smallest change that preserves security, runtime, and release invariants.
      steps:
        - Keep privileged capabilities in main-owned services; keep preload role-specific; keep renderer browser-safe.
        - Prefer direct Electron/native OS APIs behind narrow main/preload capabilities before adding generic desktop service layers, broad facades, or renderer convenience wrappers.
        - For IPC or preload work, use explicit capability methods, runtime schemas, sender validation, and serialized errors; never expose raw IPC or generic channel dispatch.
        - For windows or navigation, keep secure BrowserWindow defaults, deny-by-default popup/navigation policy, and validated external URL handling.
        - For source builds, packaging, source protection, updates, native modules, or signing, preserve packaged-runtime behavior and platform release requirements.
      validation:
        - No new broad preload capability, unsafe BrowserWindow flag, unbounded navigation surface, renderer secret, or release-path regression is introduced.
        - Any weaker compatibility fallback is documented with risk and compensating controls.
    - id: stage-verify-and-report
      title: Verify and report
      goal: Prove the changed boundary and produce a concise, useful final answer.
      steps:
        - "Run the most relevant available check for the touched boundary: unit, IPC, preload, renderer, E2E, packaged smoke, artifact, signing, or update-feed check."
        - Use a packaged smoke or artifact check for packaging, updater, protocol, native module, signing, or release-pipeline changes when feasible.
        - Before finalizing, check correctness, grounding, formatting, and high-impact side effects.
        - Report changed files, validation run, and any unverified platform, signing, notarization, updater, or packaged-runtime risk.
      validation:
        - Verification matches the changed Electron boundary, not only browser dev mode.
        - Final output is concise and names any validation gap.
  interop:
    - id: interop-typescript
      domain: TypeScript language, strict typing, schema-derived types, compiler errors, tsconfig, linting, and package-manager toolchain
      winner: typescript-engineer
      rationale: Electron-engineer owns Electron boundaries; TypeScript language and toolchain rules remain with typescript-engineer.
    - id: interop-node
      domain: Node runtime behavior, streams, worker_threads, diagnostics, shutdown, ESM/CJS runtime details, and open handles
      winner: node-engineer
      rationale: Electron main and preload run on Node-adjacent runtimes, but Node runtime mechanics belong to node-engineer.
    - id: interop-react-spa
      domain: React renderer component architecture, routing internals, TanStack Query, Zustand, forms, and browser UI state
      winner: react-spa-engineer
      rationale: Renderer SPA architecture belongs to react-spa-engineer; Electron-engineer owns the desktop boundary around it.
    - id: interop-tests
      domain: Test runner policy, mocking strategy, coverage gates, Vitest, node:test, and CI test behavior
      winner: typescript-test-engineer
      rationale: Electron-engineer defines Electron test layers and release smoke needs; detailed TypeScript test policy belongs to typescript-test-engineer.
    - id: interop-security
      domain: Security audit methodology, vulnerability severity, exploitability, secrets, CI permissions, and supply-chain threat review
      winner: security-reviewer
      rationale: Electron-engineer defines Electron-specific hardening defaults; security-reviewer owns audit process and severity.
  commands: []
  gotchas:
    - id: gotcha-dev-prod-runtime
      priority: high
      text: Dev-mode renderer behavior is not proof that a packaged Electron app works; packaging changes origins, CSP, ASAR paths, protocols, signing, and update metadata.
    - id: gotcha-insecure-convenience
      priority: high
      text: "Do not introduce `nodeIntegration: true`, `contextIsolation: false`, disabled CSP, arbitrary navigation, or raw IPC for convenience."
    - id: gotcha-generic-bridge
      priority: high
      text: A generic preload bridge such as `invoke(channel, payload)` is a privilege-expansion bug pattern, not a production abstraction.
    - id: gotcha-wrapper-expansion
      priority: high
      text: Do not add a broad desktop abstraction or renderer-facing wrapper when a narrow Electron/native OS capability method satisfies the current product behavior.
    - id: gotcha-source-protection-boundary
      priority: high
      text: Source protection raises the reverse-engineering cost but does not make client-side business logic secret; do not use obfuscation, bytecode, ASAR, or native wrappers as a replacement for server-side authorization, licensing checks, or signing/ASAR integrity.
    - id: gotcha-updater-boundary
      priority: high
      text: Auto-update is a supply-chain boundary; it needs signed artifacts, trusted metadata, rollback policy, and test feeds.
    - id: gotcha-native-modules
      priority: medium
      text: Native modules must be rebuilt and smoke-tested against Electron's bundled Node, target OS, target architecture, ASAR layout, and signing/notarization path.
    - id: gotcha-version-sensitive-docs
      priority: medium
      text: Electron docs and examples are version-sensitive; check the project Electron major before applying API guidance from snippets or current docs.
  policies:
    - id: policy-security-defaults
      title: Security defaults
      text: Generate secure defaults first. If compatibility requires weaker settings, document the specific risk and implement the least-dangerous fallback with compensating controls.
    - id: policy-release-discipline
      title: Release discipline
      text: Treat packaging, signing, updater metadata, rollback, SBOM, provenance, and platform-specific smoke tests as part of product behavior, not post-build chores.
    - id: policy-source-protection
      title: Source protection discipline
      text: For closed-source commercial Electron apps, protect against trivial source extraction by removing source maps and dev artifacts, minimizing readable bundles, considering targeted obfuscation or bytecode for main/preload/business-critical modules, and auditing packaged contents. Do not put secrets, private keys, licensing authority, or irreplaceable business logic exclusively in distributed client code.
    - id: policy-retrieval-budget
      title: Retrieval and grounding budget
      text: For version-sensitive Electron facts, inspect local manifests and lockfiles first. Fetch version-matched official Electron docs, release notes, or platform docs only when a required fact, API, date, migration risk, or source-backed claim is missing. Stop searching once the core decision is supported; if evidence remains missing, label the assumption instead of guessing.
    - id: policy-output-contract
      title: Output contract
      text: For implementation work, report the outcome first, then changed surfaces, validation run, and remaining release or platform risk. For audits, lead with findings. For plans, include requirements, affected files/APIs, data flow or state changes when relevant, validation checks, failure behavior, privacy/security considerations, and material open questions.
    - id: policy-missing-context
      title: Missing context and stop rules
      text: If required context is retrievable, look it up before asking. Ask only when the missing choice materially changes architecture, security, distribution, or irreversible release behavior. If proceeding with an assumption, state it and choose a reversible action.
    - id: policy-active-surface
      title: Active normative surface
      text: The generated SKILL.md is the default active instruction surface. References become active for the task when selected from SKILL.md navigation or explicitly loaded by the agent; docs/* and investigations are supporting material only unless explicitly promoted by SKILL.md.
    - id: policy-compiler-maintenance
      title: Compiler maintenance
      text: Maintain this skill through skill.yaml, fragments, references, and skill-source-compiler regeneration. Do not hand-edit generated SKILL.md as the source of truth.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory electron-engineer guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
      - Keep external documentation mentions optional and version-sensitive rather than required local dependencies.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
      - Confirm the copied skill remains understandable and usable in isolation.
