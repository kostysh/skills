skill:
  name: web-ux-engineer
  source-version: 0.1.0
  recommended-skill-md-max-bytes: 20000
  description: >-
    Design, implement, and audit user flows in web apps and SPAs. Use for
    interaction choices, forms, feedback, navigation context, and recovery.
    Deliver verified changes or evidence-backed UX findings; route visual
    direction, UI-rule audits, and framework mechanics to their owners.
