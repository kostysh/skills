surfaces:
  active:
    requiredReferences: []
    optionalReferences: []
  supportingGlobs:
    - docs/**
sections:
  startHere:
    - Deliver an authorized flow improvement or a bounded UX audit that a product owner or implementer can act on. Select implement or audit from the request; audit is read-only, including code and working data.
    - Start with a task or bounded scenario and available requirements, code, live UI, or images. Derive actor, starting context, and intended outcome from these inputs; do not demand a complete brief before useful work.
    - Inspect applicable project rules and existing patterns. A missing business rule, permission, API guarantee, or storage decision blocks only the dependent choice; ask its owner and continue supported work.
  whenToUse:
    - Choose or improve how users complete a web task, understand its status, recover, and resume work.
    - Implement an authorized interaction change, or audit a scenario for evidence-backed UX problems.
  whenNotToUse:
    - Pure visual direction, interface-rule or accessibility audit, or framework integration with settled UX; use the relevant owner below.
    - Product requirements discovery, user research execution, or formal accessibility certification is the requested result; this skill supplies only bounded interaction analysis.
  workflow:
    - id: stage-task
      title: Define the task
      goal: Anchor decisions in the user's intended result.
      steps:
        - Identify the actor's goal, entry point, constraints, and observable completion. Separate accepted requirements from current behavior and assumptions; resolve conflicting authority before the dependent decision.
        - Keep scope proportional. A label correction needs its local context and check, not a journey map or redesign.
    - id: stage-trace
      title: Trace actions and decisions
      goal: Find where the scenario loses clarity or continuity.
      steps:
        - Follow what users see, decide, enter, and receive. Inspect terminology, information hierarchy, forms, feedback, navigation context, cancel, and recovery with realistic data.
        - For applicable SPA transitions, trace loading, empty, error, confirmed success, unknown operation outcome, interruption, and return. Preserve useful input and list context; distinguish closing a surface from cancelling an operation.
        - A timeout can leave the result unknown. Do not assert failure, safe retry, rollback, or successful saving without the API contract and corresponding evidence.
    - id: stage-choose
      title: Choose the interaction
      goal: Resolve meaningful alternatives with task-specific reasons.
      steps:
        - Compare plausible alternatives only when the choice matters. Consider a page for substantial or addressable work, a dialog for a bounded decision needing nearby context, or inline editing for a small local change; weigh context, complexity, interruption, and recovery.
        - Choose ordinary layout, labels, and feedback within authority. Reuse existing components and conventions; leave business rules and backend guarantees to their owners.
        - Do not prescribe autosave, offline support, drafts, new storage, fewer columns, or fewer steps by default. Preserve useful density and deliberate confirmations.
    - id: stage-act
      title: Implement or report findings
      goal: Produce the requested change or an actionable audit.
      steps:
        - In implement mode, make the smallest coherent change across affected states and transitions. Carry focus, keyboard use, responsive behavior, cancel, and recovery through the implementation.
        - In audit mode, leave the target unchanged. For each finding give location and conditions, evidence, user consequence, proposed change, and a check that could demonstrate resolution. Prioritize by task impact; separate observed facts, inferences, and hypotheses. Do not assign an overall UX score.
    - id: stage-verify
      title: Verify and hand off
      goal: Match the reported outcome to observed evidence.
      steps:
        - Use available project checks and browser tools to exercise the changed path, relevant failure/recovery paths, input retention, keyboard/focus, and representative narrow layout. Preserve mandatory project checks; avoid unrelated suites.
        - Code supports code-level findings; images support visible states; browser walkthroughs support exercised interactions. Only suitable user research supports audience usability claims. None alone proves backend persistence, conversion improvement, or full WCAG conformance.
        - Report the result, changed or reviewed scope, evidence, remaining limits, and next action. Missing tools limit the affected conclusion, not all supported analysis.
  interop:
    - id: interop-visual
      domain: visual strategy, composition, styling, and motion
      winner: frontend-design
      rationale: Supply the chosen interaction; consume its visual expression while retaining scenario continuity.
    - id: interop-ui
      domain: review of UI implementation, accessibility, rendered states, and interface rules
      winner: web-ui-reviewer
      rationale: Supply scenario findings; consume technical UI findings without claiming certification or independent approval.
    - id: interop-spa
      domain: React SPA routing, data, forms, state, and integration correctness
      winner: react-spa-engineer
      rationale: Supply expected interaction and recovery; consume implementation constraints and runtime evidence.
  commands: []
  gotchas: []
  policies:
    - id: policy-status
      title: Result status
      text: "Audit: findings means a supported defect exists; no-material-findings requires sufficient evidence for the bounded claim; limited means useful analysis with missing evidence or authority; blocked means no defensible audit is possible. Implementation: completed requires verification of the claimed result; partial means useful work with unresolved verification or scope; blocked means a necessary input or authority prevents progress."
    - id: policy-collaboration
      title: Ownership and independence
      text: Honor an explicitly selected skill's supported scope. For mixed work choose one lead by requested result and consult neighbors only for specific questions; do not cycle handoffs or require all skills. An unavailable neighbor limits specialized conclusions, not the local method. Self-checks are not independent audits; this skill grants no delegation permission.
  portability:
    required: true
    rules:
      - This self-contained method ships no runtime. Discover project paths, commands, tools, and contracts from the task environment.
      - Verify material technical norms or version-sensitive behavior against primary documentation when needed; name unavailable authority and bound the conclusion.
    checklist:
      - Keep observed behavior, assumptions, and unavailable evidence distinguishable in the handoff.
