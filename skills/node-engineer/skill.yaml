apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: node-engineer
  source-version: 0.1.3
  recommended-skill-md-max-bytes: 20000
  description: >-
    Explain, design, review, diagnose, and implement Node.js runtime behavior using
    repo and version evidence. Use for TypeScript execution, ESM/CJS, streams,
    backpressure, shutdown, logging, profiling, dependencies, hangs, and open
    resources; keep diagnosis read-only unless fixes are requested.
fragments:
  overview: fragments/overview.md
