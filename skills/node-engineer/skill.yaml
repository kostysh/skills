    source: references/debugging-profiling.md
    target: references/debugging-profiling.md
    required: true
    trigger: Read this for dependency or module-resolution inspection, process-hang diagnosis, profiling, or benchmarking.
  - id: ref-references-operations
    title: Operations
    source: references/operations.md
    target: references/operations.md
    required: true
    trigger: Read this for signals, graceful shutdown, health/readiness handoff, logging, redaction, or resource cleanup.
  - id: ref-references-runtime-typescript
    title: Runtime TypeScript
    source: references/runtime-typescript.md
    target: references/runtime-typescript.md
    required: true
    trigger: Read this for built-in TypeScript execution, type stripping, Node-version compatibility, import extensions, or build-path decisions.
  - id: ref-references-streams-caching
    title: Streams and caching
    source: references/streams-caching.md
    target: references/streams-caching.md
    required: true
    trigger: Read this for stream pipelines, text or record framing, backpressure, cancellation, ETL, or local cache mechanics.
