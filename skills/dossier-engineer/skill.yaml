apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: dossier-engineer
  source-version: 2.3.0
  recommended-skill-md-max-bytes: 32000
  description: >-
    Manage a source-traced, capability-oriented, merge-safe dossier workflow for
    software delivery. Use when registering requirement sources, mapping product
    capabilities, onboarding an existing project, deriving backlog work,
    separating capability from infrastructure, running delivery stages,
    verification, audits, closure, queue/status/attention checks, post-close
    hygiene, retrospective reporting with Markdown/YAML dossier artifacts, or
    explaining dossier-engineer capabilities and operator prompt patterns.
  compatibility: >-
    Requires git, Markdown files, and the bundled dossier-engineer runtime under
    scripts/dossier-engineer.mjs or an equivalent dossier-engineer executable on
    PATH.
  metadata:
    canonical_storage: markdown-yaml-frontmatter
    runtime: dossier-engineer

fragments:
  overview: fragments/overview.md
  finalChecks: fragments/final-checks.md

references:
  - id: ref-workflow
    title: Workflow protocol
    source: references/workflow.md
    target: references/workflow.md
    required: true
    trigger: Read this when running stage procedure, existing-project onboarding, change-proposal, closure, or detailed command flow.
  - id: ref-capability-governance
    title: Capability governance
    source: references/capability-governance.md
    target: references/capability-governance.md
    required: true
    trigger: Read this when separating observable capability from infrastructure, defining anti-claims, demonstrations, concept conformance, or guardrails.
  - id: ref-artifact-contract
    title: Artifact contract
    source: references/artifact-contract.md
    target: references/artifact-contract.md
    required: true
    trigger: Read this when creating, validating, repairing, or reviewing dossier artifact schemas and runtime-owned frontmatter.
  - id: ref-runtime-commands
    title: Runtime command guide
    source: references/runtime-commands.md
    target: references/runtime-commands.md
    required: true
    trigger: Read this when choosing a dossier-engineer command family, arguments, or expected operator flow.
  - id: ref-review-closure
    title: Review and closure policy
    source: references/review-and-closure.md
    target: references/review-and-closure.md
    required: true
    trigger: Read this before implementation closure, verification, audit recording, freshness checks, or behavioral evidence review.
  - id: ref-body-completion
    title: Body completion
    source: references/body-completion.md
    target: references/body-completion.md
    required: true
    trigger: Read this after creating or materially changing Markdown dossier artifacts and before stage close, handoff, PR preparation, changeset publication, or final response.
  - id: ref-parallel-development
    title: Parallel development rules
    source: references/parallel-development.md
    target: references/parallel-development.md
    required: false
    trigger: Read this when working across branches, resolving merge conflicts, or creating changesets for handoff.
  - id: ref-retrospective
    title: Retrospective protocol
    source: references/retrospective.md
    target: references/retrospective.md
    required: false
    trigger: Read this when creating retrospectives, process-miss records, skill feedback, changesets, or capability drift reports.
  - id: ref-operator-capabilities
    title: Operator capability reference
    source: references/operator-capabilities.md
    target: references/operator-capabilities.md
    required: false
    trigger: Read this when the operator asks what dossier-engineer can do, how to ask an agent to use it, which workflow fits a delivery situation, or how to phrase capability-safe prompts.

