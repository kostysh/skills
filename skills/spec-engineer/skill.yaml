      - ref-example-spec
  supportingGlobs: []

sections:
  startHere:
    - Confirm the user needs a software specification, not a PRD, implementation plan, code review, or implementation patch.
    - For every non-trivial creation, revision, or review, apply `implementation-discipline` before adding normative scope or verification depth; capture the outcome or invariant, actor or consumer and claim boundary, source-authorized scope and non-goals, permitted specification output, simplest existing implementation or verification contour, and narrowest falsifier.
    - "Distinguish draftable from handoff-ready input: readiness requires sufficient source authority, applicable accepted constraints, and a named downstream consumer."
    - Identify the parent product, system, workflow, or architecture intent the spec is meant to constrain, or label that intent as missing before drafting.
    - Inspect accepted product and architecture context, domain constraints, assumptions, criticality, and blocking ambiguity before drafting.
    - Separate observable capability from support substrate; do not let scaffolding, APIs, schemas, tests, logs, or documentation stand in for claimed behavior.
    - Do not require layers, scaffolds, config, wrappers, or future extension points unless they are necessary for the current capability or explicitly labeled substrate with a dependent capability.
    - For medium/high-risk or architecture-impacting work, inherit accepted architecture constraints and route missing or new architecture decisions instead of choosing them in the spec.
    - For high-risk backend, multi-package/component, or external-provider scope, read High-risk backend contract matrix. Apply all `HRB-*` rows only to high-risk scope; otherwise use its conditional readback before handoff.
    - Before creating or recommending a persistent implementation-ready spec, API spec, workflow spec, migration spec, spike spec, or verification map, check whether the current repository defines artifact conventions and follow them when present.
    - Choose the smallest specification depth that can guide correct implementation and verification for this task.
  whenToUse:
    - Creating or revising a specification that will guide software implementation.
    - Turning a feature request, ticket, issue, PRD section, domain rule, integration requirement, API change, migration, workflow, or function behavior into implementation-ready requirements.
    - Compressing vague source material into a compact spec with scope, behavior, constraints, acceptance criteria, anti-claims, and verification intent.
    - Right-sizing the spec for anything from a single function or endpoint to a subsystem or whole product slice.
    - Creating vertical-slice specs or spike specs when implementation needs bounded behavior, evidence, or decision-unblocking criteria.
    - Assessing or revising whether a specification is honestly ready for a named downstream consumer.
  whenNotToUse:
    - Writing a product PRD where product discovery, rollout, metrics, or business scope are the main concern instead of implementation-ready behavior; if available, route that work to prd-engineer.
    - Checking code against an existing spec rather than authoring or revising the spec; if available, route that work to spec-conformance-reviewer.
    - Reviewing whether an implementation delivers real capability instead of only substrate; if available, route that work to concept-conformance-reviewer.
    - Implementing code directly when the user did not ask for a specification and the task is already unambiguous.
    - Creating heavyweight governance, lifecycle records, project-management state, or delivery tracking artifacts instead of a specification document.
    - Producing formal methods artifacts as the primary deliverable unless the user explicitly asks for that level of rigor.
  workflow:
    - id: stage-frame-intake
      title: Frame the specification target
      goal: Turn vague intent into a bounded engineering target before writing requirements.
      steps:
        - Identify the parent product, system, workflow, or architecture intent and state how this spec's behavior advances or protects it; if the spec is substrate-only, name the capability it supports.
        - Capture the source-authorized scope and non-goals, permitted specification output, simplest existing implementation or verification contour, and narrowest falsifier before adding normative requirements.
        - Identify the system, subsystem, function, interface, actor, trigger, and production entry point when known.
        - "State the capability claim with precondition and guard when relevant: Given <precondition>, when <actor> does <trigger/action>, if <guard>, the system MUST <observable response>, creating or preserving <state/effect>, so that <continuity> holds."
        - "Apply a criticality lens: ask what the worst observable consequence is if the requirement is wrong, then increase rigor for security, money, data loss, compliance, safety, privacy, compatibility, or irreversible state."
        - Classify risk as low, medium, or high when the source material provides or implies it, and use that classification with criticality to choose spec depth.
        - List source material, authority, approval/readiness, and the named downstream consumer; same-session PRDs, architecture notes, specs, or plans are outputs rather than higher authority for their own expansion.
        - For medium/high-risk or architecture-impacting specs, capture linked PRD requirements, architecture constraints, ADRs, ASRs, delivery task brief, and existing conventions when available.
        - When the high-risk or package/provider trigger applies, load High-risk backend contract matrix. Use all `HRB-*` rows only for high-risk scope; otherwise use its conditional readback.
        - Name substrate that may be needed but is not itself the capability for this spec consumer; remember that a public API contract is capability when the API consumer is the actor.
        - Reject future-only substrate such as layers, scaffolds, config knobs, wrappers, or extension points unless a current requirement, accepted architecture constraint, or dependent capability needs it.
        - For changes to an existing system, capture the behavioral delta from current to target behavior, including compatibility, migration, and coexistence constraints.
        - Add initial anti-claims that keep the spec from implying broader behavior than requested.
      validation:
        - The spec target is tied to parent intent, or missing parent intent is recorded as an assumption, gap, or blocking question.
        - The target can be described without relying on implementation-only terms.
        - The spec scope says what is in, what is out, and what remains unknown.
        - Risk depth and inherited product, architecture, delivery, and specification context are explicit when they affect implementation.
        - Source authority, readiness, named consumer, and resulting handoff status are explicit; the spec is not more ready than its inputs.
        - Acceptance cannot be satisfied only by substrate when the claim is behavioral.
        - Future-only substrate is absent, deferred by trigger, or explicitly labeled as support work for a named dependent capability.
        - Every material normative requirement and acceptance contour traces to a higher-authority source or is explicitly marked as an unapproved gap.
        - High-criticality scope has explicit invariants, stronger falsifiers, and a verification path beyond happy-path examples.
        - A triggered spec cannot be handoff-ready while its applicable matrix/readback lacks authority, contract, falsifier/evidence, or downstream owner.
    - id: stage-map-behavior
      title: Map behavior and constraints
      goal: Cover the behavior space before committing to normative statements.
      steps:
        - Create a glossary before writing requirements for terms that repeat, carry roles, or are likely ambiguous.
        - Inventory only source-relevant main, alternate, failure, invalid-input, boundary, permission, timing, retry, concurrency, ordering, idempotency, consistency, compatibility, and observability concerns.
        - Use systematic discovery techniques when memory is not enough, especially equivalence partitions, boundary values, state transitions, fault analysis, role/abuse cases, and concurrency probes.
        - Identify domain terms, states, events, entities, inputs, outputs, side effects, invariants, assumptions, external dependencies, and temporal promises.
        - Decide which unknowns block implementation and which can be recorded as explicit assumptions or gaps.
      validation:
        - The behavior inventory includes the important non-happy paths for the scope.
        - Hidden assumptions about external systems, ordering, time, roles, or persistence are explicit.
        - Important invariants and failure semantics are not buried inside examples.
        - Concurrency, ordering, idempotency, and consistency are treated as separate concerns when any one of them matters.
    - id: stage-draft-compact-spec
      title: Draft the compact specification
      goal: Produce a concise spec at an honest handoff status without becoming process-heavy.
      steps:
        - Use the compact 6-section structure from the methodology reference for trivial scope; use the fuller structure only when the task needs it.
        - Include Architecture Context only when risk or affected boundaries make it useful for implementation correctness.
        - For spike specs, specify the question, hypothesis, validation harness, success/failure criteria, output evidence, and next decision instead of pretending the spike delivers product behavior.
        - Write a scope statement, parent intent or supported capability, glossary, capability or behavior statement, assumptions, and anti-claims.
        - Write atomic normative requirements with source trace, explicit subject, modality, action, object, condition, and measurable constraint where relevant.
        - Apply the methodology's semantic authority and removal-falsifier gate before accepting each new or changed material `MUST`; locators, downstream artifacts, observed code, tests, and later review are not proof by themselves.
        - Use the representation-fit table from the methodology reference; prefer invariants for always-true properties, and use contracts, tables, state models, NFRs, and examples only where they materially reduce ambiguity.
        - Add positive acceptance criteria, negative criteria, falsifiers, and a verification map for each important requirement.
        - For a triggered high-risk backend matrix, map every applicable `HRB-*` row to at least one executable test or real-boundary check that fails for the prohibited outcome.
        - Prefer the narrowest existing verification contour; do not require a runner, harness, orchestration layer, instrumentation, or production seam only to strengthen acceptance.
        - "Define requirement lifecycle status when revising an existing spec: new, changed, superseded, deprecated, or removed."
        - Record open questions and gaps without letting non-blocking gaps stop useful specification work.
      validation:
        - Every important requirement is falsifiable by demonstration, inspection, analysis, contract validation, schema validation, property-based checks, example-based tests, or another explicit method.
        - A failed semantic derivation or removal falsifier leaves the material `MUST` unresolved and blocks a ready handoff.
        - If a requirement can produce two independently verifiable acceptance criteria, it has been split.
        - Acceptance criteria prove real behavior and include at least one negative or falsifier for self-deception risk.
        - The high-risk backend test inventory covers every applicable matrix row without using happy-path, mock-only, schema-presence, generated-file, or self-authored evidence to close a stronger claim.
        - Anti-claims prevent scope inflation and make clear what the spec does not promise.
    - id: stage-audit-spec
      title: Audit and right-size
      goal: Improve precision without adding ceremony that distracts from building correct code.
      steps:
        - Run the Quality audit checklist from the methodology reference before reporting done.
        - Repeat the scope-and-simplicity gate when a material draft delta adds a requirement, boundary, lifecycle, output, edge-case family, or verification contour.
        - Check whether the spec discovered architecture drift; stop for blocking drift or record an architecture delta needed when implementation can safely proceed.
        - Scan for ambiguous terms, vague adjectives, compound requirements, hidden implementation decisions, duplicate rules, missing failure behavior, missing invalid inputs, and examples that contradict rules.
        - Check self-deception patterns such as tautological acceptance, mock-driven success, single-actor blindness, hidden retroactive scope, and completion bias.
        - For either trigger, reject readiness when the applicable matrix/readback is omitted, uses unsupported `not_applicable`, or lacks a negative oracle/evidence owner.
        - Remove sections, tables, or process language that do not constrain implementation or verification.
        - Strengthen under-specified NFRs with metric, threshold, measurement object, and measurement window.
        - Apply the Stop rules before finalizing.
      validation:
        - The final spec is as small as possible while still reducing implementation guesses.
        - The spec has no known contradictions between prose, rules, examples, tables, schemas, or state transitions.
        - Architecture constraints are inherited or routed; they are not silently invented.
        - Remaining risks are visible as assumptions, gaps, anti-claims, or open questions.
        - If verification infrastructure would exceed the authorized behavior change, the claim or design was narrowed and any remaining edge is marked unproven rather than stabilized with invented runtime scope.
  interop:
    - id: interop-implementation-discipline
      domain: source-authorized scope, simplest sufficient specification, self-expansion prevention, and proportional evidence
      winner: implementation-discipline
      rationale: implementation-discipline supplies the cross-cutting authoring gate; spec-engineer remains the owner of behavior, edge cases, falsifiers, and verification maps.
    - id: interop-prd
      domain: product scope, users, scenarios, success criteria, and product acceptance framing
      winner: prd-engineer
      rationale: prd-engineer owns product intent and gaps; this skill consumes accepted product basis when producing implementation-ready behavior.
    - id: interop-architecture
      domain: architecture boundaries, ASRs, pattern decisions, ADRs, quality scenarios, and architecture drift
      winner: architecture-engineer
      rationale: architecture-engineer owns architecture decisions and handoff; this skill inherits those constraints and routes drift back instead of deciding architecture inside a spec.
    - id: interop-delivery-planning
      domain: vertical slices, task briefs, sequencing, dependencies, and risk routing
      winner: delivery-planner
      rationale: delivery-planner owns decomposition and sequencing; this skill may specify a slice or task but does not create the delivery plan.
    - id: interop-conformance
      domain: checking implementation evidence against an existing spec
      winner: spec-conformance-reviewer
      rationale: spec-conformance-reviewer owns conformance review after a spec exists; this skill owns authoring or revising the spec.
    - id: interop-concept-conformance
      domain: independent design-time concept alignment and false-capability risk
      winner: concept-conformance-reviewer
      rationale: concept-conformance-reviewer owns the independent verdict; this skill owns repairing the specification requirements and acceptance criteria.
    - id: interop-domain
      domain: framework, security, data, financial, regulatory, infrastructure, or other specialized technical facts
      winner: the relevant domain skill
      rationale: domain skills own specialized facts and constraints; this skill records accepted facts without inventing them.
  commands: []
  gotchas:
    - id: gotcha-spec-is-not-substrate
      priority: high
      text: A spec is useful only if it constrains observable behavior; a template, section list, or artifact path is substrate until the requirements are precise and falsifiable.
    - id: gotcha-no-false-capability
      priority: high
      text: Do not let acceptance criteria pass through mocks, generated docs, schemas, wrappers, or tests alone when the claim is user-, operator-, integration-, or system-observable behavior.
    - id: gotcha-local-spec-drift
      priority: high
      text: Do not make a locally precise spec that drifts from the parent product, system, workflow, or architecture intent without calling out the conflict.
    - id: gotcha-avoid-template-bloat
      priority: high
      text: Do not force every section onto small tasks; use the smallest structure that removes implementation ambiguity.
    - id: gotcha-no-future-substrate
      priority: high
      text: Do not specify layers, scaffolds, wrappers, config knobs, or extension points for future flexibility unless they are required by current behavior, accepted architecture, or an explicitly labeled substrate task with a dependent capability.
    - id: gotcha-examples-need-rules
      priority: medium
      text: Examples and Gherkin/BDD scenarios clarify boundaries only when representation-fit justifies them; they do not replace normative rules unless the user explicitly wants executable specifications as the source of truth.
    - id: gotcha-implementation-detail
      priority: medium
      text: Do not specify implementation mechanisms such as a specific database, cache, queue, framework, or algorithm unless they are real constraints, externally visible compatibility requirements, or explicitly requested decisions.
    - id: gotcha-no-architecture-invention
      priority: high
      text: Do not turn missing architecture decisions into spec requirements; route public contracts, data model, security boundary, tenancy, integration topology, deployment, rollback, or selected pattern changes to architecture.
    - id: gotcha-test-default
      priority: medium
      text: Do not use tests as the default verification answer when inspection, analysis, contract validation, simulation, or conformance suites prove the claim more directly.
    - id: gotcha-public-contract-drift
      priority: high
      text: Do not introduce or preserve public routes, enum values, statuses, action names, or history events without an owning source, domain meaning, forbidden values, and falsifiers.
  policies:
    - id: policy-lightweight-first
      title: Lightweight-first policy
      text: A one-page spec is better than a complete template when it captures the behavior, rules, edge cases, and verification path needed for correct code. Add structure only when it removes a concrete ambiguity or defect class.
    - id: policy-no-future-substrate
      title: No future-substrate policy
      text: A specification must not require scaffolding, wrappers, layers, config surfaces, or extension points only because they might be useful later. Keep them out, defer them by an explicit trigger, or label them as substrate tied to a named dependent capability.
    - id: policy-parent-intent
      title: Parent intent policy
      text: A specification constrains implementation in service of a parent product, system, workflow, or architecture intent. Local requirement precision is insufficient when the spec does not advance or protect that intent; record missing intent as an assumption, gap, or blocking question instead of inventing it.
    - id: policy-repository-artifact-conventions
      title: Repository artifact conventions policy
      text: Before producing a persistent specification, check repository conventions for location, IDs, metadata, source links, and indexes. Follow them when present; otherwise use this skill's Markdown output contract. Never hard-code one repository's paths into this skill.
    - id: policy-risk-depth
      title: Risk-depth policy
      text: Low-risk specs can stay compact; medium-risk specs need enough behavior, edge cases, inherited constraints, and verification mapping for coordination; high-risk specs need explicit invariants, negative/falsifier coverage, rollback or compatibility semantics, stronger gates, and routed specialist review triggers.
    - id: policy-architecture-context
      title: Architecture context policy
      text: Include architecture context only when it constrains implementation or verification. Treat linked ASRs, ADRs, pattern decisions, and architecture handoff as inherited sources, not as decisions created by the spec.
    - id: policy-modality
      title: Normative language policy
      text: Use uppercase MUST for required behavior, MUST NOT for forbidden behavior, SHOULD for recommended behavior with known exceptions, and MAY for optional behavior. Treat CAN as descriptive capability language, not normative modality, and do not mix normative and descriptive wording in the same sentence.
    - id: policy-atomic-requirements
      title: Atomic requirement policy
      text: Each normative requirement should express one obligation with an explicit subject, condition, action, object, and constraint. Split compound requirements before adding acceptance criteria.
    - id: policy-event-payload-contracts
      title: Event payload contract policy
      text: Runtime history or audit events must define purpose, bounded result/status, safe payload fields, forbidden data, and consumer usefulness. Events that only say an action happened are incomplete unless their explicit purpose is access accountability.
    - id: policy-representation-fit
      title: Representation-fit policy
      text: >-
        The canonical representation-fit table lives in the methodology
        reference. In SKILL.md, remember the rule of thumb only: choose the
        lightest representation that removes the concrete ambiguity or defect
        class, and prefer invariants whenever a behavior can be stated as an
        always-true property.
    - id: policy-bdd-fit
      title: BDD fit policy
      text: >-
        Use BDD/Gherkin only when scenarios materially clarify behavior, guards,
        failures, continuity, or acceptance risk. They must not replace atomic
        requirements, negative acceptance, falsifiers, or verification. Prefer a
        more direct representation and avoid BDD for trivial or substrate-only
        scope.
    - id: policy-verification-map
      title: Verification map policy
      text: Every important requirement needs a verification path such as demonstration, inspection, analysis, contract validation, schema validation, property-based checks, example-based tests, or executable scenarios. For a material cross-layer claim, apply the lifecycle-map rule in the required methodology reference. If verification is not currently possible, the spec must say why.
    - id: policy-stop-rules
      title: Stop rules
      text: |-
        Stop and ask the user when:

        - a behavior-changing source conflict remains unresolved after applying authority and readiness precedence;
        - the requested spec scope conflicts with known parent product, system, workflow, or architecture intent in a behavior-changing way;
        - implementation would require choosing between incompatible product, security, privacy, compliance, data-loss, or compatibility outcomes;
        - the spec would make a capability claim that can only be proven by substrate evidence;
        - the spec would require changing a public contract, data model, auth/security boundary, tenant isolation, integration topology, deployment model, rollback path, or selected architecture pattern not covered by accepted architecture context;
        - a required external contract is missing and cannot be inferred safely.

        Do not stop for minor unknowns. Record them as assumptions, non-blocking gaps, validation gaps, or architecture delta needed.
    - id: policy-output-language
      title: Output language policy
      text: Produce the specification in the user's working language unless the target repository, existing spec corpus, or user request clearly requires another language.
    - id: policy-output-contract
      title: Output contract
      text: |-
        The deliverable is a Markdown specification. Include at minimum:

        - title;
        - handoff status: `draft`, `blocked`, or `ready for <consumer>`;
        - named downstream consumer;
        - scope;
        - source context, authority, and readiness;
        - parent intent or supported capability;
        - risk or criticality;
        - architecture context when medium/high risk or architecture-impacting scope requires it;
        - terms;
        - behavior or capability statement;
        - assumptions;
        - anti-claims;
        - atomic requirements with source trace;
        - acceptance criteria with negative or falsifier coverage;
        - verification map;
        - open questions, gaps, or architecture delta needed.

        Omit or collapse sections only when the result remains clear and
        falsifiable at its declared handoff status. Completing the specification
        does not demonstrate implementation progress, runtime behavior, or
        release readiness.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory spec-engineer guidance inside this skill folder.
      - Use relative links for local references and supporting docs.
      - Treat external standards or reports as optional background; do not make them required to use the skill.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
