apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: spec-engineer
  source-version: 0.2.13
  recommended-skill-md-max-bytes: 28000
  description: >-
    Create concise, falsifiable software specs for AI coding agents. Use to turn
    ideas, tickets, APIs, domain rules, migrations, workflows, or function behavior
    into implementation-ready Markdown with observable requirements, acceptance
    evidence, anti-claims, source authority, and handoff readiness.
  compatibility: >-
    Portable, self-contained documentation-only skill. It ships no runtime and
    keeps all method instructions required to create specifications inside this
    folder.

fragments:
  overview: fragments/overview.md

references:
  - id: ref-methodology
    title: Specification methodology
    source: references/methodology.md
    target: references/methodology.md
    required: true
    trigger: Read this when drafting or materially revising a software specification.
  - id: ref-high-risk-backend-contract
    title: High-risk backend contract matrix
    source: references/high-risk-backend-contract.md
    target: references/high-risk-backend-contract.md
    required: false
    trigger: Read this before drafting, revising, or accepting a high-risk backend specification involving a public API, persistent state, authorization, money, retries, external resources, audit evidence, multiple packages, or an external provider.
  - id: ref-patterns
    title: Specification patterns
    source: references/spec-patterns.md
    target: references/spec-patterns.md
    required: false
    trigger: Read this when choosing the minimal structure for a feature, vertical slice, spike, API endpoint, validation rule, workflow, migration, or non-functional constraint.
  - id: ref-discovery-techniques
    title: Discovery techniques
    source: references/discovery-techniques.md
    target: references/discovery-techniques.md
    required: false
    trigger: Read this when behavior inventory feels checklist-driven, risk is high, or you need systematic edge-case discovery.
  - id: ref-anti-patterns
    title: Self-deception anti-patterns
    source: references/anti-patterns.md
    target: references/anti-patterns.md
    required: false
    trigger: Read this before finalizing a spec with vague acceptance, mocks, substrate evidence, happy-path bias, or ambiguous terms.
  - id: ref-example-spec
    title: Worked example specification
    source: references/example-spec.md
    target: references/example-spec.md
    required: false
    trigger: Read this when you need a small input-to-output example of the expected final specification artifact.

