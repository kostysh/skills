sections:
  startHere:
    - "Confirm the request is a bounded security review, exploitability triage, or scoped formal audit rather than implementation, standards compliance, or scan orchestration."
    - "Read references/methodology.md, select targeted, formal, or re-audit mode, and establish a stable review basis before drawing conclusions."
    - "Keep the review read-only by default; research exploitability before reporting and do not flag findings from pattern matching alone."
    - "Load only the optional references triggered by the reviewed surfaces and state any missing evidence or residual risk."
  whenToUse:
    - "Targeted security review, vulnerability finding, or exploitability triage for an identifiable code or configuration scope."
    - "Authn, authz, sessions, tokens, secrets, permissions, webhooks, CI, Supabase RLS, app-layer data-access construction, or sensitive input-to-sink flows."
    - "Scoped formal security audit or remediation re-audit when the target, snapshot, and requested assurance can be established."
  whenNotToUse:
    - "General non-security code quality review without a security objective."
    - "Implementing a fix or pure framework guidance owned by a domain or implementation skill."
    - "A full PR, repository, or deep multi-pass scan when a dedicated security scan orchestrator is available."
    - "ASVS or another standards-compliance verdict or implementation-to-control-set mapping, whether or not a versioned control set is supplied; route that work to spec-conformance-reviewer."
    - "UI, accessibility, shell portability, or style review with no security angle."
  workflow:
    - id: "stage-review-basis"
      title: "Establish the review basis"
      goal: "Make the requested review reproducible and prevent a stronger conclusion than the available inputs support."
      steps:
        - "Record targeted, formal, or re-audit mode; the stable commit, diff, content hash, or exact supplied artifact; report scope; and wider research scope."
        - "Identify actors, assets, trust boundaries, authoritative requirements or exceptions, available runtime/config evidence, and any prior findings."
        - "Use the default threat model only as a labeled exploration hypothesis when project-specific authority is missing."
        - "Return BLOCKED when the target or snapshot is unavailable or unstable; use INCOMPLETE when review can proceed but required coverage or evidence remains missing."
      validation:
        - "Another reviewer can reconstruct the target, snapshot, report scope, research scope, threat model, inputs, and evidence limitations."
        - "Missing evidence never becomes FAIL by itself, and absent authority never becomes an invented security requirement."
    - id: "stage-security-analysis"
      title: "Analyze security paths"
      goal: "Find exploitable weaknesses with confidence gating and line-referenced evidence."
      steps:
        - "Identify reviewed surfaces, stack, trust boundaries, identities, secrets, privileged actions, and sensitive sinks."
        - "Apply the bounded auth-admission checkpoint when route admission, replay, idempotency, or pre-auth resource use changes."
        - "Apply the bounded policy-governance admission checkpoint only when external invocation, admission/approval executable capability, policy activation, active-scope selection, governance/audit preconditions, fail-closed gates, or security-relevant replay/idempotency controls change."
        - "Apply the data-access construction checkpoint when backend code reads or writes a database, constructs REST/PostgREST filters, uses Supabase clients, calls RPC, uses query builders, touches storage keys, or reaches service-role clients."
        - "Trace attacker-controlled input or identity to a missing control or sensitive sink."
        - "Check surrounding mitigations, framework defaults, and deployment constraints before reporting."
        - "Classify confidence and severity; keep unresolved stack or runtime facts in needs verification rather than promoting them to findings."
      validation:
        - "Reported findings have confirmed attacker control, reachability, impact, evidence, and fix direction."
        - "Backend/database audits name whether raw SQL, REST/PostgREST construction, SDK query builders, RPC, and service-role paths were inspected; database security is not claimed complete when server-side data-access construction was out of scope."
        - "Policy-governance findings state the relevant actor/control path or security-relevant operator/control-plane impact, including replay semantics and authority binding when those decide executable capability."
        - "Low-confidence, theoretical, test-only, comment-only, or mitigated patterns are not reported by default."
    - id: "stage-evidence-close-out"
      title: "Close out with calibrated evidence"
      goal: "Return a security result whose status, coverage, and downstream ownership cannot be mistaken for broader proof."
      steps:
        - "Report the review basis, confirmed findings, needs verification, inspected and uninspected surfaces, residual risk, and evidence limits."
        - "In targeted mode, report findings or no confirmed findings in reviewed scope without issuing PASS."
        - "In formal mode, use FAIL only for confirmed in-scope findings, PASS (scoped) only for a complete named security-review scope, INCOMPLETE for missing mandatory coverage/evidence, and BLOCKED for an unavailable or unstable basis."
        - "Do not issue an overall merge recommendation; hand confirmed security blockers and residual risk to code-reviewer when merge guidance is requested."
      validation:
        - "Status follows the evidence contract and cannot imply penetration testing, full scan coverage, standards compliance, or whole-system security; standards/control fulfillment always belongs to spec-conformance-reviewer."
        - "No reviewed-and-cleared claim rests only on grep, source-text assertions, mocks, fixtures, or green unit tests that do not exercise the claimed boundary."
    - id: "stage-remediation-reaudit"
      title: "Re-audit a remediated snapshot"
      goal: "Verify accepted fixes without editing the target or reusing a stale verdict."
      steps:
        - "Map each prior finding to the concrete change, current evidence, and status on a new stable snapshot."
        - "Re-test the original attack path and adjacent regression surface; preserve unresolved items as needs verification or confirmed findings."
        - "Invalidate the prior result after any material code, configuration, runtime, test, or evidence change."
      validation:
        - "The reviewer remains read-only and every closure claim is tied to the new snapshot and current evidence."
  interop:
    - id: "interop-security"
      domain: "security threat model, exploitability, confidence thresholds, and vulnerability reporting"
      winner: "security-reviewer"
      rationale: "This skill owns security findings and reporting discipline."
    - id: "interop-domain-skills"
      domain: "framework/runtime facts and remediation detail"
      winner: "the relevant domain skill"
      rationale: "Domain skills own framework behavior and remediation implementation, while this skill decides whether the issue is exploitable and reportable and later re-audits the result."
    - id: "interop-code-reviewer"
      domain: "non-security review flow and general merge-risk findings"
      winner: "code-reviewer"
      rationale: "Move non-security findings and every overall merge recommendation to code-reviewer when both skills are active."
    - id: "interop-spec-conformance"
      domain: "mapping implementation to an explicit security standard or versioned control set"
      winner: "spec-conformance-reviewer"
      rationale: "spec-conformance-reviewer owns requirement coverage and compliance status; security-reviewer owns exploitability and vulnerability classification."
    - id: "interop-scan-orchestration"
      domain: "Git-backed diff scans, repository scans, deep multi-pass scans, and durable scan artifacts when a dedicated orchestrator is available"
      winner: "security-diff-scan, security-scan, or deep-security-scan"
      rationale: "The scan skill owns traversal and canonical scan artifacts; security-reviewer must not run a parallel scan or issue a competing scan verdict."
  commands: []
  gotchas:
    - id: "gotcha-stale-audit-scope"
      priority: "high"
      text: "A PASS on an old diff is not evidence for a changed implementation. If files or behavior changed after the audit, perform a delta review on the new scope before reporting PASS."
    - id: "gotcha-incomplete-is-not-fail"
      priority: "high"
      text: "Do not use FAIL merely because the target, coverage, runtime facts, or evidence are missing; use INCOMPLETE or BLOCKED according to the status contract."
    - id: "gotcha-no-merge-verdict"
      priority: "high"
      text: "Do not issue an overall merge recommendation from security-reviewer, especially from MEDIUM-confidence or needs-verification items; route merge guidance to code-reviewer."
    - id: "gotcha-scoped-pass"
      priority: "high"
      text: "PASS is always scoped to the recorded snapshot and named coverage; it is not proof of whole-system security, standards compliance, penetration testing, or exhaustive scanning."
    - id: "gotcha-evidence-artifact-leak"
      priority: "high"
      text: "Review screenshots, status-site evidence, history payloads, logs, and problem responses for secrets, raw provider payloads, tokens, cookies, OTP, and unnecessary PII; code-only security review is insufficient for evidence-bearing changes."
  policies:
    - id: "policy-audit-scope-contract"
      title: "Audit scope contract"
      text: "A security audit must name the exact diff, commit, hash, or supplied-artifact scope; research scope; actors and trust boundaries; external surfaces; data-access construction; sensitive-data checks; and current evidence artifacts reviewed. If mandatory scope or evidence is missing, report INCOMPLETE; if the basis is unavailable or unstable, report BLOCKED."
    - id: "policy-read-only-review"
      title: "Read-only review boundary"
      text: "Security review is read-only by default. A separate domain or implementation owner applies remediation only when explicitly authorized, and security-reviewer re-audits the resulting stable snapshot."
    - id: "policy-status-contract"
      title: "Security status contract"
      text: "Targeted review never emits PASS. Formal FAIL requires a confirmed in-scope finding; PASS (scoped) requires a complete named security-review scope and no confirmed findings; INCOMPLETE represents missing mandatory coverage or evidence; BLOCKED represents an unavailable or unstable review basis. Standards/control fulfillment and compliance status always belong to spec-conformance-reviewer."
  portability:
    required: true
    rules:
      - "Do not reference machine-specific absolute paths or local files outside this skill folder."
      - "Keep all mandatory security-reviewer guidance inside this skill folder."
      - "Use relative links for local references, assets, scripts, tests, and supporting docs."
    checklist:
      - "Run the skill-source-compiler check command after regeneration."
      - "Search the skill folder for absolute local paths before finishing."
      - "Confirm every required reference listed by SKILL.md exists inside this skill folder."
