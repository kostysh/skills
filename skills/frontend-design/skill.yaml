    title: Anti Patterns
    source: references/anti-patterns.md
    target: references/anti-patterns.md
    required: false
    trigger: Read this when output feels generic, overdesigned, weakly grounded, or at risk of substrate-only closure.
  - id: ref-references-surface-modes
    title: Surface Modes
    source: references/surface-modes.md
    target: references/surface-modes.md
    required: false
    trigger: Read this when surface type or the design-system constraint profile is ambiguous.
  - id: ref-references-visual-engines
    title: Visual Engines
    source: references/visual-engines.md
    target: references/visual-engines.md
    required: false
    trigger: Read this after classifying the surface when the primary visual engine is not already established.
  - id: ref-strategy-to-implementation
    title: Strategy To Implementation
    source: references/strategy-to-implementation.md
    target: references/strategy-to-implementation.md
    required: false
    trigger: Read this for non-trivial strategy, system-constrained work, implementation handoff, or runtime completion claims.
