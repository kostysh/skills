apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: frontend-design
  source-version: 0.2.1
  recommended-skill-md-max-bytes: 20000
  description: >-
    Design and implement visually strong web interfaces and decision-complete
    design strategies. Use for landing pages, product UI, dashboards,
    prototypes, redesigns, or translating accepted design into code. Preserve
    authoritative behavior and existing systems, then verify rendered results.
