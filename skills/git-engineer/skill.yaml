surfaces:
  active:
    requiredReferences: []
    optionalReferences:
      - ref-worktrees
  supportingGlobs:
    - docs/*
    - docs/logs/*
sections:
  startHere:
    - Confirm the task concerns Git state or history and identify the exact requested operation and target.
    - Before mutation, resolve operator authority and repository policy, then inspect the relevant branch, HEAD, index, worktree, upstream, remote, and in-progress operation state.
    - Before choosing, creating, or moving a worktree, load the worktree operations reference and apply its repo-local default and external-root confirmation gate.
    - Preserve unrelated operator-owned work and verify the resulting local or remote refs before claiming completion.
  whenToUse:
    - Staging, committing, amending, splitting, or validating commits and commit messages.
    - Creating, switching, comparing, or cleaning up branches and worktrees.
    - Choosing or executing local merge, rebase, cherry-pick, revert, or safe push workflows.
    - Supplying repository-approved history semantics and exact branch/ref facts to a GitHub-owning skill.
  whenNotToUse:
    - GitHub repository, issue, pull-request, check, label, Actions, release, or settings work without a local Git-history decision; use gh-utility.
    - Code-review findings, approval, severity, or merge-readiness judgment; use code-reviewer.
    - Diagnosing or fixing failing GitHub pull-request checks; use gh-fix-ci.
    - The task does not involve Git state, history, refs, commits, branches, worktrees, or push policy.
    - The operator forbids the Git operation required to satisfy the request; report the constraint instead of substituting another mutation.
  workflow:
    - id: stage-establish-authority-and-state
      title: Establish authority and repository state
      goal: Resolve the exact authorized operation, target, policy, and pre-mutation evidence.
      steps:
        - Apply explicit operator instructions, repository policy, and the operation-specific readiness rules from the overview.
        - Inspect the relevant repository root, branch, HEAD, index, worktree, upstream, remotes, refs, and in-progress operation state.
        - Stop before mutation when authority, target, destructive scope, ownership, protection, or preservation of unrelated state remains materially ambiguous.
      validation:
        - The exact operation, target, initial state, and authority are explicit.
    - id: stage-execute-smallest-safe-operation
      title: Execute the smallest safe Git operation
      goal: Produce only the intended Git-state change while preserving unrelated operator-owned work.
      steps:
        - Apply repository commit policy first; otherwise use Conventional Commits with the default type emoji.
        - Stage or rewrite only the intended paths, hunks, commits, branches, or refs and inspect the operation-specific delta before finalizing it.
        - Preserve unrelated state, stop honestly on conflicts or failed leases, and do not auto-stash, reset, clean, or broaden the mutation to manufacture a clean result.
      validation:
        - The resulting delta matches the requested scope, and unresolved conflicts or residual changes remain visible.
    - id: stage-verify-and-handoff
      title: Verify terminal state and hand off
      goal: Match completion status to freshly observed local and remote evidence.
      steps:
        - Re-read the resulting branch, HEAD, commit, index, worktree, and relevant refs; after a push, freshly read the remote destination ref.
        - Classify the outcome as verified, partial, or blocked using the overview output contract.
        - Report actions actually taken, exact OIDs, checks, preserved residual state, conflicts, evidence limits, and the smallest next action.
      validation:
        - A shown command, clean status, local tracking ref, or unavailable verification is not reported as completed evidence.
  interop:
    - id: interop-github
      domain: GitHub repositories, issues, pull requests, checks, labels, Actions, platform merges, and other GitHub resource state
      winner: gh-utility
      rationale: git-engineer owns local history semantics and branch/ref facts; gh-utility owns GitHub execution, targeting, and fresh platform-state verification.
    - id: interop-review
      domain: Code-review findings, severity, approval, and merge-readiness judgment
      winner: code-reviewer
      rationale: git-engineer may execute an authorized Git action but does not issue a review verdict.
    - id: interop-ci
      domain: Diagnosis and remediation of failing GitHub pull-request checks
      winner: gh-fix-ci when available
      rationale: git-engineer supplies relevant local commit and branch state; the specialized CI skill owns diagnosis and fixes.
  commands: []
  gotchas:
    - id: gotcha-clean-is-not-scope
      priority: high
      text: A globally clean worktree is not required for a scoped Git operation; preserve and report unrelated changes instead of stashing, resetting, cleaning, or committing them.
    - id: gotcha-command-is-not-result
      priority: high
      text: A command, exit code, local tracking ref, or generated report is not proof of the requested terminal state; inspect the resulting commit, refs, and fresh remote state as applicable.
    - id: gotcha-implicit-force-lease
      priority: high
      text: An implicit --force-with-lease can be defeated by background fetch; bind a named destination ref to the exact expected remote OID.
    - id: gotcha-external-worktree-root
      priority: high
      text: An outside-repository path in repository documentation or an existing shared worktree directory is not authority to use it without explicit operator confirmation.
  policies:
    - id: policy-authorization
      title: Operation-specific authorization
      text: Inspection does not authorize mutation; commit does not authorize push; push does not authorize a pull request; rewrite, deletion, conflict resolution, and destructive cleanup require explicit operator or repository authority for the named target.
    - id: policy-commit-default
      title: Conventional Commits with emoji by default
      text: Explicit operator instructions win, followed by mandatory repository policy and a clear consistent repository convention; otherwise use the portable Conventional Commit format and default type-to-emoji mapping from the overview.
    - id: policy-preserve-operator-state
      title: Preserve unrelated state
      text: Stage, commit, rewrite, move, or push only the intended scope. Do not reset, restore, clean, auto-stash, or absorb unrelated operator-owned work merely to produce a clean status.
    - id: policy-repository-local-worktrees
      title: Repository-local worktrees by default
      text: Unless the operator explicitly chooses another location or confirms a justified external exception, create task worktrees under `<repository-root>/.worktrees/<task-slug>` and report the canonical path for review.
    - id: policy-force-push-safety
      title: Force-push safety
      text: Rewrite only an explicitly authorized owned non-protected task branch, bind the named destination ref to its observed expected remote OID with an explicit force-with-lease, use an explicit source/destination refspec, and freshly verify the remote ref after success.
    - id: policy-evidence-status
      title: Evidence-calibrated completion
      text: Report verified only after observing the claimed terminal state; use partial when an action occurred but required evidence is unavailable, and blocked when safe completion requires missing authority, facts, conflict resolution, credentials, or external-state change.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory git-engineer guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm the skill remains understandable without placeholder reference files.
