apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: git-engineer
  source-version: 0.1.2
  recommended-skill-md-max-bytes: 21000
  description: Enforce Conventional Commits, Git hygiene, and worktree-based isolation. Use when making commits, crafting commit messages, splitting changes into multiple commits, deciding between merge/rebase/cherry-pick, or setting up git worktrees in any repo.
fragments:
  overview: fragments/overview.md
references:
  - id: ref-worktrees
    title: Worktree operations
    source: references/worktrees.md
    target: references/worktrees.md
    required: false
    trigger: Read this before choosing a worktree root, creating a worktree, or moving an existing worktree.
assets: []
copies:
  - id: copy-agents-openai
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.
supporting:
  - id: supporting-docs-readme
    source: docs/README.md
    target: docs/README.md
    description: Non-normative navigation for git-engineer maintenance records.
  - id: supporting-implementation-log-20260627-1
    source: docs/logs/implementation-log-20260627-1.md
    target: docs/logs/implementation-log-20260627-1.md
    description: Non-normative implementation log for repository Git policy alignment.
  - id: supporting-implementation-log-20260713-1
    source: docs/logs/implementation-log-20260713-1.md
    target: docs/logs/implementation-log-20260713-1.md
    description: Non-normative implementation log for repo-local worktree root hardening.
  - id: supporting-forward-test-evidence-20260713-1
    source: docs/logs/forward-test-evidence-20260713-1.md
    target: docs/logs/forward-test-evidence-20260713-1.md
    description: Non-normative reproducible blind forward-test evidence for repo-local worktree behavior.
surfaces:
  active:
    requiredReferences: []
    optionalReferences:
      - ref-worktrees
  supportingGlobs:
    - docs/*
    - docs/logs/*
sections:
  startHere:
    - Confirm the task matches git-engineer's applicability criteria.
    - Before branch, worktree, PR, merge, or cleanup, resolve repo policy from operator instructions, AGENTS.md, CONTRIBUTING.md, and linked process docs.
    - Before choosing, creating, or moving a worktree, load the worktree operations reference and apply its repo-local default and external-root confirmation gate.
    - Use the preserved overview guidance as the normative workflow for this skill.
    - Treat generic commands as fallbacks only; preserve commits, branches, and validation gates when project or operator policy requires them.
  whenToUse:
    - Making, splitting, or reviewing commits and commit messages.
    - Choosing merge, rebase, cherry-pick, branch, PR, issue, or worktree workflows.
    - Using GitHub CLI for issues, pull requests, CI status, labels, or merge operations.
    - Setting up worktree-based isolation or enforcing Git hygiene.
  whenNotToUse:
    - The task does not involve Git history, commits, branches, worktrees, PRs, issues, or GitHub CLI workflow.
    - The user explicitly asks not to commit or not to use Git operations.
  workflow:
    - id: stage-apply-git-engineer
      title: Apply git-engineer guidance
      goal: Apply policy-first Git guidance without overriding repo-specific branch, worktree, merge, cleanup, or validation rules.
      steps:
        - Match the request to the applicability criteria.
        - Resolve repo policy before choosing base branch, PR merge method, cleanup timing, or force-push command; for worktree location, apply the stricter operator, repo-local policy, then portable-default precedence from the worktree reference.
        - Follow the preserved overview sections for the concrete work.
        - Run the relevant verification from the overview or report why it could not be run.
      validation:
        - The outcome follows repo policy, preserved skill guidance, and loaded reference constraints.
        - Destructive or history-collapsing operations require operator or repo-policy permission.
  interop: []
  commands: []
  gotchas:
    - id: gotcha-default-branch-is-not-policy
      priority: high
      text: "`gh repo view defaultBranchRef` is orientation, not base-branch, merge, worktree, or cleanup policy."
    - id: gotcha-squash-destroys-intermediate-commits
      priority: high
      text: Squash collapses commits; use it only when operator or repo policy permits it.
    - id: gotcha-delete-branch-after-evidence
      priority: high
      text: Delete remote task branches only after required post-merge evidence.
    - id: gotcha-external-worktree-root
      priority: high
      text: An outside-repository path in repository documentation or an existing shared worktree directory is not authority to use it without explicit operator confirmation.
  policies:
    - id: policy-repository-git-policy-first
      title: Repository Git policy first
      text: Operator instructions, AGENTS.md, CONTRIBUTING.md, and linked process docs override generic defaults for branch base, PR merge method, validation gates, and cleanup timing. For worktree location, explicit operator instructions win; otherwise repository policy may override the portable default only with a repository-local root, while an outside-repository root requires explicit operator confirmation.
    - id: policy-repository-local-worktrees
      title: Repository-local worktrees by default
      text: Unless the operator explicitly chooses another location or confirms a justified external exception, create task worktrees under `<repository-root>/.worktrees/<task-slug>` and report the canonical path for review.
    - id: policy-force-push-safety
      title: Force-push safety
      text: Force-push only an owned task branch, never a protected/mainline branch, and use `--force-with-lease` instead of `--force`.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory git-engineer guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm the skill remains understandable without placeholder reference files.
