sections:
  startHere:
    - Confirm the task is about maintaining or extending this dossier/backlog skill.
    - Read the required active references relevant to the contract you are changing.
    - Treat this skill as a shipped runtime with one supported `.dossier` + `docs/ssot` layout and one supported launcher.
  whenToUse:
    - Define or refine the architecture that combines backlog truth and dossier delivery workflow.
    - Maintain the skill artifact model, command surface, or runtime behavior.
    - Implement or review CLI behavior, source-review flows, stage controllers, or help/runtime contracts.
  whenNotToUse:
    - The task belongs only to a different skill and does not affect this skill or its runtime.
    - The task depends on an unsupported repository layout or launcher outside the canonical `.dossier` + `docs/ssot` model.
  workflow:
    - id: stage-confirm-status
      title: Confirm shipped-runtime scope
      goal: Prevent the active instructions from overclaiming what the shipped runtime actually supports today.
      steps:
        - Verify whether the task changes runtime code, tests, active references, or other skill files.
        - Refuse to document runnable commands unless a shipped runtime and tests exist in this skill.
        - Remove unsupported layout or launcher claims instead of preserving transition-era wording.
      validation:
        - No speculative CLI contract appears in the active instructions.
        - The active instructions remain honest about canonical shipped scope.
    - id: stage-maintain-unified-model
      title: Maintain the model
      goal: Keep the architecture deterministic and non-destructive.
      steps:
        - Preserve the accounting versus project-SSOT artifact split.
        - Preserve the invariant `one feature = one backlog item`.
        - Keep `change-proposal`, `contract-drift-audit`, `backlog impact verdict`, `coverage_gate`, and strict closure semantics in scope.
        - Keep implementation post-close backlog hygiene evidence explicit after closure and before branch-complete reporting or next-intake recommendation.
        - Keep delivery workflow, telemetry identity, and closure truth explicit rather than collapsing them into backlog-only state or speculative command prose.
        - "Preserve the commandized stage-control model: primary delivery stages become mechanical controllers, while closure and helper commands stay separate."
      validation:
        - No tracked feature disappears from the current canonical model.
        - "`.dossier` and `docs/ssot` remain semantically distinct."
        - Delivery state, `coverage_gate`, freshness, and closure remain separate axes.
        - Stage-controller boundaries stop at `ready_for_close`; authoritative closure remains helper-driven.
    - id: stage-apply-implementation-discipline
      title: Apply implementation discipline to runtime changes
      goal: Keep runtime changes simple, local, and explicitly verified.
      steps:
        - When the task changes runtime code or code-backed tests, also use the `implementation-discipline` skill.
        - Prefer the smallest runtime change that satisfies the requirement instead of adding speculative abstractions.
        - Keep the diff surgical and tie validation to concrete command behavior, type checks, or docs-contract checks.
      validation:
        - Runtime/code changes stay narrowly scoped and explicitly verified.
        - Implementation or review work does not silently bypass `implementation-discipline`.
  interop:
    - id: interop-merged-runtime
      domain: shipped runtime behavior
      winner: "`unified-dossier-engineer`"
      rationale: This skill owns its active command surface and canonical artifact contract.
    - id: interop-implementation-discipline
      domain: implementation behavior and code-review hygiene for runtime work
      winner: "`implementation-discipline`"
      rationale: Use it together with this skill whenever runtime code or code-backed tests change so runtime work stays simple, surgical, and explicitly verified.
  commands:
    - id: command-help
      command: help
      summary: Show the shipped help surface or command-local help.
      when: Confirm the public CLI contract before invoking or documenting another command.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs help
        - node scripts/dossier-engineer.mjs help feature-intake
    - id: command-init
      command: init
      summary: Initialize the process root, backlog subroot, and SSOT skeleton.
      when: Bootstrap a repository for the runtime.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs init --path <repo>
    - id: command-register-source
      command: register-source
      summary: Register a source document and obtain a source ID.
      when: New durable source material must enter the backlog truth layer.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs register-source --path <path> --kind spec --authority repo
    - id: command-list-sources
      command: list-sources
      summary: List registered sources and source metadata.
      when: You need the canonical registry view before refresh, source maintenance, or source-linked patching.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs list-sources
    - id: command-update-source-path
      command: update-source-path
      summary: Update the registered path of an existing source.
      when: A source file moved and the registry must be kept truthful.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs update-source-path --source-id <source_id> --new-path <path>
    - id: command-remove-source
      command: remove-source
      summary: Remove a source after durable cleanup of backlog references.
      when: A source is retired and its registry entry must be removed cleanly.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs remove-source --source-id <source_id>
    - id: command-refresh
      command: refresh
      summary: Refresh source hashes and open or update source-review records.
      when: Registered source documents may have changed and source-review truth must be refreshed.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs refresh
    - id: command-ack-source-review
      command: ack-source-review
      summary: Close an open source-review record as an explicit no-op.
      when: A changed source was reviewed and no backlog mutation is required.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs ack-source-review --source-id <source_id>
    - id: command-status
      command: status
      summary: Show backlog readiness signals including source-review blocking counts.
      when: You need a compact readiness summary for the current process root.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs status
    - id: command-items
      command: items
      summary: Return backlog item cards with source-review readiness overlays.
      when: Specific backlog items are already known and full item cards are needed.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs items --item-keys <item_key_1>,<item_key_2>
    - id: command-search
      command: search
      summary: Search backlog items with source-review readiness overlays.
      when: You need filtered backlog discovery while preserving source-review blocking signals.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs search --status defined
    - id: command-queue
      command: queue
      summary: Return queue chains after excluding source-review blocked items.
      when: You need execution-ready chains rather than a flat item list.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs queue
    - id: command-gaps
      command: gaps
      summary: List explicit blockers and unresolved backlog gaps.
      when: You need a deterministic view of declared blockers before starting work.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs gaps
    - id: command-attention
      command: attention
      summary: Surface open source-review records before generic item-level attention entries.
      when: You need the next deterministic review targets after refresh or mutation work.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs attention
    - id: command-template
      command: template
      summary: Generate packet or patch templates.
      when: New backlog-authoring work needs a canonical template instead of ad hoc JSON.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs template packet --out <path>
    - id: command-packet
      command: packet
      summary: Apply a packet that adds new backlog tasks.
      when: Source review or planned delivery work requires new backlog items.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs packet --path <packet.json>
    - id: command-patch-item
      command: patch-item
      summary: Apply a patch that updates existing backlog tasks.
      when: Existing backlog truth must be corrected without creating a new packet.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs patch-item --patch <patch.json>
    - id: command-remove-item
      command: remove-item
      summary: Apply a patch that removes obsolete backlog tasks.
      when: Confirmed obsolete work must be removed from backlog truth.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs remove-item --patch <patch.json>
    - id: command-report
      command: report
      summary: Generate a human-readable backlog report on disk.
      when: Operator-facing backlog reporting is needed without manually reading JSON read models.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs report
    - id: command-feature-intake
      command: feature-intake
      summary: Create a new feature dossier and open a feature lifecycle.
      when: Selected backlog work is being turned into a new dossier-controlled feature.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs feature-intake --title <title> --backlog-item-key <key> --backlog-delivery-state <state> --backlog-source <source> --area <area> --owner <owner> --impact <impact> --session-id <id>
    - id: command-spec-compact
      command: spec-compact
      summary: Mechanical controller for the spec-compact stage.
      when: The feature moves into or through compact specification work.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs spec-compact --feature-id <id> --session-id <id>
    - id: command-plan-slice
      command: plan-slice
      summary: Mechanical controller for the plan-slice stage.
      when: The feature moves into or through planning work.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs plan-slice --feature-id <id> --session-id <id>
    - id: command-implementation
      command: implementation
      summary: Mechanical controller for the implementation stage.
      when: The feature moves into or through implementation work.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs implementation --feature-id <id> --session-id <id>
    - id: command-change-proposal
      command: change-proposal
      summary: Mechanical controller for the mature change path.
      when: The feature enters an explicit change-proposal branch that may affect backlog truth.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs change-proposal --feature-id <id> --session-id <id>
    - id: command-contract-drift-audit
      command: contract-drift-audit
      summary: Detect executable contract drift without follow-up changes.
      when: Mature change work needs a deterministic contract-drift check.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs contract-drift-audit --dossier <path>
    - id: command-coverage-audit
      command: coverage-audit
      summary: Check AC references in tests and report orphans.
      when: Coverage-gate evidence must be refreshed against current dossier state.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs coverage-audit --dossier <path>
    - id: command-debt-audit
      command: debt-audit
      summary: Scan for explicit TODO/FIXME/HACK/XXX debt markers.
      when: Closure readiness requires a deterministic debt pass.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs debt-audit --dossier <path>
    - id: command-dependency-graph
      command: dependency-graph
      summary: Print the dossier dependency graph as Mermaid.
      when: You need a machine-generated view of dossier dependencies.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs dependency-graph --dossier <path>
    - id: command-sync-index
      command: sync-index
      summary: Refresh generated dossier table and graph blocks only.
      when: The global SSOT index needs deterministic block refresh without broader red-flag recomputation.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs sync-index --root <repo>
    - id: command-index-refresh
      command: index-refresh
      summary: Run sync-index and refresh the generated Red flags block.
      when: The global SSOT index needs a full generated refresh.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs index-refresh --root <repo>
    - id: command-lint-dossiers
      command: lint-dossiers
      summary: Validate feature dossiers and optionally update Red flags.
      when: Dossier integrity must be checked across the current process root.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs lint-dossiers --root <repo>
    - id: command-dossier-verify
      command: dossier-verify
      summary: Run the canonical verification bundle and persist its artifact.
      when: Local gates are green and deterministic verification evidence must be materialized.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs dossier-verify --dossier <path>
    - id: command-review-artifact
      command: review-artifact
      summary: Persist one immutable already obtained audit attempt for one audit class.
      when: Required external audit evidence already exists and one audit-class result must be recorded durably.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs review-artifact --dossier <path> --step implementation --audit-class spec-conformance-reviewer --verdict PASS --reviewer independent
    - id: command-dossier-step-close
      command: dossier-step-close
      summary: Persist the authoritative step-close artifact after validating the required audit bundle.
      when: Verification is complete and the policy-required external audit bundle for the stage is ready for truthful close-out.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs dossier-step-close --dossier <path> --step implementation --verify-artifact <path> --review-artifact <spec.json> --review-artifact <code.json> --review-artifact <security.json>
    - id: command-post-close-hygiene
      command: post-close-hygiene
      summary: Run explicit implementation post-close backlog hygiene evidence with refresh/status/attention/queue.
      when: A process-complete implementation needs post-close backlog hygiene evidence before branch-complete reporting or next-intake recommendation.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs post-close-hygiene --dossier <path> --step implementation
    - id: command-next-step
      command: next-step
      summary: Resolve the dossier-local next workflow stage from structured state.
      when: You need the deterministic next step for one dossier without inference from chat prose.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs next-step --dossier <path>
    - id: command-lifecycle-refresh
      command: lifecycle-refresh
      summary: Rebuild lifecycle metrics and session anchors from structured telemetry.
      when: Step-close or lifecycle telemetry changed and lifecycle snapshots must be refreshed.
      script: scripts/dossier-engineer.mjs
      examples:
        - node scripts/dossier-engineer.mjs lifecycle-refresh --feature-id <id>
  gotchas:
    - id: gotcha-no-speculative-cli
      priority: high
      text: Do not document commands, flags, or output fields unless the runtime and tests actually ship them.
    - id: gotcha-ssot-split
      priority: high
      text: "`.dossier` is for accounting and process artifacts, while `docs/ssot` remains the human-facing project SSOT."
    - id: gotcha-source-review
      priority: high
      text: Source hash changes must open a source-review record first; they must not immediately flood linked items with `needs_attention`.
    - id: gotcha-state-axes
      priority: high
      text: Do not collapse backlog lifecycle, dossier maturity, `coverage_gate`, review freshness, and closure state into one flat status enum.
    - id: gotcha-closure-truth
      priority: high
      text: Delivery closure remains step-close-backed and telemetry-backed; commit history or chat summaries are never enough.
    - id: gotcha-stage-control
      priority: high
      text: Stage-controller commands are mechanical progress controllers only; they must stop at `ready_for_close` and must not duplicate `dossier-step-close` or `lifecycle-refresh`.
    - id: gotcha-external-audit-launch
      priority: high
      text: Blocking external audits must be launched without forked/full-history authoring context; `review-artifact` and `dossier-step-close` record observable provenance but do not prove launch-mode independence.
  policies:
    - id: policy-no-function-loss
      title: No functionality loss
      text: This skill must retain every essential behavior in its canonical scope, including backlog source tracking, `change-proposal`, `contract-drift-audit`, `coverage_gate`, lifecycle telemetry, and strict closure truth.
    - id: policy-source-review-boundary
      title: Source-review before item flood
      text: Refresh-driven source changes open source-review records and block linked-item readiness until review resolves; item-level escalation happens only after confirmed backlog mutation work.
    - id: policy-stage-command-boundary
      title: Stage controllers versus helper commands
      text: Primary delivery stages may gain first-class commands, but closure truth, review persistence, verification artifacts, lifecycle aggregation, and dossier-local querying remain separate helper command families.
  portability:
    required: true
    rules:
      - Do not emit absolute paths or machine-specific environment assumptions.
      - Do not require repository files outside this skill folder to understand this design.
      - Keep all mandatory guidance for this skill inside this skill folder.
      - Use only relative links inside the skill bundle.
    checklist:
      - Search the skill folder for absolute paths and remove them.
      - Confirm every required reference exists inside this skill folder.
      - Confirm the copied skill remains understandable in isolation.
