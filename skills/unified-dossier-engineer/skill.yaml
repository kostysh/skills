apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: unified-dossier-engineer
  source-version: 0.2.0
  recommended-skill-md-max-bytes: 26000
  description: >-
    Build and maintain the canonical dossier/backlog skill and its CLI runtime.
    Use when working on the architecture, artifact model, command surface, or
    canonical workflow.
  compatibility: >-
    Canonical runtime shipped. Only the canonical `.dossier` + `docs/ssot`
    layout and the `dossier-engineer` launcher are part of this skill.

