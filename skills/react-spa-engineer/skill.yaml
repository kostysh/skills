apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: react-spa-engineer
  source-version: 0.1.8
  recommended-skill-md-max-bytes: 20000
  description: >-
    Design, implement, review, and diagnose production React single-page
    applications built with TypeScript, Vite, TanStack Query, Zustand, React
    Hook Form with Zod, React Router, and Dexie. Use for integrated client-side
    flows that cross routing, server state, runtime state, forms, browser
    persistence, performance, testing, or accessibility. Preserve the accepted
    stack and project contracts; exclude SSR, React Server Components, and
    Next.js server-side architecture.
  compatibility: >-
    Portable documentation-only engineering skill. It ships no application
    runtime or test harness and requires repository evidence plus the installed
    stack versions to make project-specific decisions.
