skill:
  name: react-spa-engineer
  source-version: 0.1.2
  recommended-skill-md-max-bytes: 20000
  description: |-
    Comprehensive React SPA development expert for building production-ready single-page applications. Covers component architecture, state management (Zustand, Context), explicit persistence architecture (URL state, runtime UI state, Dexie/IndexedDB), data fetching (TanStack Query), forms (React Hook Form + Zod), routing (React Router), TypeScript patterns, performance optimization, testing (Vitest, RTL, Playwright), and accessibility.

    Use when building React SPAs, implementing features, reviewing code, setting up project architecture, or troubleshooting React client-side applications. Excludes SSR, RSC, Next.js server-side patterns.
