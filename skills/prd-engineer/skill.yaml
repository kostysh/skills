apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: prd-engineer
  source-version: 0.1.4
  recommended-skill-md-max-bytes: 20000
  description: >-
    Create, refine, and review PRDs, product specs, feature requirements, and AI
    requirements. Use when asked to turn a product idea into testable
    requirements, define scope, non-goals, acceptance, rollout, or metrics,
    establish product-source authority, assess product-input readiness for
    architecture, specification, or delivery-planning handoff, handle AI
    evaluation, or audit a PRD for ambiguity, missing evidence, weak acceptance,
    or scope risk.
fragments:
  overview: fragments/overview.md

references:
  - id: ref-prd-template
    title: PRD template
    source: references/prd-template.md
    target: references/prd-template.md
    required: false
    trigger: Read this when creating a formal PRD artifact, expanding an existing PRD, adding authority or handoff-readiness metadata, evidence, traceability, review routing, AI/security/rollout modules, or running a detailed PRD quality check.

assets: []
copies:
  - id: copy-agents-openai
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.
