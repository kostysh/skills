apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: prd-engineer
  source-version: 0.1.1
  recommended-skill-md-max-bytes: 20000
  description: >-
    Create, refine, and review Product Requirements Documents (PRDs), product
    specs, feature requirements, and AI feature requirements. Use when asked to
    write a PRD, turn a vague product idea into testable requirements, define
    scope and non-goals, create acceptance criteria, add rollout or success
    metrics, handle AI evaluation requirements, or audit a PRD for ambiguity,
    missing evidence, weak acceptance criteria, or scope risk.
fragments:
  overview: fragments/overview.md

references:
  - id: ref-prd-template
    title: PRD template
    source: references/prd-template.md
    target: references/prd-template.md
    required: false
    trigger: Read this when creating a formal PRD artifact, expanding an existing PRD, adding metadata, evidence, traceability, review routing, AI/security/rollout modules, or running a detailed PRD quality check.

assets: []
copies:
  - id: copy-agents-openai
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.
supporting:
  - id: supporting-docs-readme
    source: docs/README.md
    target: docs/README.md
  - id: supporting-implementation-log
    source: docs/logs/implementation-log-20260506-1.md
    target: docs/logs/implementation-log-20260506-1.md
  - id: supporting-implementation-log-2
    source: docs/logs/implementation-log-20260506-2.md
    target: docs/logs/implementation-log-20260506-2.md

surfaces:
  active:
    requiredReferences: []
    optionalReferences:
      - ref-prd-template
  supportingGlobs:
    - docs/*

sections:
  startHere:
    - Confirm whether the user needs a new PRD, a refinement, or a review of an existing PRD.
    - Separate the observable product capability from substrate such as documentation, tickets, mocks, logs, or implementation scaffolding.
    - Choose the lightest PRD mode that fits the risk; do not expand a one-pager into a heavyweight template by default.
    - Ask only focused discovery questions that would change scope, metrics, or acceptance; otherwise draft with explicit assumptions and TBDs.
  whenToUse:
    - Writing a PRD, product requirements document, feature spec, product spec, or requirements doc.
    - Turning a vague product idea, stakeholder request, or AI feature idea into problem-first, testable requirements.
    - Defining scope, non-goals, user stories, acceptance criteria, success metrics, rollout, risks, or open questions.
    - Reviewing an existing PRD for ambiguity, missing evidence, unverifiable requirements, weak acceptance criteria, hidden scope, or missing AI evaluation.
    - Creating a compact one-pager, standard feature PRD, or extended PRD for high-risk, AI, platform, regulated, or multi-team work.
  whenNotToUse:
    - Writing marketing copy, launch announcements, sales enablement, or public-facing positioning without requirements work.
    - Implementing the feature described by a PRD; use implementation and domain skills instead.
    - Reviewing code against an existing PRD; use `spec-conformance-reviewer`.
    - Checking whether a task only creates substrate while claiming a product capability; use `concept-conformance-reviewer`.
    - Creating formal safety-critical, procurement, legal, or regulated specifications without a domain-specific template or reviewer.
  workflow:
    - id: stage-select-mode
      title: Select PRD mode
      goal: Fit the document size to uncertainty, risk, and audience.
      steps:
        - Use a one-pager for early discovery, pre-bet, or prototype framing.
        - Use a standard feature PRD for ordinary product and engineering handoff.
        - Use an extended PRD when the work is AI-driven, platform-level, regulated, multi-team, migration-heavy, security-sensitive, or hard to verify.
      validation:
        - The selected mode is stated or obvious from the output.
        - The document is no larger than the risk justifies.
    - id: stage-discovery
      title: Run discovery checkpoint
      goal: Prevent a PRD from becoming a polished guess.
      steps:
        - Identify the core problem, target users, why now, current evidence, desired outcome, constraints, and success metrics.
        - Ask the fewest concise questions needed when missing answers would materially change the PRD.
        - If the user asks for an immediate draft, proceed with clearly labeled assumptions, TBDs, and open questions instead of inventing facts.
      validation:
        - Missing problem, user, scope, metric, or constraint information is either answered, marked TBD, or listed as an open question.
        - No constraint, metric, user research, data source, or technical dependency is hallucinated.
    - id: stage-frame-capability
      title: Frame capability and scope
      goal: Make the intended observable product behavior explicit before listing requirements.
      steps:
        - State the product outcome in user terms before describing the solution.
        - Separate in-scope behavior from substrate and supporting artifacts.
        - "Define non-goals and anti-claims: what this PRD or release will not make possible."
        - Capture important assumptions, dependencies, risks, owners, and decision points.
      validation:
        - The PRD cannot be mistaken for a promise to deliver behavior that is only researched, mocked, documented, or deferred.
        - Non-goals and open questions protect scope instead of hiding uncertainty.
    - id: stage-write-requirements
      title: Write testable requirements
      goal: Convert intent into buildable and reviewable requirements.
      steps:
        - Write requirements as atomic, clear, feasible, prioritized, and verifiable statements.
        - Prefer IDs for standard or extended PRDs, especially when engineering, QA, or implementation review will trace against them.
        - Pair user stories or capabilities with acceptance criteria that force observable behavior.
        - Include non-functional requirements for performance, reliability, accessibility, security, privacy, cost, and operations when they affect success.
      validation:
        - Vague words such as fast, easy, intuitive, robust, scalable, or modern are replaced by thresholds, examples, guardrails, or TBDs.
        - Acceptance criteria cannot pass only through mocks, metadata, logs, documentation, or static existence checks.
    - id: stage-add-modules
      title: Add only needed modules
      goal: Cover risk-specific requirements without turning every PRD into a master document.
      steps:
        - Add an AI module when outputs are probabilistic, model-driven, prompt-driven, retrieval-based, or evaluated by quality rather than deterministic logic.
        - Add security, privacy, compliance, migration, GTM, support, or alternatives modules only when those topics affect scope, approval, delivery, or acceptance.
        - Link to existing research, designs, epics, issues, experiments, and decisions instead of copying bulky context.
      validation:
        - Optional modules are justified by risk or decision value.
        - AI PRDs include evaluation strategy, quality thresholds, latency or cost guardrails, and failure handling.
    - id: stage-quality-gate
      title: Run PRD quality gate
      goal: Make the final artifact usable for shared understanding, delivery, and later review.
      steps:
        - Check the PRD against problem-first framing, measurable success, scope/non-goals, testable requirements, risks, owners, rollout, instrumentation, and outcome review.
        - Mark blockers separately from polish.
        - When reviewing a PRD, lead with gaps that would cause wrong implementation, false acceptance, or scope drift.
      validation:
        - The final output names important assumptions, unresolved questions, and verification gaps.
        - The PRD can be used by product, design, engineering, QA, and stakeholders without relying on hidden context.
  interop:
    - id: interop-concept-conformance
      domain: capability versus substrate
      winner: concept-conformance-reviewer
      rationale: concept-conformance-reviewer owns fake-risk analysis when acceptance criteria or plans can pass without delivering the claimed capability.
    - id: interop-spec-conformance
      domain: implementation against PRD
      winner: spec-conformance-reviewer
      rationale: spec-conformance-reviewer owns checking code or implementation evidence against an approved PRD.
    - id: interop-domain-skills
      domain: technical feasibility and domain-specific requirements
      winner: the relevant domain skill
      rationale: Domain skills own framework, security, data, ML, infrastructure, regulatory, or product-domain facts.
    - id: interop-documentation
      domain: documentation architecture
      winner: documentation
      rationale: documentation owns Diataxis and docs IA; this skill owns PRD content and requirements quality.
  commands: []
  gotchas:
    - id: gotcha-template-is-not-quality
      priority: high
      text: A complete PRD template with vague content is still a bad PRD.
    - id: gotcha-do-not-invent-evidence
      priority: high
      text: Do not fabricate users, research, metrics, constraints, or technical decisions; mark them as assumptions, TBDs, or open questions.
    - id: gotcha-overspecification
      priority: medium
      text: Do not over-prescribe implementation details when acceptance criteria and boundaries are enough.
    - id: gotcha-ai-needs-evals
      priority: high
      text: AI feature PRDs need evaluation strategy and quality bars; a demo or prompt description is not enough.
    - id: gotcha-living-artifact
      priority: medium
      text: For delivery PRDs, keep lifecycle tracking minimal but visible; status, owner, and next review are usually enough.
  policies:
    - id: policy-problem-first
      title: Problem-first policy
      text: Start from user problem, outcome, and evidence before solution details.
    - id: policy-just-enough
      title: Just-enough detail policy
      text: Include a section only when it changes a decision, reduces risk, clarifies scope, or supports acceptance.
    - id: policy-acceptance-integrity
      title: Acceptance integrity policy
      text: Acceptance criteria must require observable behavior or measurable evidence, not only the existence of files, mocks, logs, or tickets.
    - id: policy-light-traceability
      title: Light traceability policy
      text: Use requirement IDs, owners, source links, statuses, and change notes when multiple people or later implementation review will depend on the PRD.
    - id: policy-brevity
      title: Brevity policy
      text: In chat, keep outputs concise unless the user asks for a formal artifact; use the reference template for full documents.
  portability:
    required: true
    rules:
      - Do not reference machine-specific paths or files outside this skill folder.
      - Keep all mandatory PRD guidance inside this skill folder.
      - Treat external examples and standards as optional background, not runtime dependencies.
      - Use relative links for local references and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm the optional PRD template reference is reachable from the generated SKILL.md.
