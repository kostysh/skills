surfaces:
  active:
    requiredReferences: []
    optionalReferences:
      - ref-prd-template
  supportingGlobs:
    - docs/*

sections:
  startHere:
    - Confirm whether the task is a new PRD, refinement, or review; name the downstream consumer when handoff matters.
    - Resolve source precedence; separately verify approval of the current PRD version.
    - Separate the observable product capability from substrate such as documentation, tickets, mocks, logs, or implementation scaffolding.
    - Choose the lightest PRD mode that fits the risk; do not expand a one-pager into a heavyweight template by default.
    - Before creating or recommending a persistent PRD, product brief, or PRD review artifact, check whether the current repository defines artifact conventions and follow them when present.
    - If the PRD feeds architecture, delivery planning, or implementation specs, surface architecture-relevant constraints and questions without choosing architecture patterns.
    - Ask only focused discovery questions that would change users, scope, metrics, acceptance, constraints, or handoff readiness; otherwise draft with explicit assumptions and TBDs.
  whenToUse:
    - Writing a PRD, product requirements document, feature spec, product spec, or requirements doc.
    - Turning a vague product idea, stakeholder request, or AI feature idea into problem-first, testable requirements.
    - Defining scope, non-goals, user stories, acceptance criteria, success metrics, rollout, risks, or open questions.
    - Reviewing an existing PRD for ambiguity, missing evidence, unverifiable requirements, weak acceptance criteria, hidden scope, or missing AI evaluation.
    - Creating a compact one-pager, standard feature PRD, or extended PRD for high-risk, AI, platform, regulated, or multi-team work.
    - Preparing product-stage input for architecture, delivery planning, or implementation specification in a risk-adaptive development workflow.
  whenNotToUse:
    - Writing marketing copy, launch announcements, sales enablement, or public-facing positioning without requirements work.
    - Implementing the feature described by a PRD; use implementation and domain skills instead.
    - Reviewing code against an existing PRD; use `spec-conformance-reviewer`.
    - Issuing an independent concept-conformance or fake-risk verdict against an established higher-level concept; use `concept-conformance-reviewer`.
    - Creating formal safety-critical, procurement, legal, or regulated specifications without a domain-specific template or reviewer.
  workflow:
    - id: stage-select-mode
      title: Select PRD mode
      goal: Fit the document size to uncertainty, risk, and audience.
      steps:
        - Use a one-pager for early discovery, pre-bet, or prototype framing.
        - Use a standard feature PRD for ordinary product and engineering handoff.
        - Use an extended PRD when the work is AI-driven, platform-level, regulated, multi-team, migration-heavy, security-sensitive, or hard to verify.
      validation:
        - The selected mode is stated or obvious from the output.
        - Document size matches the risk.
    - id: stage-establish-authority
      title: Establish authority and handoff target
      goal: Prevent a polished draft from masquerading as authoritative product input.
      steps:
        - Separate product-source precedence from approval or canonical status of the current PRD version.
        - Apply known precedence; block handoff when equal or unknown authority conflicts could change users, scope, metrics, acceptance, constraints, or the target handoff.
        - Use `authoritative` only when the operator or repository process approves or canonicalizes the current content and version; input authority or prior approval does not transfer.
        - Keep generated or materially refined output `non-authoritative` until that resulting version is explicitly authorized.
        - Treat outcome- or handoff-changing gaps as blockers; give other assumptions or TBDs an owner or decision trigger.
      validation:
        - "`Authority` is explicitly `authoritative` or `non-authoritative` whenever readiness is assessed."
        - An unresolved equal- or unknown-authority conflict cannot produce a ready handoff.
        - Input authority, prior approval, or status metadata cannot authorize newly generated or materially changed PRD content.
    - id: stage-discovery
      title: Run discovery checkpoint
      goal: Prevent a PRD from becoming a polished guess.
      steps:
        - Identify the core problem, target users, why now, current evidence, desired outcome, constraints, and success metrics.
        - Separate product success metrics from quality guardrails when reliability, performance, cost, security, or operations could affect later architecture or acceptance.
        - Ask the fewest concise questions needed when missing answers would materially change the PRD.
        - "If the user asks for an immediate draft, proceed with labeled assumptions, TBDs, and open questions; use `Authority: non-authoritative` and `Handoff: draft-only` when handoff is named, otherwise `Handoff: not-assessed`."
      validation:
        - Missing problem, user, scope, metric, or constraint information is either answered, marked TBD, or listed as an open question.
        - No constraint, metric, user research, data source, or technical dependency is hallucinated.
    - id: stage-frame-capability
      title: Frame capability and scope
      goal: Make the intended observable product behavior explicit before listing requirements.
      steps:
        - State the product outcome in user terms before describing the solution.
        - For each material capability, identify the actor or consumer, trigger, observable response, state or effect, feedback, and applicable failure, continuity, or recovery expectation.
        - Separate in-scope behavior from substrate and supporting artifacts.
        - "Define non-goals and anti-claims: what this PRD or release will not make possible."
        - Capture important assumptions, dependencies, risks, owners, and decision points.
      validation:
        - The PRD cannot be mistaken for a promise to deliver behavior that is only researched, mocked, documented, or deferred.
        - Material capability claims can be traced across actor, trigger, response, effect, feedback, and applicable failure or continuity behavior.
        - Non-goals and open questions protect scope instead of hiding uncertainty.
    - id: stage-write-requirements
      title: Write testable requirements
      goal: Convert intent into buildable and reviewable requirements.
      steps:
        - Write requirements as atomic, clear, feasible, prioritized, and verifiable statements.
        - Prefer IDs for standard or extended PRDs, especially when engineering, QA, architecture, or implementation review will trace against them.
        - Add owner and release phase attributes when requirement ownership, MVP/beta/GA scope, or deferred behavior could change downstream decisions.
        - Pair user stories or capabilities with acceptance criteria that force observable behavior.
        - For each material acceptance criterion, find the least-real passing implementation; rewrite it if an endpoint, file, config, log, mock, test, or other substrate could pass without the claimed behavior.
        - Include non-functional requirements for performance, reliability, accessibility, security, privacy, cost, and operations when they affect success.
      validation:
        - Vague words such as fast, easy, intuitive, robust, scalable, or modern are replaced by thresholds, examples, guardrails, or TBDs.
        - Acceptance criteria cannot pass only through mocks, metadata, logs, documentation, or static existence checks.
        - Important failure or negative behavior is represented where happy-path acceptance alone could create false confidence.
    - id: stage-add-modules
      title: Add only needed modules
      goal: Cover risk-specific requirements without turning every PRD into a master document.
      steps:
        - Add an AI module when outputs are probabilistic, model-driven, prompt-driven, retrieval-based, or evaluated by quality rather than deterministic logic.
        - Add security, privacy, compliance, migration, GTM, support, or alternatives modules only when those topics affect scope, approval, delivery, or acceptance.
        - Add architecture handoff inputs when the PRD may affect boundaries, contracts, data, security, tenancy, integration, deployment, observability, cost, operability, rollback, or long-term constraints.
        - Link to existing research, designs, epics, issues, experiments, and decisions instead of copying bulky context.
      validation:
        - Optional modules are justified by risk or decision value.
        - Architecture handoff content names product constraints and questions; it does not select architecture patterns, ASRs, ADRs, or deployment designs.
        - AI PRDs include evaluation strategy, quality thresholds, latency or cost guardrails, and failure handling.
    - id: stage-quality-gate
      title: Run PRD quality gate
      goal: Make the final artifact usable for shared understanding, delivery, and later review.
      steps:
        - Check the PRD against problem-first framing, measurable success, scope/non-goals, testable requirements, risks, owners, rollout, instrumentation, and outcome review.
        - Mark blockers separately from polish.
        - "Use `Handoff: not-assessed` without a readiness request or consumer; otherwise use `draft-only`, `blocked`, or `ready for <architecture | specification | delivery-planning>`."
        - If readiness is requested without a consumer, ask once or leave readiness unassessed; continue the PRD review.
        - Use `ready` only when authority is explicit and no unresolved product decision can change that consumer's input; assign an owner or trigger to every remaining non-blocking TBD.
        - For reviews, return authority, assessed handoff, blockers, evidence gaps, substrate-only acceptance defects, anti-claims, remediation, and next owner.
      validation:
        - The final output names important assumptions, unresolved questions, and verification gaps.
        - "`Authority: non-authoritative` or any product blocker prevents a ready verdict."
        - Ready certifies only product input for the named consumer, not architecture, specification, planning, implementation, or release readiness.
        - The named downstream consumer can use the product input without hidden product decisions.
  interop:
    - id: interop-product-authority
      domain: product intent, users, scope, non-goals, success metrics, and product-level acceptance
      winner: prd-engineer
      rationale: prd-engineer owns product-source revisions and product-input readiness; it does not own architecture, implementation-ready behavior, or delivery decomposition.
    - id: interop-concept-conformance
      domain: independent concept drift and fake-risk review
      winner: concept-conformance-reviewer
      rationale: concept-conformance-reviewer owns the independent verdict when acceptance or plans may pass without the established capability; prd-engineer remains the owner of product-source revisions.
    - id: interop-spec-conformance
      domain: implementation against PRD
      winner: spec-conformance-reviewer
      rationale: spec-conformance-reviewer owns checking code or implementation evidence against an approved PRD.
    - id: interop-architecture
      domain: architecture-significant requirements, pattern decisions, and ADRs
      winner: architecture-engineer
      rationale: architecture-engineer owns translating product requirements into architecture decisions, constraints, quality scenarios, architecture handoff, and architecture drift handling.
    - id: interop-specification
      domain: implementation-ready behavior, atomic normative requirements, negative cases, falsifiers, and verification maps
      winner: spec-engineer
      rationale: spec-engineer consumes accepted product input and owns implementation-ready behavior; prd-engineer owns product intent and product-level acceptance only.
    - id: interop-delivery-planning
      domain: vertical slices, module increments, tasks, dependencies, and sequencing
      winner: delivery-planner
      rationale: delivery-planner consumes accepted product scope and applicable architecture handoff to decompose work; prd-engineer must not create the backlog or sequence implementation.
    - id: interop-domain-skills
      domain: technical feasibility and domain-specific requirements
      winner: the relevant domain skill
      rationale: Domain skills own framework, security, data, ML, infrastructure, regulatory, or product-domain facts.
    - id: interop-documentation
      domain: documentation architecture
      winner: documentation
      rationale: documentation owns Diataxis and docs IA; this skill owns PRD content and requirements quality.
  commands: []
  gotchas:
    - id: gotcha-template-is-not-quality
      priority: high
      text: A complete PRD template with vague content is still a bad PRD.
    - id: gotcha-do-not-invent-evidence
      priority: high
      text: Do not fabricate users, research, metrics, constraints, or technical decisions; mark them as assumptions, TBDs, or open questions.
    - id: gotcha-overspecification
      priority: medium
      text: Do not over-prescribe implementation details when acceptance criteria and boundaries are enough.
    - id: gotcha-ai-needs-evals
      priority: high
      text: AI feature PRDs need evaluation strategy and quality bars; a demo or prompt description is not enough.
    - id: gotcha-candidate-asr-is-not-decision
      priority: high
      text: Do not present candidate architecture-significant inputs as accepted ASRs, pattern decisions, ADRs, or implementation designs.
    - id: gotcha-living-artifact
      priority: medium
      text: For delivery PRDs, keep lifecycle tracking minimal but visible; status, owner, and next review are usually enough.
  policies:
    - id: policy-problem-first
      title: Problem-first policy
      text: Start from user problem, outcome, and evidence before solution details.
    - id: policy-just-enough
      title: Just-enough detail policy
      text: Include a section only when it changes a decision, reduces risk, clarifies scope, or supports acceptance.
    - id: policy-acceptance-integrity
      title: Acceptance integrity policy
      text: Acceptance criteria must require observable behavior or measurable evidence. Find the least-real passing implementation and rewrite any criterion that can pass through endpoints, files, config, mocks, tests, logs, tickets, or other substrate without the claimed behavior.
    - id: policy-source-authority
      title: Product source authority policy
      text: Separate source precedence from artifact authority. Only the operator or repository process can approve the current PRD version; generated or materially changed content stays non-authoritative until then.
    - id: policy-handoff-readiness
      title: Product-input handoff readiness policy
      text: "Report `Authority` separately from `Handoff`. Use `not-assessed` without a requested consumer. Ready requires current-version authority and no product blocker; it covers product input only."
    - id: policy-light-traceability
      title: Light traceability policy
      text: Use requirement IDs, owners, source links, statuses, and change notes when multiple people or later implementation review will depend on the PRD.
    - id: policy-repository-artifact-conventions
      title: Repository artifact conventions policy
      text: When producing or recommending a persistent PRD, product brief, or PRD review in a repository, first check repo-local artifact conventions through AGENTS.md, README, CONTRIBUTING, or docs linked from them. If conventions exist, follow them for canonical location, stable PRD or product-brief IDs, metadata/front matter, requirement and acceptance ID prefixes, source links, related artifact links, and module index updates. Do not hard-code one repository's paths into this skill. If no repository convention exists, use this skill's default PRD shape and state any location assumption when writing files. Repository conventions override generic PRD location defaults when the artifact is canonical in the repo.
    - id: policy-architecture-handoff
      title: Architecture handoff policy
      text: PRDs may surface architecture-relevant product constraints, quality guardrails, external systems, data sensitivity, release phases, and blocking questions, but architecture-engineer owns ASR extraction and architecture decisions.
    - id: policy-brevity
      title: Brevity policy
      text: In chat, keep outputs concise unless the user asks for a formal artifact; use the reference template for full documents.
  portability:
    required: true
    rules:
      - Do not reference machine-specific paths or files outside this skill folder.
      - Keep all mandatory PRD guidance inside this skill folder.
      - Treat external examples and standards as optional background, not runtime dependencies.
      - Use relative links for local references and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm the optional PRD template reference is reachable from the generated SKILL.md.
