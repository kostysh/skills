apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: requirements-approval
  source-version: 0.1.1
  recommended-skill-md-max-bytes: 12000
  description: >-
    Organize customer requirements approvals: resolve open questions, create GitHub
    approval tasks, process replies via Gmail/GitHub, and propagate accepted
    decisions into PRDs, architecture, specs, and plans. Also use for «согласование
    требований», «открытые вопросы» and «ответы заказчика».
fragments:
  overview: fragments/overview.md
copies:
  - id: copy-agents-openai
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.
supporting:
  - id: supporting-implementation-log-20260715-1
    source: docs/logs/implementation-log-20260715-1.md
    target: docs/logs/implementation-log-20260715-1.md
    description: Non-normative log for the skill description length update.
surfaces:
  active:
    requiredReferences: []
    optionalReferences: []
  supportingGlobs: []
sections:
  startHere:
    - Confirm whether the task is preparing customer approval requests or processing customer replies.
    - Treat approval artifacts as coordination substrate; the real capability is resolved requirements reflected in project documents and tracked GitHub state.
    - Before asking the customer, research whether each open question can be closed from existing inputs, project requirements, or public sources.
    - Escalate only questions that cannot be fully resolved without customer input; do not use approval tasks as a substitute for analysis.
    - Keep customer-facing requests conservative and scope-protecting; do not suggest expansions or improvements outside initial project requirements.
    - Use the customer's language for customer-facing request examples.
  whenToUse:
    - Identifying open questions in requirements, specs, PRDs, architecture notes, plans, or backlog items.
    - Creating GitHub tasks in a dedicated approval project for questions that need customer input.
    - Processing customer email replies, matching them to open-question codes and GitHub approval tasks.
    - Propagating customer decisions into project documentation and committing those changes.
  whenNotToUse:
    - The answer can be derived from existing project inputs without customer approval.
    - The task is ordinary product specification work with no customer-facing approval workflow.
    - The user wants a broad discovery workshop, sales proposal, or scope expansion.
    - Gmail or GitHub access is required but unavailable and the needed data was not provided another way.
  workflow:
    - id: stage-prepare-approval-requests
      title: Prepare approval requests
      goal: Create approval tasks only for open questions that remain unresolved after reasonable research.
      steps:
        - Extract open questions and assign or preserve stable question codes.
        - For each question, check existing inputs, requirements, decisions, project docs, issue history, and related dependencies.
        - If the question depends on current external facts, search public sources and cite what was checked.
        - Mark questions as resolved, partially resolved, or customer-needed; do not escalate resolved questions.
        - For customer-needed questions, create a GitHub task in the dedicated approvals project.
        - Put the question code or codes in the task title.
        - In the task body, include why the question exists, project context, links to project docs and dependencies, what research was done, and the specific missing customer input.
        - Add a customer-facing request example in the customer's language, written simply and shaped for quick choice or reply.
        - Keep the request conservative; present decisions needed to satisfy current scope, not optional enhancements.
      validation:
        - Every created task maps to at least one open-question code.
        - Every escalated question shows why existing inputs and public research were insufficient.
        - The customer request does not invite scope expansion beyond initial requirements.
    - id: stage-process-customer-replies
      title: Process customer replies
      goal: Convert customer email replies into documented decisions, commits, and updated approval task state.
      steps:
        - Read the operator's screenshot/text list and identify the mentioned emails or threads.
        - Use the mailbox connector to find and read those emails or threads.
        - If an attachment is needed but cannot be read, immediately ask the operator to provide all attachments and stop processing that item.
        - Identify open-question codes discussed in the emails.
        - Find related GitHub approval tasks and read their history before changing status.
        - Comment on each related task with the email id or thread id and a short answer summary.
        - Decide whether the customer answer closes each open question fully, partially, or not at all.
        - For full closure, propagate the decision and any incoming data through all affected docs, such as PRD, architecture, specs, plans, and related materials.
        - For partial closure, propagate the partial decision, document what remains open, and prepare a conservative follow-up request.
        - For partial closure, add a task comment explaining why the answer is incomplete, with arguments and links to related materials when useful.
        - Commit documentation/data changes and comment on the task with the commit hash.
        - Move fully closed tasks to DONE; keep or move partially closed tasks to IN PROGRESS.
        - Report to the operator what answers were received, how scope/functionality changed or stayed unchanged, what docs/data changed, task statuses, commits, and any follow-up customer request example.
      validation:
        - Each processed email is linked to question codes and GitHub task comments.
        - Documentation changes are committed before a task is marked DONE.
        - Partial answers remain IN PROGRESS with a clear reason and follow-up request.
  interop:
    - id: interop-gmail
      domain: mailbox lookup and customer email threads
      winner: gmail
      rationale: Use Gmail connector capabilities for finding and reading customer emails.
    - id: interop-github
      domain: approval task creation, comments, and status updates
      winner: gh-utility or GitHub plugin skills
      rationale: Use GitHub tools for issue/project state, comments, and task lifecycle.
    - id: interop-docs
      domain: documentation propagation
      winner: documentation, prd-engineer, architecture-engineer, spec-engineer, or delivery-planner as applicable
      rationale: Use the relevant document skill for the affected artifact type.
    - id: interop-git
      domain: commits
      winner: git-engineer
      rationale: Use git-engineer for Conventional Commits and clean history.
  commands: []
  gotchas:
    - id: gotcha-no-research-bypass
      priority: high
      text: Do not ask the customer questions that can be closed from existing inputs, project docs, issue history, or public research.
    - id: gotcha-no-scope-expansion
      priority: high
      text: Customer requests must not propose enhancements outside initial project scope unless the operator explicitly asks for scope discovery.
    - id: gotcha-attachments
      priority: high
      text: If an email attachment is necessary but unreadable, ask the operator for all attachments before deciding or updating docs.
    - id: gotcha-comment-before-status
      priority: medium
      text: Record the email id/thread id and answer summary on the GitHub task before changing task status.
    - id: gotcha-docs-before-done
      priority: high
      text: Do not mark a task DONE until the accepted decision is propagated through affected documentation and committed.
  policies:
    - id: policy-conservative-customer-language
      title: Conservative customer language
      text: Customer-facing examples should be short, plain, easy to answer, and framed around required decisions rather than optional improvements.
    - id: policy-traceability
      title: Traceability policy
      text: Maintain a chain from open-question code to research, GitHub task, customer email id, documented decision, commit hash, and final task state.
    - id: policy-partial-closure
      title: Partial closure policy
      text: Partial replies must be documented, committed, and left IN PROGRESS with the remaining gap and a follow-up customer request.
  portability:
    required: true
    rules:
      - Do not reference machine-specific paths or repository-specific project ids.
      - Keep the approval workflow understandable without external local files.
      - Treat connector names as capability expectations; if unavailable, ask for equivalent exported data.
    checklist:
      - Run the skill-source-compiler check command after generation.
      - Search the skill folder for absolute local paths.
      - Confirm the skill remains concise and self-contained.
