skill:
  name: requirements-approval
  source-version: 0.2.3
  recommended-skill-md-max-bytes: 15000
  description: >-
    Coordinate customer-owned requirements decisions: triage open questions,
    research resolvable facts, prepare approval requests, process supplied or
    Gmail replies, and route accepted decisions into GitHub and authoritative
    project documents. Use for approval workflows and «согласование требований».
