sections:
  startHere:
    - Confirm whether the request is assessment/drafting or authorizes external execution against exact targets.
    - Match success to the requested stage using the state/output contract; an actionable draft does not require workflow closure.
    - Identify each question's decision owner, authority, affected artifacts, and downstream owners before interpretation or closure.
    - Use repository-defined source precedence; unresolved equal-authority conflicts block acceptance instead of being resolved by recency or convenience.
    - Route document content and authority decisions to their owning skills; requirements-approval owns triage, traceability, and the closure gate.
    - Resolve exact GitHub or Git action targets from the request and available context, and reuse existing authorization within that scope. Missing mutation authority limits execution, not useful drafting or assessment.
  whenToUse:
    - Triaging unresolved requirements questions to determine which need customer input.
    - Preparing or creating traceable approval requests for customer-owned decisions.
    - Processing supplied or Gmail customer replies against stable question codes and decision authority.
    - Coordinating accepted decisions through project artifacts, Git, and approval-task state.
    - Auditing approval-item evidence for honest closure.
  whenNotToUse:
    - Non-approval PRD authoring; explicitly hand it to prd-engineer, and route other artifacts to their named owners.
    - Internal research or issue triage when no decision is customer-owned.
    - Discovery, sales proposals, or optional scope expansion.
    - Sending customer email; this skill only prepares request text.
    - External execution without the required target, authorization, credentials, or source data; return a draft or blocked handoff.
  workflow:
    - id: stage-triage-and-prepare
      title: Triage questions and prepare approval requests
      goal: Escalate only unresolved customer-owned decisions and keep proposed actions distinct from executed mutations.
      steps:
        - Extract open questions and preserve stable source codes; create a short project-local code only when the source lacks one.
        - Identify the decision owner and affected product, architecture, specification, plan, data, or documentation artifacts for each question.
        - Inspect authoritative project inputs, decisions, dependencies, and issue history before external research.
        - Check current runtime evidence when it can resolve a factual subquestion. Observed behavior is not customer preference or approval; unavailable unrelated runtime evidence does not block drafting.
        - Check the environment perimeter and accepted contracts when they constrain the question; do not escalate a choice those authoritative constraints already fix.
        - Check existing TODO, approval, and decision records; reuse the owning record or accepted answer.
        - Consider a narrower technical resolution or domain-owner route before asking for customer intent; investigate it only when it could resolve the current question without changing agreed scope or choosing a customer preference.
        - Use current authoritative public sources only for factual parts that can narrow the question; do not use public facts to invent a customer preference or approval.
        - Classify each question as resolved internally, customer input required, partial, or blocked by missing/conflicting authority.
        - For customer input required, prepare a concise request in the customer's language with context, research, exact missing input, and current-scope choices.
        - When creation is requested and authorized, hand the resolved GitHub target to gh-utility and verify by fresh read. For preparation-only scope, deliver the draft; list missing execution inputs only if they affect a requested next transition.
      validation:
        - Every question names its decision owner, authority basis, affected artifacts, and next owner.
        - Applicable runtime and environment checks resolve factual questions only; a remaining customer-owned preference still goes to its decision owner.
        - Existing owning records are reused, not duplicated.
        - Technical or domain-owned questions stay internal unless customer-owned intent remains.
        - An internally resolved or authority-conflicted question is not escalated as a customer task.
        - Proposed and executed external actions are reported separately.
        - Every executed GitHub mutation has an exact target and fresh observed state.
    - id: stage-assess-replies
      title: Assess customer replies
      goal: Determine what a reply authoritatively answers without converting mailbox presence into decision authority or workflow closure.
      steps:
        - Read the exact supplied messages through gmail or equivalent exported data without changing mailbox state.
        - Verify sender/thread identity, the question codes discussed, the named decision owner's authority, and whether the reply is current or superseded.
        - Read the related approval-item history and authoritative project sources; stop acceptance on unresolved equal-authority conflicts.
        - If a necessary attachment is unavailable, request that specific attachment and block only the dependent question while continuing independent items.
        - Classify each reply per question as complete, partial, non-answer, or authority-conflict.
        - Convert answers into traced obligations for document owners; do not invent product, architecture, specification, or plan decisions.
      validation:
        - Mailbox identity and decision authority are separate evidence fields.
        - A complete answer is not reported as closed before propagation and terminal-state verification.
        - Partial and blocked items name the exact remaining input and do not block independent questions.
    - id: stage-propagate-and-close
      title: Propagate accepted decisions and verify closure
      goal: Close only questions whose accepted obligations have durable disposition and whose required workflow state is evidenced.
      steps:
        - Inventory every required affected artifact and owner per obligation; preserve their authority and handoff rules.
        - "For each required owner, freshly verify one durable route: change evidence traces the exact obligation into required published owning artifact or code; or a current linked follow-up preserves the exact obligation, owner, owning slice or module increment, activation trigger, expected acceptance/evidence, evidence-return route, and reciprocal decision-record link."
        - Stop closure while a required owner lacks a durable route, affected artifacts conflict, or authority remains unresolved.
        - Treat a linked follow-up as closure only for the decision-workflow boundary; keep that follow-up open and do not claim its downstream product or runtime capability.
        - Use git-engineer for an authorized scoped commit; treat push or publication as a separate action that must be authorized and verified when the repository process requires it.
        - Use gh-utility for authorized comments and project updates with the exact applicable repository, issue, Project, item, field, and option identifiers.
        - Map semantic workflow state to the actual inspected Project field options; never assume status names.
        - Freshly read the commit/ref and GitHub issue/project state after mutations.
        - Mark verified only when the answer is authoritative and complete, every required owner has a durable route, affected artifacts are consistent, and required traceability, publication, and terminal state are observed.
        - Report per-question results, executed and proposed actions, evidence limits, remaining gaps, and next owners.
      validation:
        - No terminal issue or Project state, comment, generated document, test, or commit hash is sufficient closure evidence by itself.
        - A missing required-owner route, inconsistent affected artifact, unresolved authority conflict, or unavailable required publication cannot produce verified closure.
        - The final report does not claim stronger authority or terminal state than the observed evidence.
  interop:
    - id: interop-gmail
      domain: mailbox search, message/thread retrieval, and Gmail evidence
      winner: gmail
      rationale: gmail owns mailbox reads; requirements-approval assesses decision authority.
    - id: interop-github
      domain: GitHub issue, comment, Project field mutation, and fresh remote-state verification
      winner: gh-utility
      rationale: gh-utility owns exact targets, mutations, and readback; requirements-approval supplies the semantic transition.
    - id: interop-product
      domain: product scope, customer-owned product decisions, PRD authority, and product handoff
      winner: prd-engineer
      rationale: prd-engineer owns product content and PRD authority; requirements-approval supplies traced input.
    - id: interop-architecture
      domain: architecture constraints, ASRs, pattern decisions, ADRs, and architecture handoff
      winner: architecture-engineer
      rationale: architecture-engineer owns architecture decisions; customer input supplies intent or constraints.
    - id: interop-specification
      domain: implementation-ready behavior, edge cases, and specification authority
      winner: spec-engineer
      rationale: spec-engineer owns specification content; requirements-approval routes obligations and gaps.
    - id: interop-planning
      domain: delivery decomposition, sequencing, and plan readiness
      winner: delivery-planner
      rationale: delivery-planner owns plan changes and readiness.
    - id: interop-documentation
      domain: technical-document structure and documentation-only artifacts
      winner: documentation
      rationale: documentation owns form and structure when no specialized owner applies.
    - id: interop-git
      domain: commits, pushes, branches, and ref verification
      winner: git-engineer
      rationale: git-engineer owns Git authorization, history changes, and ref evidence.
  commands: []
  gotchas:
    - id: gotcha-falsify-customer-need
      priority: high
      text: Before customer escalation, consider runtime, environment, existing owning records, and a narrower technical resolution for their relevance to the question. Inspect applicable evidence; neither an irrelevant unavailable service nor an unapproved technical alternative resolves customer intent.
    - id: gotcha-preview-vs-execute
      priority: high
      text: Organizing approvals does not authorize external writes; resolve the action, target and permission before execution.
  policies:
    - id: policy-conservative-language
      title: Conservative customer language
      text: Ask only for decisions required by current scope, in plain customer language, without embedding optional enhancements or a preferred answer.
  portability:
    required: true
    rules:
      - Do not reference machine-specific paths, credentials, repository ids, Project ids, field ids, option ids, or fixed status names.
      - Keep the authority, traceability, mutation, and closure contracts understandable without external local files.
      - Treat connector and neighboring-skill names as capability expectations; accept equivalent exported data or report the unavailable boundary.
    checklist:
      - During skill maintenance only, lint and regenerate changed sources, check generated parity and local links, and inspect active dependencies for portability.
      - During skill maintenance only, compile to an isolated directory and check declared files; ordinary approval work does not compile the package or require a compiler.
      - Maintenance structural checks do not establish behavioral PASS or decision-workflow closure.
