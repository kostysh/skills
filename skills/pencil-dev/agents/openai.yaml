interface:
  display_name: "Pencil Dev"
  short_description: "Create, inspect, import, validate, or export Pencil designs"
  default_prompt: "Use $pencil-dev with the live Pencil MCP API to inspect, edit, import, validate, or export the intended open .pen design only as requested, and report evidence plus save status."

dependencies:
  tools:
    - type: "mcp"
      value: "pencil"
      description: "Required Pencil MCP tools for inspecting, editing, validating, and exporting open .pen designs."

policy:
  allow_implicit_invocation: true
