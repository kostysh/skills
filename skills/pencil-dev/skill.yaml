apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: pencil-dev
  source-version: 0.1.5
  recommended-skill-md-max-bytes: 18000
  description: |-
    Use when creating, iterating, inspecting, validating, or exporting Pencil
    `.pen` design files through Pencil MCP tools attached to an open Pencil
    editor or custom editor. Applies to generated UI mockups, app screens,
    dashboards, web pages, marketing visuals, slide-like graphics, and edits to
    existing Pencil designs where `.pen` handling must stay MCP-only.
fragments:
  overview: fragments/overview.md
references:
  - id: ref-component-libraries
    title: Component libraries
    source: references/component-libraries.md
    target: references/component-libraries.md
    required: false
    trigger: Read this when the operator asks to create, maintain, import, inspect, or use Pencil component libraries, reusable components, `.lib.pen` files, or design-system assets.
copies:
  - id: copy-agents-openai
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.
surfaces:
  active:
    requiredReferences: []
    optionalReferences:
      - ref-component-libraries
  supportingGlobs:
    - docs/*
sections:
  startHere:
    - Confirm the request needs a Pencil `.pen` design artifact, not only web code, prose, or a generic bitmap image.
    - Separate capability from substrate before acting. The target capability is an open editor-backed Pencil design that can be inspected, changed, or exported through MCP tools; CLI setup, filesystem access, or raw file metadata is not the capability.
    - Treat `.pen` files as opaque design artifacts. Do not read, grep, parse, diff, patch, or hand-edit them through filesystem tools, JSON tooling, text editors, or raw file inspection.
    - The only allowed working path for `.pen` read, inspect, edit, layout-check, screenshot, or export work is Pencil MCP connected to an open Pencil Design Editor or Pencil custom editor.
    - "Before any MCP operation beyond discovery, call `get_editor_state(include_schema: true)` and use the returned schema and active file/editor state as the contract for later operations."
    - If Pencil MCP is unavailable, cannot see the file, or reports that a file needs to be open in the editor, immediately notify the operator, then diagnose the editor/custom-editor bridge. Do not fall back to Pencil CLI, raw `.pen` access, a built-in Pencil agent, or another agent.
    - "Use `batch_get` for hierarchy/search reads, `batch_design` for design edits, `snapshot_layout(problemsOnly: true)` for structural layout checks, `get_screenshot` for visual review, `get_variables` for tokens/themes, and `export_nodes` for image/PDF exports."
    - Do not install, reinstall, invoke, or recommend Pencil CLI for `.pen` work in this skill; CLI/headless/interactive/agent/export paths are explicitly out of scope.
    - Report blocked status clearly when the required MCP/editor bridge is unavailable.
  whenToUse:
    - Creating a new Pencil design in an open Pencil editor through MCP.
    - Iterating on an existing open `.pen` file while preserving design continuity.
    - Inspecting, validating, or modifying a Pencil design through Pencil MCP tools.
    - Exporting nodes from an open `.pen` design through MCP.
    - Creating or using component libraries through MCP-visible reusable nodes and instances.
    - Producing visual mockups for websites, app screens, dashboards, slides, posters, banners, or marketing assets when MCP can operate on the open design.
  whenNotToUse:
    - The user only wants frontend code changes and no Pencil design artifact.
    - The task is generic raster image generation or photo editing; use an image generation/editing workflow instead.
    - The task requires manual JSON surgery, raw `.pen` parsing, filesystem patching, or text-editor edits inside `.pen` files.
    - The task can only be performed by Pencil CLI, CLI interactive mode, CLI agent mode, headless generation, or path-based export without an open MCP-connected editor.
    - Pencil MCP cannot see an open Pencil Design Editor/custom editor document and the operator cannot restore that bridge in the current session.
  workflow:
    - id: stage-confirm-mcp-editor-boundary
      title: Confirm MCP editor boundary
      goal: Prove that the active work can happen through the open Pencil editor, not through a stale saved-file or CLI path.
      steps:
        - Identify the intended `.pen` document and confirm it is open as a Pencil Design Editor or Pencil custom editor, not as raw text.
        - Discover/load the Pencil MCP tool surface when needed.
        - "Call `get_editor_state(include_schema: true)` before any read, edit, screenshot, layout, variable, or export operation."
        - Check that the editor state points at the intended active file/canvas/selection before changing anything.
        - Treat the returned schema and Pencil rules as the authoritative operation contract; do not infer a raw file structure.
      validation:
        - "`get_editor_state(include_schema: true)` succeeds and identifies an active Pencil editor state for the intended document."
        - The next MCP operation can be chosen from the returned schema and the available MCP tools.
    - id: stage-troubleshoot-editor-bridge
      title: Troubleshoot editor bridge
      goal: Restore MCP visibility when the editor/custom-editor bridge, not the design content, is the blocker.
      steps:
        - If Pencil MCP is unavailable or cannot see the intended `.pen`, immediately tell the operator that MCP/open-file access is blocked before attempting troubleshooting.
        - If the MCP tool reports `A file needs to be open in the editor`, ask the operator to focus the Pencil canvas for the target `.pen`.
        - Ask the operator to close any raw/text tab for the `.pen` and reopen the file with the Pencil Design Editor or Pencil custom editor.
        - Ask the operator to reload the editor window or Pencil extension when the correct editor is open but MCP still sees no file.
        - "Re-run `get_editor_state(include_schema: true)` after the operator changes focus, editor mode, or extension state."
        - If MCP still cannot see the file, mark the task blocked until the editor/custom-editor bridge is restored.
      validation:
        - "The bridge is restored only when `get_editor_state(include_schema: true)` succeeds for the intended document."
        - The operator was notified immediately when MCP or target-file access was unavailable.
        - No CLI, raw file access, filesystem patching, or alternate agent path is used to bypass the missing MCP state.
    - id: stage-read-and-plan-with-mcp
      title: Read and plan with MCP
      goal: Inspect only the design state needed for the requested change.
      steps:
        - Use `batch_get` to read top-level nodes, selected nodes, known node IDs, or grouped search patterns.
        - Combine related searches and node reads into a single `batch_get` call when possible.
        - Use low read depth first and request deeper node data only for the specific subtree needed for the task.
        - Use `get_variables` when the change depends on design tokens, themes, or CSS handoff values.
        - Use `get_guidelines` only when a task-specific Pencil guide or style is needed; do not load unrelated guides.
      validation:
        - The planned edit or export is grounded in MCP-returned nodes, variables, guidelines, or selection state.
        - The agent has not read or parsed the `.pen` file through filesystem or JSON tools.
    - id: stage-create-or-use-component-libraries
      title: Create or use component libraries
      goal: Build reusable Pencil component assets and use them in mockups without leaving the MCP-only boundary.
      steps:
        - Read `references/component-libraries.md` before creating, importing, inspecting, or using reusable components or `.lib.pen` files.
        - Work only against MCP-visible open library and target files; immediately notify the operator when an editor UI action is required for library creation, import, or asset placement.
        - Use `batch_design` and `batch_get` according to the schema to create/list reusable components and place instances, then verify refs or instances through MCP.
      validation:
        - The component inventory and target mockup usage are visible through MCP reads.
        - Any required UI-only library setup/import step is reported immediately and not bypassed with CLI or raw `.pen` editing.
    - id: stage-create-or-iterate-with-mcp
      title: Create or iterate with MCP
      goal: Modify the open Pencil design through schema-backed MCP operations.
      steps:
        - Use `batch_design` for creating frames, inserting nodes, copying, updating properties, replacing, moving, deleting, setting variables, or generating assets in the open design.
        - Pass the user's brief or requested change directly unless the user asked for elaboration.
        - Keep edits scoped to the intended nodes, frames, or canvas region from MCP state.
        - After broad edits, use `batch_get` or `snapshot_layout` to confirm the intended nodes exist and copied reference/foundation frames were removed when they were only scaffolding.
        - Do not claim completion from a successful MCP call alone; verify the resulting design state.
      validation:
        - MCP reports the edit operation succeeded and follow-up MCP inspection shows the intended design state.
        - No Pencil CLI, CLI agent, CLI interactive session, headless prompt run, raw JSON edit, or filesystem patch was used.
    - id: stage-export-and-review-with-mcp
      title: Export and review with MCP
      goal: Close the loop with MCP layout and visual evidence.
      steps:
        - "Run `snapshot_layout(problemsOnly: true)` after material edits, or a scoped `snapshot_layout` when only one node subtree changed."
        - Use `get_screenshot` sparingly for the smallest meaningful node when visual fidelity must be checked.
        - Use `export_nodes` for PNG, JPEG, WEBP, or PDF exports from MCP-visible node IDs.
        - Visually inspect MCP screenshots or generated exports before reporting done when visual review is part of the request.
        - If MCP export or screenshot cannot operate on the open design, report the split result precisely and do not switch to CLI export.
      validation:
        - The final report names the MCP layout check, screenshot, or export used as evidence.
        - Any missing visual review, export, or layout validation is reported as a limitation instead of implied success.
    - id: stage-maintain-design-handoff-clarity
      title: Maintain design handoff clarity
      goal: Keep multi-frame mockups reviewable without turning design artifacts into false delivery gates.
      steps:
        - For a new or materially updated multi-frame mockup, add or update a sibling README or index next to the `.pen` file when the project expects a handoff artifact.
        - Include purpose, artifact status, source/spec links, frame inventory, anti-claims, privacy constraints, and review evidence.
        - Verify frame inventory through MCP after cleanup.
        - Treat `.pen` files, screenshots, and exports as design substrate. Do not create or hold GitHub/blocker tasks on mockups when the delivery plan accepts implemented runtime behavior.
      validation:
        - Multi-frame mockups have enough handoff context for review when a README/index is expected.
        - The report does not claim runtime capability from Pencil mockups, screenshots, or exports alone.
  interop:
    - id: interop-frontend-design
      domain: art direction for web UI quality
      winner: frontend-design
      rationale: '`pencil-dev` owns MCP-only Pencil artifact creation, iteration, export, and `.pen` handling; frontend-design owns broader visual direction.'
    - id: interop-browser-testing
      domain: testing built web apps
      winner: playwright or browser testing skills
      rationale: '`pencil-dev` only proves Pencil design artifacts, not runtime behavior of implemented web apps.'
    - id: interop-imagegen
      domain: bitmap-only generation or editing
      winner: imagegen
      rationale: Use Pencil only when a durable `.pen` artifact is part of the requested outcome and MCP can operate on an open design.
  commands: []
  gotchas:
    - id: gotcha-setup-is-not-outcome
      priority: high
      text: Do not claim success from tool discovery, MCP listing, editor reload, or setup alone; real progress needs MCP-visible design state or an MCP-produced export/screenshot.
    - id: gotcha-opaque-pen-files
      priority: high
      text: Do not read, grep, parse, diff, patch, or hand-edit `.pen` files as text or JSON. Treat them as opaque and use Pencil MCP only.
    - id: gotcha-no-cli-fallback
      priority: high
      text: Do not use Pencil CLI, reinstall Pencil CLI, CLI interactive mode, CLI agent mode, headless generation, or CLI export as fallback for `.pen` work.
    - id: gotcha-editor-bridge
      priority: high
      text: "If MCP cannot see the intended `.pen`, the task is blocked on the editor/custom-editor bridge until `get_editor_state(include_schema: true)` succeeds."
    - id: gotcha-library-substrate
      priority: high
      text: Do not claim component-library work from naming, screenshots, or duplicate shapes alone; verify reusable components, refs, or instances through MCP.
    - id: gotcha-prompt-fidelity
      priority: high
      text: Do not silently add creative detail to the user's prompt. Pencil has its own design operations; invented specifics can conflict with the brief.
    - id: gotcha-durable-output-location
      priority: medium
      text: Do not use temporary directories for durable exports or handoff docs unless the user explicitly wants throwaway output.
    - id: gotcha-reference-frame-cleanup
      priority: medium
      text: Copied foundation/reference frames are scaffolding. Remove them from the target `.pen` after target frames are created and verify the top-level inventory through MCP.
    - id: gotcha-design-substrate
      priority: high
      text: Pencil mockups, screenshots, and exports are design substrate, not implemented runtime behavior or production delivery gates.
  policies:
    - id: policy-capability-reality
      title: Capability reality policy
      text: A completed Pencil task means the user can inspect the open MCP-backed design state or review an MCP-produced screenshot/export. CLI setup, filesystem metadata, or raw `.pen` access is substrate and does not prove design capability.
    - id: policy-mcp-only
      title: MCP-only `.pen` policy
      text: All `.pen` read, inspect, edit, layout-check, screenshot, and export work must go through Pencil MCP tools attached to an open Pencil editor/custom editor.
    - id: policy-prohibited-paths
      title: Prohibited paths policy
      text: Pencil CLI, CLI headless runs, CLI interactive mode, CLI agent mode, CLI export, CLI installation/reinstallation, built-in Pencil agents, raw JSON, text editors, filesystem reads, grep, diff, and patch tools are not valid `.pen` workflows for this skill.
    - id: policy-editor-bridge
      title: Editor bridge policy
      text: "If Pencil MCP is unavailable or `get_editor_state(include_schema: true)` cannot see the intended `.pen`, immediately notify the operator, then troubleshoot the editor/custom-editor bridge; if it remains unavailable, report blocked instead of bypassing MCP."
    - id: policy-schema-first
      title: Schema-first policy
      text: "Call `get_editor_state(include_schema: true)` before other MCP operations unless the current `.pen` schema is already in context, and follow that schema for every `batch_get`, `batch_design`, layout, screenshot, variable, or export operation."
    - id: policy-prompt-fidelity
      title: Prompt fidelity policy
      text: Pass the user's design request or edit request directly unless the user asks you to elaborate the brief.
    - id: policy-evidence
      title: Evidence policy
      text: Prefer MCP layout checks plus MCP screenshot/export evidence. If visual inspection is impossible, say the artifact is unreviewed and explain why.
    - id: policy-component-libraries
      title: Component library policy
      text: Component library work must prove reusable component origins and mockup instances through MCP-visible nodes; UI-only library creation/import steps must be surfaced to the operator immediately when MCP does not expose them.
    - id: policy-handoff-clarity
      title: Handoff clarity policy
      text: Multi-frame mockups need a sibling README or index when the project expects a handoff artifact; it should explain purpose, status, source links, frame inventory, anti-claims, privacy constraints, and review evidence.
    - id: policy-runtime-delivery
      title: Runtime delivery policy
      text: Do not treat Pencil artifacts as proof of implemented runtime capability when the project delivery plan accepts runtime behavior.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep mandatory Pencil guidance inside this skill folder; external Pencil docs are optional update context, not required runtime dependencies.
      - Use relative links for local metadata, docs, references, scripts, and assets.
    checklist:
      - Run the skill-source-compiler check command after regeneration when this source bundle changes.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm copied standalone skill users can understand the MCP-only `.pen` boundary from `SKILL.md` alone.
