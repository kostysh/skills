apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: web-ui-reviewer
  source-version: 0.2.1
  recommended-skill-md-max-bytes: 20000
  description: Review web UI code and rendered states against project requirements and Web Interface Guidelines. Use for UI/UX, accessibility, design, content, form, or frontend-performance audits that need scoped findings and evidence limits; not implementation or conformance certification.
fragments:
  overview: fragments/overview.md
references:
  - id: ref-references-web-interface-guidelines
    title: Web Interface Guidelines
    source: references/web-interface-guidelines.md
    target: references/web-interface-guidelines.md
    required: true
    trigger: Read this before every review; use its classification and the sections relevant to the requested UI scope.
assets: []
copies:
  - id: copy-agents-openai
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.
supporting: []
surfaces:
  active:
    requiredReferences:
      - ref-references-web-interface-guidelines
    optionalReferences: []
  supportingGlobs:
    - docs/*
    - docs/forward-tests/*
    - docs/logs/*
sections:
  startHere:
    - Identify the exact review claim, consumer, supplied UI evidence, and authoritative project or design-system rules.
    - Read the required Web Interface Guidelines reference before reviewing; treat it as a heuristic baseline, not a conformance standard.
    - Match code, browser, screenshot, accessibility, and performance evidence to the claim; report missing evidence instead of widening the conclusion.
    - Freeze a stable target identity; for remediation re-audit, limit work to fixed findings, current evidence, and the adjacent UI regression surface.
    - Keep the review read-only and hand implementation, formal code-review, browser collection, and security decisions to their owning skills.
  whenToUse:
    - Review web UI code, diffs, screenshots, or rendered states for actionable interface findings.
    - Audit accessibility risks, interaction behavior, responsive presentation, forms, content, visual consistency, or frontend performance evidence.
    - Provide a scoped UI-domain assessment inside a broader code or product review.
    - Re-audit prior UI findings after remediation without repeating unchanged verified screens or states.
  whenNotToUse:
    - The task is not a web UI, UX, accessibility, design, typography, form, content handling, or frontend performance review.
    - The task is implementation work rather than review; use the relevant frontend or framework skill.
    - The task is a security-first audit; use security-reviewer.
    - The task requires formal WCAG, legal, assistive-technology, or performance certification; use the responsible specialist and treat this skill as supporting review only.
  workflow:
    - id: stage-establish-review-basis
      title: Establish the review basis
      goal: Bound the requested claim to authoritative rules and available evidence.
      steps:
        - Record the requested claim, consumer, files or states in scope, and supplied code, diff, URL, screenshot, browser, design-system, or performance evidence.
        - Record a stable target identity and, for remediation re-audit, the prior findings, prior snapshot, exact remediation delta, and unchanged verified states excluded from repetition.
        - Separate platform and accessibility behavior from product preferences; require accepted project authority before reporting a preference as a defect.
        - Select the strongest honest status the evidence could support before beginning the review.
      validation:
        - The review basis names its authority, evidence, and unassessed scope without implying broader readiness.
    - id: stage-review-observable-ui
      title: Review observable UI behavior
      goal: Produce supported findings without converting heuristics or missing evidence into defects.
      steps:
        - Inspect code for directly observable semantics and risk patterns; use current rendered evidence for visual, responsive, overlay, loading, empty, error, focus, and interaction claims.
        - Classify each item as a supported defect, a risk needing named validation, or a non-binding preference; report only supported defects as findings.
        - Use measurements for performance conclusions and browser or design-tool evidence for visual conclusions; otherwise mark the area not assessed.
      validation:
        - Every finding identifies the evidence and authority that make it actionable.
        - Static analysis, screenshots, tests, or checklists are not presented as proof beyond what they observed.
    - id: stage-report-and-handoff
      title: Report and hand off
      goal: Return a concise result that the next owner can act on without mistaking partial coverage for approval.
      steps:
        - Start with one plain-language outcome sentence before the formal result status.
        - Choose findings, no-material-findings, limited, or blocked according to the output contract.
        - Group findings by file or artifact, then state reviewed evidence, coverage limits, unassessed states, and required handoffs.
        - Keep remediation as a fix hint unless the user separately authorizes implementation.
      validation:
        - No-material-findings appears only when evidence is sufficient for the explicitly bounded claim.
        - Limited and blocked results name the missing evidence or authority needed to strengthen the result.
  interop:
    - id: interop-code-review
      domain: formal diff scope, finding severity, merge guidance, and overall code-review verdict
      winner: code-reviewer
      rationale: web-ui-reviewer supplies UI-domain findings; code-reviewer owns the formal code-review process and merge conclusion.
    - id: interop-browser-evidence
      domain: navigating a live UI, collecting current screenshots, exercising interactions, and recording viewport or state evidence
      winner: agent-browser or playwright
      rationale: Browser skills collect runtime evidence; web-ui-reviewer decides what UI evidence is required and interprets it within the bounded review.
    - id: interop-design-and-implementation
      domain: visual direction, component implementation, framework behavior, and test changes
      winner: frontend-design and the relevant frontend or framework skill
      rationale: web-ui-reviewer remains read-only and hands supported findings to the implementation owner.
    - id: interop-security
      domain: API or server authorization, vulnerability severity, secrets, and security controls
      winner: security-reviewer
      rationale: web-ui-reviewer may flag misleading UI or unsafe user-facing error behavior but cannot establish backend security.
  commands: []
  gotchas:
    - id: gotcha-no-visual-proof
      priority: high
      text: Do not return no-material-findings from code inspection alone when visual, responsive, focus, overlay, loading, empty, or error behavior is part of the claim.
    - id: gotcha-design-system-drift
      priority: high
      text: Flag design-system drift only when an accepted design system or project convention establishes the expected component, token, or pattern; otherwise label the observation as a non-binding preference.
    - id: gotcha-unmeasured-performance
      priority: high
      text: Do not turn list size, dependency presence, preload, preconnect, or render patterns into performance defects without scale or measurement evidence; report a validation risk instead.
  policies:
    - id: policy-result-status
      title: Result status
      text: Use findings when at least one defect is supported; no-material-findings only when evidence is sufficient for the bounded claim; limited when useful review occurred but missing evidence prevents that conclusion; blocked when no defensible review can be performed.
    - id: policy-current-screenshot-evidence
      title: Current screenshot evidence
      text: Require current browser or design-tool evidence for affected desktop and mobile states, including error, loading, empty, drawer, and modal states when those states are part of the requested claim; screenshots alone do not prove keyboard, assistive-technology, or backend behavior.
    - id: policy-guidance-freshness
      title: Guidance freshness and precedence
      text: The portable reference is the reproducible baseline. A live upstream overlay may add non-conflicting guidance only when its URL and revision or retrieval date are reported; it never creates product authority or silently overrides project requirements.
    - id: policy-bounded-remediation-reaudit
      title: Bounded remediation re-audit
      text: On a new stable snapshot, re-audit fixed prior findings, the exact remediation delta, original UI failure states, current evidence, and adjacent states selected by a blast-radius check. Skip unchanged verified states; widen when the claim, UI authority, user-visible behavior, or material scope changed or blast radius is unbounded. Cosmetic edits do not close behavioral or accessibility findings.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory web-ui-reviewer guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
