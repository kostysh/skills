sections:
  startHere:
    - Confirm the task concerns GitHub state and can be handled with the installed gh CLI.
    - Resolve the host, repository or organization, resource identifier, and requested outcome.
    - Load only the reference matching the use case, then use native gh commands directly.
    - After a mutation, run a fresh native gh read and report the observed result or failure.
  whenToUse:
    - Inspecting or changing GitHub repositories, issues, pull requests, Actions, releases, Projects, Codespaces, rulesets, secrets, variables, keys, search, API resources, or gh skill state.
    - Translating a GitHub request or URL into native gh commands.
    - Diagnosing gh authentication, host, permissions, API, or rate limits.
  whenNotToUse:
    - Local commits, rebases, worktrees, branch history, or push policy; use git-engineer.
    - Code-review judgment or review-feedback remediation; use code-reviewer or gh-address-comments.
    - Diagnosing and fixing CI failures; use gh-fix-ci, with gh-utility limited to GitHub inspection.
    - Security findings or control judgments; use security-reviewer.
    - Skill authoring, compilation, or review; use skill-creator, skill-source-compiler, or skill-reviewer.
  workflow:
    - id: select-command
      title: Select the native gh command
      goal: Choose the smallest installed gh command for the requested GitHub use case.
      steps:
        - Resolve the host, target, and resource identifier.
        - Check installed gh help when command syntax or JSON fields are uncertain.
      validation:
        - The command and target are explicit.
    - id: run-command
      title: Run gh directly
      goal: Execute the native gh command without an intermediary transport.
      steps:
        - Use explicit repository, owner, or hostname selectors when context is ambiguous.
        - Run only the requested and authorized mutation.
      validation:
        - The command output or failure is captured without exposing secrets.
    - id: verify-result
      title: Verify the result
      goal: Confirm the requested GitHub state after a mutation.
      steps:
        - Run a fresh native gh read for the changed resource.
        - Report the observed result, command failure, or remaining external evidence boundary.
      validation:
        - Completion is based on current gh output, not on a shown command or dry-run.
  interop:
    - id: interop-local-git
      domain: Local Git history, worktrees, commits, rebases, and push policy
      winner: git-engineer
      rationale: gh-utility covers native GitHub CLI use; git-engineer owns local Git decisions.
    - id: interop-review
      domain: Review findings and feedback remediation
      winner: code-reviewer or gh-address-comments when available
      rationale: gh-utility may fetch or post GitHub state but does not decide code findings or fixes.
    - id: interop-ci
      domain: Failing pull-request checks
      winner: gh-fix-ci when available
      rationale: gh-utility may inspect checks; the specialized skill owns diagnosis and remediation.
    - id: interop-security
      domain: Security findings and policy judgment
      winner: security-reviewer
      rationale: gh-utility operates gh and does not issue security verdicts.
  gotchas:
    - id: gotcha-version-drift
      priority: high
      text: gh command families, flags, and JSON fields vary by installed version; check gh help before using uncertain syntax.
    - id: gotcha-context
      priority: high
      text: Use explicit --repo or --hostname when the current checkout or host could select the wrong target.
    - id: gotcha-external-ci
      priority: medium
      text: GitHub may expose only a link for external CI; report that boundary instead of claiming external-provider state.
  policies:
    - id: policy-native-first
      title: Native gh first
      text: Use installed gh commands directly. This skill ships no helper today; a future helper may only aggregate native gh reads or run a simple explicit sequence of native gh calls, never proxy transport, authorization, redaction, mutation policy, or semantic verdicts.
    - id: policy-authorization
      title: Authorization
      text: An exact unambiguous request authorizes that action and target; ask only when action, target, destructive scope, or secret handling remains ambiguous.
    - id: policy-secrets
      title: Secret confidentiality
      text: Never print, log, echo, or persist secret and token values; use native gh secret and variable input mechanisms.
    - id: policy-evidence
      title: Evidence
      text: Report command output and fresh post-action reads honestly; help, dry-run, or validation output does not prove a GitHub mutation occurred.
  portability:
    required: true
    rules:
      - Keep mandatory guidance, references, assets, license, and UI metadata inside this skill folder.
      - Use only relative local links and explicit GitHub host or repository selectors.
      - Do not depend on Node.js, package metadata, proxy CLIs, or files outside the skill folder.
      - If a future script is justified, keep it to transparent aggregation or a simple sequence of native gh calls with no independent policy or transport semantics.
    checklist:
      - Run skill-source-compiler lint, regenerate, and check after source edits.
      - Compile to an isolated directory and confirm that no source, tests, package metadata, or scripts are emitted.
      - Search active and declared files for machine-specific absolute filesystem dependencies.
