apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: gh-utility
  source-version: 1.2.1
  recommended-skill-md-max-bytes: 16000
  description: >-
    Use when GitHub CLI (`gh`) is required for repos, issues, PRs, Actions, releases,
    Projects, Codespaces, secrets, variables, rulesets, search, API access, or `gh
    skill` commands. Keep targets explicit and verify changes; route Git history,
    review, CI fixes, security, and skill authoring elsewhere.
  license: MIT
  compatibility: >-
    Requires GitHub CLI gh and network access to the relevant GitHub host. Command families,
    flags, and JSON fields that may vary by version must be checked against installed help.

fragments:
  overview: fragments/overview.md
  finalChecks: fragments/final-checks.md

