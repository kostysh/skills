apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: implementation-discipline
  source-version: 0.1.7
  recommended-skill-md-max-bytes: 18000
  description: >-
    Behavioral coding discipline for writing, modifying, and reviewing code
    with explicit assumptions, project-purpose alignment, minimal complexity,
    surgical diffs, and verifiable success criteria.
  compatibility: >-
    Portable documentation-only skill. Use alongside language, framework, and
    review skills; it does not replace domain-specific engineering guidance.

references:
  - id: ref-core-principles
    title: Core principles
    source: references/core-principles.md
    target: references/core-principles.md
    required: true
    trigger: Read this first when the task involves writing, changing, or reviewing code.
  - id: ref-verification-loop
    title: Verification loop
    source: references/verification-loop.md
    target: references/verification-loop.md
    required: true
    trigger: Read this before implementing multi-step changes or deciding how to verify success.

assets: []
copies: []
supporting: []

surfaces:
  active:
    requiredReferences:
      - ref-core-principles
      - ref-verification-loop
    optionalReferences: []
  supportingGlobs:
    - docs/*
    - docs/logs/*

sections:
  startHere:
    - Confirm the task actually includes code changes, refactoring, or code review.
    - For non-trivial local work, identify the larger project goal or end-to-end capability the change is supposed to advance before changing or assessing code.
    - State assumptions, constraints, and any blocking ambiguity before changing or assessing code.
    - When implementing from an accepted audit or review report, create a remediation matrix before claiming completion.
    - Prefer the first sufficient design rung and define the verification target before implementing.
    - Use this skill together with the relevant language, framework, or review skill; it does not replace them.
  whenToUse:
    - Implement new code with minimal complexity and explicit verification.
    - Modify existing code where overreach or speculative refactoring is a risk.
    - Review code when you need to check for unnecessary complexity or weak success criteria.
  whenNotToUse:
    - The task is purely non-code documentation or analysis.
    - The task depends entirely on domain rules owned by another skill and no code is being changed.
    - The requested change is intentionally exploratory architecture work rather than implementation.
  workflow:
    - id: stage-clarify
      title: Clarify the task and the target
      goal: Make the implementation target explicit before touching code.
      steps:
        - For non-trivial local work, identify the larger project goal or end-to-end flow and the role this local change plays in it.
        - State assumptions that the change relies on.
        - Surface ambiguity instead of silently choosing an interpretation; stop and ask when a safe conservative assumption is not available.
        - Define what successful completion will look like in observable terms.
      validation:
        - Non-trivial local work is tied to a project goal or end-to-end flow, or explicitly labeled as purpose-uncertain or support-only.
        - The chosen interpretation is explicit.
        - Any blocking ambiguity has either a stated conservative assumption or an explicit ask.
        - Success can be checked without vague phrases like "should work now".
    - id: stage-capability-reality
      title: Run a capability reality checkpoint
      goal: Prevent implementation work from turning a claimed capability into substrate-only progress without saying so.
      steps:
        - For feature, runtime, product, agent, or system-capability changes, state the observable behavior the system should have after the work.
        - Separate real behavior from substrate such as storage, APIs, jobs, wrappers, logs, config, migrations, tests, or documentation.
        - "State anti-claims: what the change will still not make possible after it is complete."
        - Check whether the narrow task framing advances, ignores, or conflicts with the stated project purpose; call out misleading framing before implementation.
        - Check whether the acceptance criteria can be satisfied without delivering the observable behavior.
        - If the acceptance criteria can pass through substrate-only work, call that a specification defect before implementation and either narrow the claim or ask to rewrite the spec.
      validation:
        - The implementation target is an observable behavior or is explicitly labeled as substrate-only.
        - Any substrate-only result is not described as a completed capability.
        - The final report states important behavior that remains non-working.
    - id: stage-remediation-matrix
      title: Convert accepted audit reports into a remediation matrix
      goal: Keep audit remediation tied to concrete behavior, evidence, and explicit status.
      steps:
        - For each accepted finding or recommendation, map `finding/recommendation -> concrete change -> test/evidence -> status`.
        - "Use only these statuses unless the project defines stricter equivalents: `implemented`, `verified`, `blocked-by-compatibility`, `deferred-by-trigger`, and `not-applicable`."
        - For `deferred-by-trigger`, name the shortcut ceiling, revisit trigger, and evidence needed when the trigger occurs.
        - Do not mark tooling, wrappers, metadata, config, migrations, tests, docs, or other substrate as runtime capability unless observable behavior and acceptance evidence prove it.
        - If a recommendation is only substrate, label it as substrate and state which behavior remains unverified.
      validation:
        - Every accepted finding or recommendation has a mapped change or a justified non-implementation status.
        - "`verified` entries name concrete evidence."
        - "`deferred-by-trigger` entries name a concrete trigger instead of vague later work."
        - Substrate-only entries are not reported as delivered runtime capability.
    - id: stage-design-minimal
      title: Design the smallest sufficient change
      goal: Prevent speculative abstractions and unnecessary surface area.
      steps:
        - Choose the first sufficient rung that satisfies the request or preserves the intended capability.
        - "Check rungs in order: do not build it when the need is speculative; use language/runtime standard features; use native platform or existing project features; use an already-installed dependency; then write the smallest code that works."
        - Reject flexibility, configurability, or abstractions that are not demanded by the task.
        - Prefer adapting existing code over introducing a new layer for one use.
        - Add a new dependency, factory, interface, provider, config knob, or wrapper only when the simpler rung fails for a concrete reason.
      validation:
        - Every new concept in the diff is required by the request.
        - The chosen rung is explicit when the change adds a dependency, abstraction, layer, or new surface.
        - A simpler design was considered and rejected for a concrete reason.
    - id: stage-implement-surgically
      title: Implement surgically
      goal: Keep the diff local, traceable, and easy to review.
      steps:
        - Change only the code needed for the request.
        - Match existing local style and structure unless the task explicitly requires broader cleanup.
        - Remove only the dead code or imports created by your own change.
      validation:
        - Each changed hunk traces directly to the requested outcome.
        - Unrelated cleanup or refactoring is absent from the diff.
    - id: stage-verify
      title: Verify and report with evidence
      goal: Close the loop with concrete checks instead of intuition.
      steps:
        - Run the narrowest meaningful checks that prove the change.
        - Prefer existing local test, lint, typecheck, build, or smoke-test commands when they are the narrowest meaningful proof.
        - For low-risk non-trivial logic such as a branch, loop, parser, or formatting rule, leave the smallest runnable check that would fail if the behavior regresses.
        - For security, privacy, money, data-loss, auth, accessibility, release, or production-wiring paths, use the stronger project/domain verification instead of a minimal self-check.
        - If a bug was fixed, confirm the failing behavior is now covered or demonstrably resolved.
        - When repeated independent validation signals point to one defect class, expand verification from the specific symptom to adjacent observable cases before reporting done.
        - If verification cannot run, use the next-best static check or state why no useful check is available.
        - Report the outcome, checks run, checks not run, and remaining risk.
      validation:
        - The final report names the checks that passed or explains why they could not run.
        - Any unverified risk is called out explicitly.
  interop:
    - id: interop-language-framework
      domain: language, framework, and platform specifics
      winner: The relevant domain skill
      rationale: This skill governs behavioral discipline, not APIs or platform rules.
    - id: interop-code-review
      domain: formal review workflow, severity, and evidence format
      winner: code-reviewer
      rationale: This skill helps shape implementation quality, while code-reviewer owns review process and findings output.
  commands: []
  gotchas:
    - id: gotcha-surface-ambiguity
      priority: high
      text: Do not hide uncertainty behind implementation; surface assumptions and ambiguities before coding.
    - id: gotcha-no-speculative-abstractions
      priority: high
      text: Do not add speculative abstractions, configuration, or error handling that the task did not require.
    - id: gotcha-first-rung
      priority: high
      text: Do not add a dependency, layer, factory, interface, provider, wrapper, or config surface until standard, native, existing-project, or inline options have been checked and found insufficient.
    - id: gotcha-no-broadened-diff
      priority: high
      text: Do not broaden the diff with unrelated cleanup or refactoring.
    - id: gotcha-verify-or-say-so
      priority: medium
      text: If you cannot verify the intended outcome, say so explicitly instead of implying confidence.
    - id: gotcha-stable-evidence
      priority: high
      text: Do not hand off non-trivial work from a moving diff. Stabilize the changed scope, run the relevant verification, and label any remaining claim as implemented but not verified.
    - id: gotcha-stop-on-blocking-ambiguity
      priority: medium
      text: If the next change would depend on guessing through blocking ambiguity, stop and ask before editing.
    - id: gotcha-acceptance-exploit
      priority: high
      text: Do not treat acceptance criteria as sufficient when they can be satisfied by mocks, metadata, tables, logs, wrappers, or documentation without the claimed behavior.
    - id: gotcha-local-correctness
      priority: high
      text: Do not treat local correctness as sufficient when the change does not advance, or actively conflicts with, the intended project capability.
    - id: gotcha-remediation-matrix
      priority: high
      text: Do not collapse accepted audit findings into a vague done list; keep finding, change, evidence, and status linked.
    - id: gotcha-shortcut-trigger
      priority: high
      text: Do not leave deliberate shortcuts or deferrals without a named ceiling and concrete revisit trigger.
  policies:
    - id: policy-project-purpose-fit
      title: Project-purpose fit policy
      text: Local implementation correctness is insufficient when the work fails to advance the intended project capability. For non-trivial work, state the larger goal or end-to-end flow, the local role, and any purpose assumptions before coding.
    - id: policy-simplicity-first
      title: Simplicity-first policy
      text: Default to the first sufficient implementation rung that satisfies the request. Extra flexibility is a cost, not a virtue.
    - id: policy-first-sufficient-rung
      title: First sufficient rung policy
      text: Before adding code, layers, dependencies, configurability, or documentation, check whether the work can be skipped, handled by language/runtime standard features, handled by native platform or existing project features, handled by an already-installed dependency, or implemented inline with less surface area.
    - id: policy-surgical-diff
      title: Surgical-diff policy
      text: Every changed line should trace directly to the task; unrelated cleanup belongs in a different change set.
    - id: policy-evidence-over-intuition
      title: Evidence-over-intuition policy
      text: Completion requires naming the checks that prove success or the exact gap that remains.
    - id: policy-operator-not-qa
      title: Operator-not-QA policy
      text: Operator feedback is not the primary verification mechanism. For UI, API, data, security, or delivery-flow work, produce current tool evidence before asking for approval; user screenshots may reveal defects but must not replace agent-side checks.
    - id: policy-deferred-shortcut
      title: Deferred shortcut policy
      text: A deliberate simplification is acceptable only when the final report or remediation matrix names its ceiling, the trigger that requires revisiting it, and the evidence needed before upgrading it.
    - id: policy-capability-reality
      title: Capability reality policy
      text: A feature is not complete unless it creates or preserves an observable capability. Infrastructure may be valuable, but it must be labeled as infrastructure. Tooling and substrate are not runtime capability without observable behavior and acceptance evidence.
    - id: policy-reporting-contract
      title: Reporting contract
      text: Final reports must name the completed outcome, verification evidence, and any unverified risk. For non-trivial work, also state whether the result advances the intended project capability or remains support-only; when another active review skill defines a stricter format, follow that format while preserving the same evidence.
  portability:
    required: true
    rules:
      - Do not reference machine-specific paths or external repository state.
      - Keep all required implementation-discipline guidance inside this skill folder.
      - Treat examples as behavioral patterns, not as framework-specific rules.
    checklist:
      - Confirm the generated SKILL links both required references.
      - Confirm no absolute paths appear in the emitted skill.
