sections:
  startHere:
    - Confirm the task is about Next.js framework behavior, preferably an App Router project or migration.
    - "Inspect local context before changing code: installed `next` version, App Router vs Pages Router, package manager, validation commands, and deployment target."
    - Load only the active reference files that match the current task; do not read every reference by default.
    - Preserve existing project conventions unless they conflict with Next.js behavior, version-specific migration rules, or the explicit request.
    - Run the narrowest meaningful verification such as `next build`, typecheck, lint, tests, or a browser smoke check; report any gap.
  whenToUse:
    - Building, changing, reviewing, or troubleshooting Next.js applications.
    - Working with App Router file conventions, React Server Components, Server Actions, Route Handlers, async request APIs, metadata, image/font optimization, scripts, bundling, hydration, parallel routes, or self-hosting.
    - Migrating or reviewing version-sensitive Next.js 15/16 behavior such as async params/searchParams, async cookies/headers, proxy.ts, or Turbopack defaults.
  whenNotToUse:
    - The project is a generic React SPA without Next.js framework behavior; use react-spa-engineer.
    - The task is purely TypeScript language or toolchain work; use typescript-engineer.
    - The task is purely reusable React component correctness without Next.js boundaries; use react-components-engineer.
    - The task is pure visual design with no Next.js-specific implementation concern; use frontend-design.
    - The task is backend Node.js runtime behavior outside Next.js; use node-engineer.
  workflow:
    - id: stage-establish-next-context
      title: Establish Next.js context
      goal: Ground the work in the project's actual Next.js version, router model, and deployment constraints.
      steps:
        - Inspect package metadata, config, route tree, and existing commands before choosing a framework pattern.
        - Identify version-sensitive behavior that affects the change.
        - Choose the smallest relevant reference file for the specific area.
      validation:
        - The selected approach matches the installed Next.js version or explicitly states a version assumption.
        - The work is scoped to real Next.js behavior, not generic React or TypeScript guidance.
    - id: stage-apply-framework-pattern
      title: Apply the framework pattern
      goal: Make the requested change using Next.js primitives and boundaries that fit the route, runtime, and data flow.
      steps:
        - Use the loaded reference guidance and local project conventions together.
        - Keep Server Component, Client Component, Server Action, Route Handler, and runtime boundaries explicit.
        - Prefer the least invasive framework-supported solution that satisfies the observable task.
      validation:
        - The result avoids known Next.js anti-patterns for the touched area.
        - Any substrate-only work such as config, docs, or wrappers is not described as completed runtime behavior unless verified.
    - id: stage-verify-next-behavior
      title: Verify Next.js behavior
      goal: Prove the framework behavior with the narrowest available project check.
      steps:
        - Run existing validation that exercises the changed route, build, type surface, or browser behavior.
        - For build/runtime issues, prefer `next build` or the repo's production-equivalent command when feasible.
        - If validation cannot run, perform the next-best static check and report the limitation.
      validation:
        - The final report names the checks that passed or the exact verification gap.
  interop:
    - id: interop-typescript
      domain: TypeScript language, tsconfig, linting, and type-system issues
      winner: typescript-engineer
      rationale: This skill owns Next.js framework semantics; TypeScript language/toolchain rules belong to typescript-engineer.
    - id: interop-react-components
      domain: reusable React component correctness, SSR-safe rendering, portals, and component API hardening
      winner: react-components-engineer
      rationale: Use this skill for Next.js boundaries and App Router usage, but let react-components-engineer own reusable component behavior.
    - id: interop-react-spa
      domain: generic client-side React SPA architecture
      winner: react-spa-engineer
      rationale: Use react-spa-engineer when Next.js server routing, RSC, and framework APIs are not central.
    - id: interop-frontend-design
      domain: visual design, UI hierarchy, and frontend presentation polish
      winner: frontend-design
      rationale: Use frontend-design for visual direction while this skill owns Next.js implementation constraints.
    - id: interop-node-runtime
      domain: general Node.js runtime behavior outside Next.js
      winner: node-engineer
      rationale: Use this skill for Next.js runtime selection and deployment-specific framework behavior; use node-engineer for broader Node runtime work.
  commands: []
  gotchas:
    - id: gotcha-version-sensitive
      priority: high
      text: Next.js APIs are version-sensitive; verify installed `next` before applying async params/searchParams, async cookies/headers, proxy.ts, Turbopack, or debug-MCP guidance.
    - id: gotcha-client-boundary-sprawl
      priority: high
      text: Do not add 'use client' at a broad route/layout level to fix a narrow hook or browser API need; isolate the smallest Client Component.
    - id: gotcha-rsc-serialization
      priority: high
      text: Server-to-client props must be serializable except for documented Server Action cases.
    - id: gotcha-route-handler-page-conflict
      priority: high
      text: A route segment cannot expose a GET Route Handler and a page for the same path without a real conflict; separate UI routes from API routes.
    - id: gotcha-self-hosting-assumptions
      priority: medium
      text: Self-hosting is not equivalent to Vercel hosting unless cache handlers, image optimization, runtime env behavior, and process management are explicitly configured.
    - id: gotcha-official-components
      priority: medium
      text: Prefer next/image, next/font, and next/script over native tags when the framework component addresses the use case.
  policies:
    - id: policy-app-router-first
      title: App Router first policy
      text: Prefer App Router and React Server Component semantics when the project uses `app/`; do not import Pages Router assumptions unless the project still uses `pages/`.
    - id: policy-version-aware
      title: Version-aware policy
      text: Treat Next.js version-specific guidance as conditional until the installed `next` version or migration target is known.
    - id: policy-boundary-integrity
      title: Boundary integrity policy
      text: Keep server/client/runtime/data boundaries explicit and local; broad boundary changes require a concrete behavioral reason.
    - id: policy-evidence
      title: Evidence policy
      text: Completion requires a concrete check such as build, typecheck, lint, test, or browser verification, or an explicit report of why no meaningful check could run.
    - id: policy-active-surface
      title: Active normative surface
      text: "`SKILL.md` and the referenced files listed in this source bundle are the active default instruction surface; docs/* remains supporting unless explicitly promoted."
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory Next.js guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
      - Treat external Next.js documentation links as optional verification context, not required local dependencies.
    checklist:
      - Run the skill-source-compiler lint and check commands after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
      - Confirm generated links point to local `references/*` files or clearly optional external docs.
