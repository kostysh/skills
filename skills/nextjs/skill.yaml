apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: nextjs
  source-version: 0.1.1
  recommended-skill-md-max-bytes: 20000
  description: >-
    Build, review, and debug Next.js App Router apps using RSC, Server Actions,
    Route Handlers, async request APIs, metadata, image/font optimization,
    bundling, hydration, parallel routes, or self-hosting. Use for Next.js-specific
    and version-sensitive behavior, not generic React or TypeScript work.

fragments:
  overview: fragments/overview.md

references:
  - id: ref-app-router-files
    title: App Router Files
    source: references/app-router-files.md
    target: references/app-router-files.md
    required: true
    trigger: Read this when you need compact App Router file conventions and example route signatures.
  - id: ref-async-patterns
    title: Async Patterns
    source: references/async-patterns.md
    target: references/async-patterns.md
    required: true
    trigger: Read this when handling Next.js 15+ async params, searchParams, cookies(), or headers().
  - id: ref-bundling
    title: Bundling
    source: references/bundling.md
    target: references/bundling.md
    required: true
    trigger: Read this when debugging server-incompatible packages, CSS imports, ESM/CJS issues, bundle analysis, or Turbopack migration.
  - id: ref-data-patterns
    title: Data Patterns
    source: references/data-patterns.md
    target: references/data-patterns.md
    required: true
    trigger: Read this when choosing between Server Components, Server Actions, Route Handlers, or client data fetching.
  - id: ref-debug-tricks
    title: Debug Tricks
    source: references/debug-tricks.md
    target: references/debug-tricks.md
    required: true
    trigger: Read this when using Next.js development MCP debugging or debug build paths.
  - id: ref-directives
    title: Directives
    source: references/directives.md
    target: references/directives.md
    required: true
    trigger: Read this when applying 'use client', 'use server', or 'use cache'.
  - id: ref-error-handling
    title: Error Handling
    source: references/error-handling.md
    target: references/error-handling.md
    required: true
    trigger: Read this when implementing Next.js error boundaries, redirects, not-found behavior, or auth errors.
  - id: ref-file-conventions
    title: File Conventions
    source: references/file-conventions.md
    target: references/file-conventions.md
    required: true
    trigger: Read this when working with project structure, special files, route segments, route groups, parallel routes, intercepting routes, or proxy/middleware files.
  - id: ref-font
    title: Font Optimization
    source: references/font.md
    target: references/font.md
    required: true
    trigger: Read this when configuring next/font, Google fonts, local fonts, Tailwind font variables, subsets, or display behavior.
  - id: ref-functions
    title: Functions
    source: references/functions.md
    target: references/functions.md
    required: true
    trigger: Read this when using navigation hooks, server functions, generate functions, or Next request/response helpers.
  - id: ref-hydration-error
    title: Hydration Errors
    source: references/hydration-error.md
    target: references/hydration-error.md
    required: true
    trigger: Read this when diagnosing hydration mismatch errors.
  - id: ref-image
    title: Image Optimization
    source: references/image.md
    target: references/image.md
    required: true
    trigger: Read this when using next/image, remote image patterns, responsive sizes, blur placeholders, priority loading, or static export.
  - id: ref-metadata
    title: Metadata
    source: references/metadata.md
    target: references/metadata.md
    required: true
    trigger: Read this when implementing metadata, generateMetadata, viewport, OG images, sitemaps, or file-based metadata.
  - id: ref-parallel-routes
    title: Parallel and Intercepting Routes
    source: references/parallel-routes.md
    target: references/parallel-routes.md
    required: true
    trigger: Read this when implementing modal routes, @slot folders, intercepting routes, default.tsx fallbacks, or close behavior.
  - id: ref-route-handlers
    title: Route Handlers
    source: references/route-handlers.md
    target: references/route-handlers.md
    required: true
    trigger: Read this when implementing route.ts handlers, supported methods, dynamic handlers, request helpers, or page.tsx conflicts.
  - id: ref-rsc-boundaries
    title: RSC Boundaries
    source: references/rsc-boundaries.md
    target: references/rsc-boundaries.md
    required: true
    trigger: Read this when checking React Server Component boundaries, async Client Components, serializable props, or Server Action exceptions.
  - id: ref-runtime-selection
    title: Runtime Selection
    source: references/runtime-selection.md
    target: references/runtime-selection.md
    required: true
    trigger: Read this when choosing Node.js or Edge runtime for Next.js code.
  - id: ref-scripts
    title: Scripts
    source: references/scripts.md
    target: references/scripts.md
    required: true
    trigger: Read this when adding next/script, inline scripts, loading strategies, or third-party scripts.
  - id: ref-self-hosting
    title: Self Hosting
    source: references/self-hosting.md
    target: references/self-hosting.md
    required: true
    trigger: Read this when deploying Next.js outside Vercel, using standalone output, Docker, PM2, custom cache handlers, or runtime env config.
  - id: ref-suspense-boundaries
    title: Suspense Boundaries
    source: references/suspense-boundaries.md
    target: references/suspense-boundaries.md
    required: true
    trigger: Read this when useSearchParams, usePathname, or client-only hooks cause CSR bailouts that need Suspense boundaries.

