sections:
  startHere:
    - Classify the request as design, implement, review, debug, or operate and keep work inside that requested mode.
    - Inspect repository authority, installed versions, target environment, data ownership, and trust or authorization boundaries before choosing a Supabase pattern.
    - For version-sensitive Auth, keys, CLI, MCP, Edge Functions, or Realtime behavior, check installed versions and current official Supabase guidance when accessible; otherwise report the freshness gap and avoid an unverified contract claim.
    - Load only the active references whose concrete trigger matches the task.
    - Preserve existing project conventions unless an explicit requirement or verified platform invariant requires a change.
  whenToUse:
    - Building, refactoring, reviewing, or debugging Supabase-backed applications.
    - Designing PostgreSQL schemas, RLS policies, auth flows, storage, realtime, Edge Functions, migrations, performance, observability, or operations workflows.
    - Using Supabase CLI, local development, MCP discovery, or cloud-safe Supabase inspection.
  whenNotToUse:
    - The task has no Supabase, PostgreSQL, RLS, auth, storage, realtime, Edge Function, or Supabase operations surface.
    - The task is purely frontend, framework, or TypeScript work without Supabase-specific behavior.
    - The task is general PostgreSQL tuning, general architecture selection, a formal security audit, or privacy compliance with no Supabase-specific integration decision; route it to the owning specialist.
  workflow:
    - id: stage-establish-task-contract
      title: Establish task contract and authority
      goal: Make the requested outcome, operating mode, authority, side-effect boundary, and evidence bar explicit before acting.
      steps:
        - Identify the requested mode, target environment, downstream consumer, and whether mutations are authorized.
        - Discover repository conventions, installed Supabase and framework versions, migration model, data ownership, and trust or authorization boundaries.
        - "Apply source precedence in this order: explicit user requirements, repository authority, current official platform contracts, then this skill's defaults."
        - Stop on unresolved conflicts that would change data ownership, tenant isolation, authorization, production safety, migration strategy, or external contracts; otherwise record a bounded assumption.
      validation:
        - The task can be completed or handed off without inventing product, architecture, security, privacy, or platform authority.
    - id: stage-deliver-verified-outcome
      title: Deliver and verify the requested outcome
      goal: Produce the smallest complete Supabase result and match evidence to the real boundary being claimed.
      steps:
        - Load the smallest relevant references and verify version-sensitive claims against installed types or help plus current official sources when accessible; if freshness remains uncertain, limit the claim and report the gap.
        - Design, implement, review, debug, or operate only within the authorized mode and side-effect boundary.
        - Verify the direct production-equivalent path where the claim depends on Auth, Data API, RLS, RPC, Storage, Realtime, or Edge Functions; label simulations and missing live checks explicitly.
        - Report status as completed, partial, or blocked with decisions, artifacts, Supabase boundaries, evidence, and remaining risk.
      validation:
        - Structural artifacts, generated files, mocks, and happy-path tests are not treated as proof of a broader runtime or security capability.
        - The final status is no stronger than the available authority and boundary evidence.
  interop:
    - id: interop-architecture
      domain: system topology, service decomposition, deployment model, ASRs, and architecture trade-offs
      winner: architecture-engineer
      rationale: architecture-engineer owns general topology decisions; supabase-engineer supplies Supabase-specific constraints and verifies their integration.
    - id: interop-security-review
      domain: formal vulnerability review, severity, exploitability, and security verdicts
      winner: security-reviewer
      rationale: security-reviewer owns the independent audit; supabase-engineer owns Supabase implementation guidance and remediation inputs.
    - id: interop-framework-language
      domain: framework lifecycle, rendering, middleware or proxy conventions, and language or type-system semantics
      winner: the relevant framework or language skill
      rationale: framework and language skills own their APIs; supabase-engineer owns Supabase client, session, data, and trust-boundary integration.
    - id: interop-postgres
      domain: PostgreSQL query planning, indexing, schema performance, and database configuration
      winner: supabase-postgres-best-practices
      rationale: PostgreSQL guidance owns database performance details; supabase-engineer adds Data API, RLS, Auth, and platform constraints.
    - id: interop-privacy
      domain: GDPR or other privacy-law assessment, legal basis, rights, retention, and compliance verdicts
      winner: gdpr-compliance
      rationale: gdpr-compliance owns regulatory conclusions; supabase-engineer implements accepted data-handling controls without claiming legal compliance.
  commands: []
  gotchas:
    - id: gotcha-rpc-first-evidence
      priority: high
      text: Do not treat memory-store tests, mocked API tests, or direct table reads as evidence for a production Supabase/RLS path that is supposed to be RPC-first.
    - id: gotcha-audit-fail-open
      priority: high
      text: Do not allow domain mutations to succeed when required audit/history evidence is missing, unsafe, or only written outside the transaction.
    - id: gotcha-version-memory
      priority: high
      text: Do not apply remembered Auth, API-key, CLI, MCP, Edge Functions, or Realtime contracts without checking the installed version and, when accessible, current official guidance; report a freshness gap instead of inventing certainty.
    - id: gotcha-substrate-completion
      priority: high
      text: A migration file, policy definition, generated types, mock, or compiler success is substrate; it cannot close a runtime, authorization, reliability, or end-to-end capability claim by itself.
  policies:
    - id: policy-sql-api-design-output
      title: SQL/API design output policy
      text: For Supabase-backed API work, design notes must name tables, RPCs, grants/RLS, service-role exceptions, direct table paths, validation/constraint mapping, audit/history payload profile, and tests before migration application.
    - id: policy-cloud-side-effects
      title: Cloud side-effect policy
      text: Prefer local or isolated development environments. Do not connect MCP to production data; if exceptional read-only inspection is explicitly authorized, require project scoping, read-only mode, minimum tool features, manual review, and no mutating calls. Apply cloud changes through reviewed repository migrations and deployment workflows rather than ad hoc MCP writes.
    - id: policy-stop-and-fallback
      title: Stop and fallback policy
      text: If required authority or real-boundary evidence is unavailable, return a partial or blocked result and name the missing input or next safe check. After two or three failed attempts with the same approach, stop retrying, inspect current documentation and errors, and choose a different bounded diagnostic path.
    - id: policy-output-contract
      title: Output contract
      text: |-
        Report:

        - status: `completed`, `partial`, or `blocked`;
        - requested mode and outcome;
        - authoritative inputs and explicit assumptions;
        - decisions and changed or proposed artifacts;
        - affected Supabase trust, data, API, migration, and environment boundaries;
        - checks run, distinguishing real paths from mocks or static inspection;
        - remaining risks, blockers, and downstream owner when a handoff is required.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory supabase-engineer guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
