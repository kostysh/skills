apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: architecture-engineer
  source-version: 0.1.3
  recommended-skill-md-max-bytes: 26000
  description: >-
    Design or revise software architecture for AI-agent-driven development. Use
    when a PRD, feature, specification, repository change, integration, data
    change, security concern, deployment change, or implementation finding
    requires architectural judgment: architecturally significant requirements,
    system/component pattern selection, boundaries, trade-offs, quality
    scenarios, spikes, ADRs, and architecture-to-specification handoff. This
    skill creates architectural frames and constraints, not implementation task
    backlogs.
  compatibility: >-
    Portable documentation-only skill. It ships artifact templates but no
    runtime; all mandatory architecture guidance lives in this folder.

fragments:
  overview: fragments/overview.md
  finalChecks: fragments/final-checks.md

references:
  - id: ref-methodology
    title: Architecture methodology
    source: references/methodology.md
    target: references/methodology.md
    required: true
    trigger: Read this before medium/high-risk architecture work, ASR extraction, pattern selection, decision records, quality scenarios, spikes, or architecture-to-spec handoff.
  - id: ref-artifact-templates
    title: Artifact templates
    source: references/artifact-templates.md
    target: references/artifact-templates.md
    required: false
    trigger: Read this when producing an architecture check, delta, ASR register, pattern decision, ADR, quality scenario, spike brief, architecture brief, or handoff item/register.
  - id: ref-pattern-catalog
    title: Pattern catalog
    source: references/pattern-catalog.md
    target: references/pattern-catalog.md
    required: false
    trigger: Read this when architecture forces require comparing system, frontend, backend, data, integration, security, privacy, observability, deployment, or delivery-safety patterns.

