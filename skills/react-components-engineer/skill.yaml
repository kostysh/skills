  - id: supporting-implementation-log-20260715-2
    source: docs/logs/implementation-log-20260715-2.md
    target: docs/logs/implementation-log-20260715-2.md
    description: Non-normative remediation and review evidence for the capability audit.
  - id: supporting-docs-readme
