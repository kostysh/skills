apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: react-components-engineer
  source-version: 0.2.0
  recommended-skill-md-max-bytes: 20000
  description: >-
    Build, harden, review, and diagnose reusable React components across SSR,
    hydration, multiple instances, portals, Effects, opaque children, and
    server/client boundaries. Use for component-level runtime resilience; route
    app architecture, styling, test strategy, and security verdicts to their owners.
  compatibility: >-
    Portable documentation-only engineering skill. It ships no runtime or test
    harness and requires repository evidence plus installed React and framework
    versions for project-specific decisions.
fragments:
  overview: fragments/overview.md
references:
  - id: ref-references-bulletproof-patterns
    title: React Component Resilience Patterns
    source: references/bulletproof-patterns.md
    target: references/bulletproof-patterns.md
    required: false
    trigger: Read this when a concrete SSR, hydration, multi-instance, composition, portal, Effect lifecycle, transition, Activity, RSC, sensitive-data, or memoization risk is in scope and exact pattern or version caveats are needed.
assets: []
copies:
  - id: copy-agents-openai
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable UI metadata for react-components-engineer.
supporting:
