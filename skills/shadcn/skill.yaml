sections:
  startHere:
    - Confirm that the task requires shadcn-specific component, registry, preset, configuration, or composition guidance.
    - Identify the project root and acquire current project context before choosing imports, paths, dependencies, or component APIs.
    - Treat Base UI as the current default for new shadcn work and use project-resolved documentation for exact APIs.
    - Load only the active references whose triggers match the task.
    - Define the observable result and the checks that must pass before changing files.
  whenToUse:
    - Initializing or configuring shadcn/ui and components.json.
    - Searching, adding, updating, composing, styling, fixing, or debugging shadcn components and registry items.
    - Inspecting or applying shadcn presets with the current CLI.
  whenNotToUse:
    - The task neither creates nor uses shadcn/ui, components.json, registry items, or shadcn presets.
    - The task is broad visual direction rather than shadcn component composition; use frontend-design.
    - The task is React runtime correctness, application architecture, or framework behavior without a shadcn-specific decision.
    - The user requests a formal code, UX, or accessibility verdict; use the owning review skill and provide shadcn domain input only.
  workflow:
    - id: stage-acquire-context
      title: Acquire authoritative project context
      goal: Establish the project configuration and current component contract without relying on host-specific prompt interpolation.
      steps:
        - Identify the project root from the user's scope, components.json, package.json, and lockfile.
        - Choose the project package runner, then run `shadcn info --json` from the project root when components.json exists.
        - If info fails, inspect components.json and installed component source directly; do not invent aliases, paths, icon libraries, installed components, or framework settings.
        - For a new project, use the current CLI defaults unless the user supplied a preset or other supported configuration.
      validation:
        - Every path, import, package-manager, and component-API decision traces to inspected project context or current official docs.
        - Missing context is represented as blocked or limited before any dependent mutation.
    - id: stage-plan-and-apply
      title: Plan and apply the smallest safe shadcn change
      goal: Reuse installed components and current registry/docs behavior while preserving user-owned source changes.
      steps:
        - Inspect installed components before adding or importing them.
        - Use `shadcn search` and `shadcn docs` for current discovery and API guidance; fetch returned docs or inspect installed source before choosing props.
        - Use `add --dry-run`, `--diff`, or `--view` before updating installed files or accepting third-party registry content.
        - Ask only when a destructive overwrite, ambiguous third-party registry choice, or product/design decision requires user authority.
        - Apply the smallest change that satisfies the request and preserve unrelated local modifications.
      validation:
        - The changed source uses project aliases, configured icons, current component APIs, and the requested registry or preset.
        - No overwrite or broad preset application occurs without explicit authority.
    - id: stage-verify-and-report
      title: Verify behavior and report evidence
      goal: Prove the strongest honest completion claim for the changed project.
      steps:
        - Read every added or changed registry file and resolve incorrect imports, missing dependencies, and composition defects.
        - Run the narrowest relevant project checks such as typecheck, lint, tests, or build.
        - Exercise the changed interaction with an existing browser test or targeted smoke check when the task changes observable UI behavior.
        - Report the context used, commands and files changed, verification evidence, and any blocked or unverified behavior.
      validation:
        - CLI success, generated files, or static examples alone never close an interactive or project-build claim.
        - The final status does not exceed the evidence produced.
  interop:
    - id: interop-visual-design
      domain: Visual hierarchy, art direction, responsive composition, typography, and motion
      winner: frontend-design
      rationale: frontend-design owns presentation decisions; shadcn owns component discovery, installation, and library-specific composition.
    - id: interop-react-runtime
      domain: Reusable React component runtime, effects, hydration, portals, and multi-instance correctness
      winner: react-components-engineer
      rationale: react-components-engineer owns runtime correctness; shadcn supplies component-specific API and source guidance.
    - id: interop-nextjs
      domain: Next.js App Router, RSC transport, directives, routing, caching, and framework configuration
      winner: nextjs
      rationale: nextjs owns framework semantics; shadcn owns the component and registry layer within that framework.
    - id: interop-react-spa
      domain: SPA routing, client data, forms, state, persistence, and application integration
      winner: react-spa-engineer
      rationale: react-spa-engineer owns application-flow integration; shadcn owns the component and registry layer used by that flow.
    - id: interop-typescript
      domain: TypeScript language, compiler diagnostics, tsconfig, and module resolution
      winner: typescript-engineer
      rationale: typescript-engineer owns language and compiler correctness; shadcn owns its generated component contract.
    - id: interop-testing
      domain: Test runner behavior, fixtures, browser-test strategy, determinism, and CI integration
      winner: typescript-test-engineer
      rationale: typescript-test-engineer owns test design; shadcn defines the component behavior that needs evidence.
    - id: interop-ui-review
      domain: Formal UX and accessibility review
      winner: web-ui-reviewer
      rationale: web-ui-reviewer owns the verdict; shadcn provides domain-specific implementation facts and authorized remediation.
    - id: interop-code-review
      domain: Formal code-review findings, severity, merge guidance, and review verdict
      winner: code-reviewer
      rationale: code-reviewer owns the formal verdict; shadcn supplies library-specific evidence and authorized remediation.
  commands: []
  gotchas:
    - id: gotcha-live-contract
      priority: high
      text: "CLI flags and component props change; current project source, command help, and official docs outrank remembered examples."
    - id: gotcha-context-is-not-injected
      priority: high
      text: "Do not claim project context is already injected; acquire it explicitly and represent failure before dependent changes."
    - id: gotcha-registry-output
      priority: high
      text: "Registry installation is not completion evidence; inspect emitted source, aliases, dependencies, and composition before running project checks."
    - id: gotcha-theme-mode
      priority: medium
      text: "Semantic-token guidance depends on components.json; preserve the project's configured theming mode instead of forcing a different one."
  policies:
    - id: policy-source-precedence
      title: Source precedence
      text: "Apply operator constraints first, then repository instructions, inspected project configuration and installed source, current CLI help and official docs, and finally static skill examples. Stop on unresolved equal-authority conflicts."
    - id: policy-base-ui-default
      title: Base UI default
      text: "Use the current Base UI default for new shadcn work and resolve exact component APIs from the target project and current documentation."
    - id: policy-mutation-safety
      title: Mutation safety
      text: "Preview updates and third-party registry content; require explicit approval before overwrite, broad preset application, or replacing customized component source."
    - id: policy-evidence-boundary
      title: Evidence boundary
      text: "Compiler checks prove package structure, CLI output proves only that command, and project checks or interaction evidence prove only the exercised behavior."
  portability:
    required: true
    rules:
      - Do not depend on host-specific prompt interpolation, machine-specific absolute paths, or files outside this skill folder.
      - Keep mandatory shadcn guidance inside this skill folder and use relative links for local resources.
      - Treat network-fetched docs as current authority with installed source and command help as the offline fallback.
    checklist:
      - Regenerate and run the skill-source-compiler lint and check commands.
      - Resolve every local Markdown link in the emitted package.
      - Search the complete skill folder for forbidden terminology and absolute local dependencies.
      - Compile to an isolated directory and confirm the copied skill remains understandable and usable.
