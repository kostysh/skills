apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: shadcn
  source-version: 0.1.2
  recommended-skill-md-max-bytes: 23000
  description: Manages shadcn components and projects with a Base UI-first policy — adding, searching, fixing, debugging, styling, and composing UI. Provides project context, component docs, and usage examples. Applies when working with shadcn/ui, Base UI, basecn, component registries, presets, --preset codes, or any project with a components.json file. Also triggers for "shadcn init", "create an app with --preset", or "switch to --preset".
fragments:
  overview: fragments/overview.md
references:
  - id: ref-references-base-ui-policy
    title: Base UI Policy
    source: references/base-ui-policy.md
    target: references/base-ui-policy.md
    required: true
    trigger: Read this before init, add, update, migration, registry, or component-authoring work where Base UI vs Radix can affect the result.
  - id: ref-references-cli
    title: Cli
    source: references/cli.md
    target: references/cli.md
    required: true
    trigger: Read this when you need Commands, flags, presets, templates.
  - id: ref-references-customization
    title: Customization
    source: references/customization.md
    target: references/customization.md
    required: true
    trigger: Read this when you need Theming, CSS variables, extending components.
  - id: ref-references-rules-base-vs-radix
    title: Base UI API Checks
    source: references/rules/base-vs-radix.md
    target: references/rules/base-vs-radix.md
    required: true
    trigger: Read this when you need Base UI API checks, legacy Radix markers, custom triggers, link buttons, Select, ToggleGroup, Slider, or Accordion.
  - id: ref-references-rules-composition
    title: Composition
    source: references/rules/composition.md
    target: references/rules/composition.md
    required: true
    trigger: Read this when you need Groups, overlays, Card, Tabs, Avatar, Alert, Empty, Toast, Separator, Skeleton, Badge, Button loading.
  - id: ref-references-rules-forms
    title: Forms
    source: references/rules/forms.md
    target: references/rules/forms.md
    required: true
    trigger: Read this when you need FieldGroup, Field, InputGroup, ToggleGroup, FieldSet, validation states.
  - id: ref-references-rules-icons
    title: Icons
    source: references/rules/icons.md
    target: references/rules/icons.md
    required: true
    trigger: Read this when you need data-icon, icon sizing, passing icons as objects.
  - id: ref-references-rules-styling
    title: Styling
    source: references/rules/styling.md
    target: references/rules/styling.md
    required: true
    trigger: Read this when you need Semantic colors, variants, className, spacing, size, truncate, dark mode, cn(), z-index.
assets:
  - id: asset-assets-shadcn-small
    source: assets/shadcn-small.png
    target: assets/shadcn-small.png
    description: "Bundled asset: assets/shadcn-small.png."
  - id: asset-assets-shadcn
    source: assets/shadcn.png
    target: assets/shadcn.png
    description: "Bundled asset: assets/shadcn.png."
copies:
  - id: copy-agents-openai
    source: agents/openai.yml
    target: agents/openai.yml
    description: Portable copy of agents/openai.yml.
  - id: copy-evals-evals
    source: evals/evals.json
    target: evals/evals.json
    description: Portable copy of evals/evals.json.
  - id: copy-mcp
    source: mcp.md
    target: mcp.md
    description: Portable copy of mcp.md.
supporting: []
surfaces:
  active:
    requiredReferences:
      - ref-references-base-ui-policy
      - ref-references-cli
      - ref-references-customization
      - ref-references-rules-base-vs-radix
      - ref-references-rules-composition
      - ref-references-rules-forms
      - ref-references-rules-icons
      - ref-references-rules-styling
    optionalReferences: []
  supportingGlobs:
    - docs/*
sections:
  startHere:
    - Confirm the task matches shadcn's applicability criteria.
    - Treat Base UI as the invariant for all new shadcn UI work unless the user explicitly requests legacy Radix maintenance.
    - Use the preserved overview guidance as the normative workflow for this skill after the Base UI invariant is satisfied.
    - Load only the active references that match the current task.
    - Preserve existing project conventions only when they do not conflict with the Base UI invariant.
  whenToUse:
    - Working with shadcn/ui components, Base UI, basecn, registries, presets, components.json, or shadcn CLI commands.
    - Adding, composing, styling, fixing, debugging, or reviewing shadcn components in a project.
    - Searching or viewing registry items, component docs, examples, presets, or templates.
  whenNotToUse:
    - The project does not use shadcn/ui, components.json, registry items, or shadcn presets.
    - The task is broad visual art direction rather than shadcn component composition; use frontend-design.
    - The task is React architecture or reusable component runtime correctness without shadcn-specific behavior.
  workflow:
    - id: stage-apply-shadcn
      title: Apply Base UI-first shadcn guidance
      goal: Apply shadcn guidance while keeping new UI work on Base UI and routing Radix projects through an explicit legacy or migration decision.
      steps:
        - Match the request to the applicability criteria.
        - Check project context before init, add, update, migration, or component-authoring work; if the project is Radix-based, stop before adding new UI and ask for migration or explicit legacy Radix maintenance.
        - Follow the preserved overview sections for the concrete work.
        - Read the smallest relevant active reference before using detailed guidance from it.
        - Fetch Base UI component docs with `shadcn docs <component> --base base` unless a confirmed Base project context already drives the docs command.
        - Run the relevant verification from the overview or report why it could not be run.
      validation:
        - The outcome follows the preserved skill guidance, the Base UI policy, and any loaded reference constraints.
        - New or changed shadcn UI files do not introduce Radix imports, `radix-ui` imports, `@radix-ui/react-slot`, or `asChild` unless the user explicitly requested legacy Radix work.
  interop: []
  commands: []
  gotchas:
    - id: gotcha-basecn-not-config
      priority: high
      text: "`basecn.dev` is an optional Base UI registry, not a replacement for confirming the project's shadcn `base` configuration."
    - id: gotcha-prose-is-not-base-ui
      priority: high
      text: "Do not satisfy a Base UI request by only changing prose or theme names; verify the project config, docs source, and touched component files."
    - id: gotcha-old-radix-examples
      priority: medium
      text: "Older examples may show Radix `asChild` or package imports; treat them as legacy unless current Base UI docs explicitly require them."
  policies:
    - id: policy-base-ui-invariant
      title: Base UI invariant
      text: "All new shadcn UI work targets Base UI. Radix is allowed only for explicit legacy maintenance or migration work requested by the user."
    - id: policy-base-ui-verification
      title: Base UI verification
      text: "When changing shadcn UI files, verify project context and inspect changed files for Radix imports, `@radix-ui/react-slot`, `from \"radix-ui\"`, and `asChild`; report any intentional legacy exceptions."
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory shadcn guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
