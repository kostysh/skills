skill:
  name: shadcn
  source-version: 0.2.0
  recommended-skill-md-max-bytes: 20000
  description: "Build and maintain shadcn/ui projects with Base UI defaults: inspect components.json, use current CLI/docs, add or update registry components safely, compose and theme them, and verify project behavior. Use for shadcn components, registries, presets, configuration, fixes, or debugging."
