apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: concept-conformance-reviewer
  source-version: 0.2.1
  recommended-skill-md-max-bytes: 20000
  description: >-
    Review feature ideas, backlog items, specifications, plans, acceptance
    criteria, implementations, or closure claims against an established
    product or system concept. Use for design-time or closure-time checks when
    work may deliver scaffolding, APIs, mocks, tests, evidence, or documentation
    while overclaiming an observable capability; when capability and substrate
    must be classified relative to the claimed actor or consumer; or when weak
    acceptance could create false confidence. Do not use as a substitute for
    ordinary specification compliance, code review, security review, or domain
    correctness.
  compatibility: >-
    Portable documentation-only review skill. Use before specification,
    planning, implementation, or closure when concept alignment and real
    capability are more important than local artifact compliance.

fragments:
  overview: fragments/overview.md

references: []
assets: []
copies: []
supporting:
  - id: supporting-docs-readme
    source: docs/README.md
    target: docs/README.md
    description: Non-normative navigation for maintenance material.
  - id: supporting-implementation-log-20260710-1
    source: docs/logs/implementation-log-20260710-1.md
    target: docs/logs/implementation-log-20260710-1.md
    description: Non-normative implementation and verification evidence for the 0.2.0 revision.
  - id: supporting-implementation-log-20260713-1
    source: docs/logs/implementation-log-20260713-1.md
    target: docs/logs/implementation-log-20260713-1.md
    description: Non-normative implementation log for repeated-failure escalation.

surfaces:
  active:
    requiredReferences: []
    optionalReferences: []
  supportingGlobs:
    - docs/*
    - docs/logs/*

sections:
  startHere:
    - Select design-time mode for an idea, backlog item, specification, plan, or proposed acceptance; select closure-time mode for an implementation or completion claim.
    - Identify the review target, the capability being claimed, and the established concept authority before evaluating local acceptance or evidence.
    - Apply source precedence, then return blocked / not assessable without classification or fake-risk when the target or claim is missing, the concept is insufficient, or authority remains unresolved; do not invent the target or concept.
    - Define the claim boundary and actor or consumer before classifying delivered behavior, capability-preserving invariants, enabling substrate, and verification evidence.
    - Test whether acceptance or closure evidence forces the claimed behavior instead of merely proving artifacts exist.
    - Issue the calibrated verdict and route the next correction to the owning authoring, planning, implementation, review, security, or domain skill.
  whenToUse:
    - Reviewing feature ideas, backlog items, specifications, plans, implementation proposals, acceptance criteria, implementations, or closure claims against an established higher-level concept.
    - The work claims a capability for a user, operator, integration, agent, runtime, platform, workflow, product, or system.
    - Acceptance or closure may be satisfied through scaffolding, APIs, mocks, metadata, tests, evidence files, or documentation without proving the claimed behavior.
    - A task is intentionally substrate or capability-preserving work and needs an honest claim boundary, owner capability, and non-misleading closure decision.
  whenNotToUse:
    - The task is a small mechanical change with no capability or concept claim.
    - The user only needs implementation-versus-written-specification compliance; use spec-conformance-reviewer.
    - The user asks for general bugs, maintainability, or merge risk without a higher-level concept claim; use code-reviewer.
    - The user asks for vulnerability discovery, exploitability, or security severity without a concept-alignment question; use security-reviewer.
    - The work is explicitly substrate-only, makes no broader capability claim, and the user is not asking whether it advances or protects a concept.
  workflow:
    - id: stage-establish-review-basis
      title: Establish the review basis
      goal: Select the correct mode and establish enough authority to review without inventing product intent.
      steps:
        - Identify the review target, claimed completion boundary, and whether the request is design-time or closure-time.
        - Identify the authoritative concept source using user-provided or repository-defined source precedence; treat lower-authority disagreement as drift in that source, not as an authority blocker.
        - Record the acceptance criteria available in design-time mode and the current behavioral evidence available in closure-time mode.
        - If the target or claim is missing, the concept source cannot define the claim boundary, or competing sources remain unresolved after precedence because authority is equal or unknown, return blocked / not assessable with decision request authority/evidence and stop before classification or fake-risk.
      validation:
        - The mode, scope, claim, and concept authority are explicit.
        - Lower-authority drift and unresolved equal- or unknown-authority conflict are distinguished explicitly.
        - A blocked review contains no invented target, claim boundary, classification, or fake-risk rating.
    - id: stage-frame-capability
      title: Frame the capability and claim boundary
      goal: Define the behavior at the level and for the actor the work actually claims to serve.
      steps:
        - State the actor or consumer, trigger, observable response, durable state or effect, feedback, and continuity or recovery expectation when applicable.
        - State the exact release, slice, task, implementation, or closure claim being evaluated.
        - Classify outputs relative to that claim as delivered behavior, capability-preserving invariant, enabling substrate, or verification evidence.
        - Identify anti-claims that prevent a narrow task or artifact from implying a broader product or runtime capability.
      validation:
        - Classification is relative to the named actor and claim boundary, not to a fixed list of technologies or artifacts.
        - A public interface can be capability for its direct consumer and substrate for a broader user flow.
        - Honest support work is not rejected merely because it is substrate.
    - id: stage-compare-target
      title: Compare the target to the concept
      goal: Detect concept drift, missing behavior, and misleading completion claims.
      steps:
        - Map each claimed behavior or preserved invariant to the higher-level concept outcome it advances or protects.
        - Separate real behavior from enabling artifacts and separate proof from the behavior it proves.
        - Identify behavior that remains simulated, manually mediated, unintegrated, non-durable, unprotected, or outside the reviewed evidence scope.
        - Check whether local correctness or artifact completeness can coexist with failure of the higher-level capability.
      validation:
        - Every material alignment or drift conclusion points to the concept, reviewed artifact, acceptance, or evidence that supports it.
        - Evidence is not called capability, and substrate is not dismissed when it has an explicit owner capability or invariant.
    - id: stage-test-acceptance-and-evidence
      title: Test acceptance and evidence integrity
      goal: Determine whether the claimed capability is forced at design time or demonstrated at closure time.
      steps:
        - In design-time mode, find the least-real implementation that could satisfy each criterion and propose behavior-level replacements for exploitable criteria.
        - In closure-time mode, trace the claimed actor, entry point, behavior, state or effect, feedback, and continuity through current production-shaped evidence.
        - Treat mocks, snapshots, schemas, routes, files, tests, logs, and screenshots according to what they prove; none proves a broader runtime claim by existence alone.
        - Record missing, stale, intercepted, simulated, partial, or out-of-scope evidence as an evidence gap rather than assuming success.
      validation:
        - Design-time conclusions do not claim that unimplemented behavior already exists.
        - Closure-time completion is not granted from planned acceptance or stale evidence.
        - Each exploitable criterion or evidence gap states the observable proof needed to close it.
    - id: stage-issue-verdict
      title: Issue the concept-conformance verdict
      goal: Produce a deterministic decision that prevents false confidence without overreaching into another skill's ownership.
      steps:
        - Set assessment status to assessable, limited, or blocked; use blocked / not assessable only when a required input is missing or insufficient, or authority remains unresolved after precedence.
        - For assessable or limited reviews, assign low, medium, or high fake-risk using the calibrated definitions in the output contract.
        - "Set one mode outcome: design-ready, invariant-ready, substrate-ready, claim-not-ready, capability-demonstrated, invariant-demonstrated, substrate-demonstrated, claim-not-demonstrated, or blocked, using the claim- and mode-specific rules in the output contract."
        - Choose exactly one primary decision from proceed, proceed as substrate, rewrite, split, downscope, reject, or request authority/evidence.
        - Name the next owner and needed artifact or decision; for the same or a materially related blocker surviving remediation, require root-cause analysis before more fixes. Do not rewrite product scope, architecture, backlog, specification, code, or security findings.
      validation:
        - The assessment status, mode outcome, risk, decision, evidence gaps, and next owner are mutually consistent.
        - Capability and invariant ready or demonstrated outcomes require assessable + low + proceed; substrate outcomes require assessable + low + proceed as substrate; closure-time outcomes also require current boundary evidence.
        - The final answer contains the fields required by the output contract for its assessment status.
  interop:
    - id: interop-prd
      domain: product intent, users, scope, success metrics, non-goals, and product acceptance
      winner: prd-engineer
      rationale: This skill identifies concept drift or false acceptance; prd-engineer owns product-source revisions.
    - id: interop-architecture
      domain: architecture-significant requirements, boundaries, patterns, trade-offs, and ADRs
      winner: architecture-engineer
      rationale: This skill may detect an unsupported claim; architecture-engineer owns decisions and handoff.
    - id: interop-delivery
      domain: vertical slices, module increments, task decomposition, dependencies, and sequencing
      winner: delivery-planner
      rationale: This skill identifies misleading task boundaries; delivery-planner owns decomposition and sequencing.
    - id: interop-spec
      domain: implementation-ready behavior, atomic requirements, acceptance criteria, falsifiers, and verification maps
      winner: spec-engineer
      rationale: This skill identifies defective requirements; spec-engineer owns specification revisions.
    - id: interop-implementation-discipline
      domain: implementation discipline
      winner: implementation-discipline
      rationale: After concept alignment, implementation-discipline owns changes, verification, and reporting.
    - id: interop-spec-conformance
      domain: written specification compliance
      winner: spec-conformance-reviewer
      rationale: It owns normative compliance; this skill owns higher-level concept alignment.
    - id: interop-code-review
      domain: general code defects, regressions, maintainability, and merge risk
      winner: code-reviewer
      rationale: It owns non-concept defects and merge-risk reporting.
    - id: interop-security-review
      domain: threat modeling, exploitability, vulnerability confidence, and security severity
      winner: security-reviewer
      rationale: This skill may expose a gap; security-reviewer owns vulnerability validation and classification.
    - id: interop-domain-skills
      domain: technical feasibility and domain semantics
      winner: the relevant domain skill
      rationale: Domain skills own specialized technical facts.
  commands: []
  gotchas:
    - id: gotcha-claim-relative-classification
      priority: high
      text: Do not mechanically label APIs, schemas, queues, documentation, or tools as substrate without first naming the actor and claim boundary.
    - id: gotcha-spec-can-be-the-bug
      priority: high
      text: An implementation can conform to a defective specification and still fail the concept; route the specification repair without confusing concept review with conformance review.
    - id: gotcha-planned-is-not-proven
      priority: high
      text: Design-time acceptance can make future capability falsifiable, but it cannot prove that the capability already exists.
  policies:
    - id: policy-capability-first
      title: Capability-first policy
      text: Judge completion by behavior at the declared actor and boundary, not artifact volume.
    - id: policy-source-authority
      title: Review basis and concept authority policy
      text: Require a review target, capability claim, and concept source sufficient to define the claim boundary. Apply supplied or repository-defined precedence first; lower-authority disagreement is drift, while a missing or insufficient input or an unresolved equal- or unknown-authority conflict requires blocked / not assessable without classification or fake-risk.
    - id: policy-claim-relative-classification
      title: Claim-relative classification policy
      text: Classify delivered behavior, capability-preserving invariants, enabling substrate, and verification evidence relative to the named actor and claim boundary. The same artifact may be capability at one boundary and substrate at another.
    - id: policy-honest-substrate
      title: Honest substrate policy
      text: Substrate may proceed when its claim is limited, its owner capability or invariant is named, and acceptance does not imply broader completion.
    - id: policy-evidence-integrity
      title: Evidence integrity policy
      text: Closure requires current boundary evidence; record simulated, intercepted, stale, partial, or unreviewed paths as gaps.
    - id: policy-anti-claims
      title: Anti-claims policy
      text: Every non-trivial review must state the important behavior that remains unavailable, simulated, manually mediated, outside scope, or only weakly evidenced.
    - id: policy-acceptance-integrity
      title: Acceptance integrity policy
      text: Acceptance passing without claimed capability is defective; route behavior-level proof to spec-engineer.
    - id: policy-output-completeness
      title: Output completeness policy
      text: For blocked reviews return only attempted mode, blocked status and outcome, missing, insufficient, or unresolved input, decision request authority/evidence, and next owner or artifact. Otherwise return mode, status, outcome, concept source, claim, classification, exploitable criteria or evidence gaps, anti-claims, fake-risk, decision, and next owner or artifact.
  portability:
    required: true
    rules:
      - Do not reference machine-specific paths or external repository state.
      - Keep all mandatory concept-conformance-reviewer guidance inside this skill folder.
      - Use this skill as a review discipline; it does not prescribe framework-specific implementation or replace owning authoring, planning, review, security, or domain skills.
    checklist:
      - Confirm the generated description triggers both design-time and closure-time concept review without absorbing ordinary conformance, code, or security review.
      - Confirm input authority, blocked behavior, claim-relative classification, verdict calibration, output contract, and interop ownership are present and consistent.
      - Confirm the generated skill contains no placeholder commands, runtime, references, metrics, or configuration surfaces.
      - Confirm all supporting material remains non-normative and no absolute paths appear in the emitted skill.
