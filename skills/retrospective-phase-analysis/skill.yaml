    - "Resolve the session id and candidate project root before broad artifact reading."
    - "Use trace-driven scoping, phase boundaries, and evidence-source data-quality limits before drawing conclusions."
    - "Separate agent-context factors from data-quality limits; `compacted` is not evidence loss when raw trace is available and parsed."
    - "When using the CLI, run the first scan and reuse its reported run directory for follow-up reports."
  whenToUse:
    - "A completed implementation, review, closure, or agent-execution phase already has evidence artifacts."
    - "The operator asks for a retrospective, postmortem, phase review, skill audit, or logging improvement analysis."
    - "You need evidence-backed reports about incidents, time sinks, process weaknesses, skill friction, or logging gaps."
  whenNotToUse:
    - "The task is forward-looking planning before retrospective evidence exists."
    - "The task is ordinary code review of a diff or pull request."
    - "The request asks for process opinions without traces, logs, artifacts, or another reliable evidence source."
  workflow:
    - id: "stage-scope-evidence"
      title: "Scope evidence"
      goal: "Bound the retrospective before scanning or reading broadly."
      steps:
        - "Resolve the session id and canonical trace using the preserved resolution order."
        - "Read session_meta.cwd or an operator-provided root to establish the candidate project root."
        - "Set the phase boundary and include only trace-linked evidence unless a justified manual override is provided."
      validation:
        - "The report can state included sessions, excluded follow-up work, data-quality limits, and material agent-context factors."
        - "No repo-wide reading substitutes for trace-driven scope discovery."
    - id: "stage-produce-reports"
      title: "Produce retrospective reports"
      goal: "Create evidence-backed Markdown reports and validate CLI scaffolds before treating them as final."
      steps:
        - "Build the evidence manifest, execution timeline, incident register, skill audit, stage analysis, time-sink analysis, and logging review."
        - "Generate or write the main retrospective report plus skill-audit and logging-review outputs when material."
        - "Validate every generated scaffold against cited evidence and operator language requirements."
      validation:
        - "Facts, inferred causes, confidence limits, and recommendations are separated."
        - "Logging recommendations check existing canonical artifacts, workflow sequencing, and prompt recipes before proposing schema changes."
        - "Generated draft status is resolved or explicitly documented before final delivery."
  interop:
    - id: "interop-retrospective-method"
      domain: "retrospective method and report structure"
      winner: "retrospective-phase-analysis"
      rationale: "This skill owns evidence hierarchy, incident classification, stage weakness analysis, skill-friction analysis, logging-gap analysis, and final report structure."
    - id: "interop-cli-tests"
      domain: "CLI authoring and test coverage"
      winner: "cli-engineer and typescript-test-engineer"
      rationale: "Use those skills for packaged CLI maintenance and regression testing, while this skill owns retrospective semantics."
  commands:
    - id: "command-scan"
      command: "scan"
      summary: "Build a JSON evidence summary from a session trace and linked stage logs."
      when: "You need the first canonical retrospective bundle and trace-derived scope."
      script: "scripts/retro-cli.mjs"
      inputs:
        - "--session <file>"
        - "--language <language>"
        - "Optional --until-line <n>, --until-ts <iso>, --out-root <dir>, --run-dir <dir>, or controlled manual artifact overrides."
      outputs:
        - "scan-summary.json in the canonical run directory."
        - "The canonical run_dir printed on stdout."
      examples:
        - "node scripts/retro-cli.mjs scan --session <file> --language <language>"
    - id: "command-report"
      command: "report"
      summary: "Generate a Markdown retrospective draft in an existing run directory."
      when: "A scan summary exists and the main retrospective scaffold is needed."
      script: "scripts/retro-cli.mjs"
      inputs:
        - "--run-dir <run_dir>"
      outputs:
        - "retrospective-report.md in the run directory."
      examples:
        - "node scripts/retro-cli.mjs report --run-dir <run_dir>"
    - id: "command-logging-review"
      command: "logging-review"
      summary: "Generate a logging-quality and improvement draft."
      when: "The retrospective needs a dedicated logging gap analysis."
      script: "scripts/retro-cli.mjs"
      inputs:
        - "--run-dir <run_dir>"
      outputs:
        - "logging-review.md in the run directory."
      examples:
        - "node scripts/retro-cli.mjs logging-review --run-dir <run_dir>"
    - id: "command-problem-matrix"
      command: "problem-matrix"
      summary: "Generate a skill/process problem matrix draft."
      when: "Reusable skill or process problems should be grouped by owning skill."
      script: "scripts/retro-cli.mjs"
      inputs:
        - "--run-dir <run_dir>"
      outputs:
        - "problem-matrix-by-skill.md in the run directory."
      examples:
        - "node scripts/retro-cli.mjs problem-matrix --run-dir <run_dir>"
    - id: "command-skill-audit"
      command: "skill-audit"
      summary: "Generate a skill-focused retrospective draft."
      when: "Skill usage, skill friction, or skill-instruction problems are material to the phase."
      script: "scripts/retro-cli.mjs"
      inputs:
        - "--run-dir <run_dir>"
      outputs:
        - "skill-audit.md in the run directory."
      examples:
        - "node scripts/retro-cli.mjs skill-audit --run-dir <run_dir>"
    - id: "command-validate"
      command: "validate"
      summary: "Record completed agent validation metadata for a run."
      when: "The agent has validated generated scaffolds against the cited evidence."
      script: "scripts/retro-cli.mjs"
      inputs:
        - "--run-dir <run_dir>"
        - "--validated-scope <text>"
        - "--residual-confidence <high|medium|low>"
        - "--validation-notes <text>"
      outputs:
        - "Updated validation metadata in scan-summary.json."
      examples:
        - "node scripts/retro-cli.mjs validate --run-dir <run_dir> --validated-scope <text> --residual-confidence medium --validation-notes <text>"
  gotchas: []
  policies: []
  portability:
    required: true
    rules:
      - "Do not reference machine-specific absolute paths or local files outside this skill folder."
      - "Keep all mandatory retrospective-phase-analysis guidance inside this skill folder."
      - "Use relative links for local references, assets, scripts, tests, and supporting docs."
    checklist:
      - "Run the skill-source-compiler check command after regeneration."
      - "Search the skill folder for absolute local paths before finishing."
      - "Confirm every required reference listed by SKILL.md exists inside this skill folder."
