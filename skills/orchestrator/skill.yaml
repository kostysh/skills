apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: orchestrator
  source-version: 0.1.3
  description: Coordinate agents working toward one requested outcome. Use when delegating work, managing dependencies between assignments, or combining agent handoffs. Leave standalone tasks and delivery planning to their usual owners.
surfaces:
  active: {}
sections:
  startHere:
    - Start your first proposal to the owner with the direct path to the final action. For existing work, show how today's operation could run under the requested conditions, who already has the necessary access and whose consent is needed, if any.
    - Confirm what is authorized and how to check the outcome. You own the combined result.
    - Apply the project's development method, if any, to your plan and each assignment.
  whenToUse:
    - Work needs separate contributors or an independent check, or you are taking over existing agent assignments.
  whenNotToUse:
    - Handle a small self-contained task directly. A request for a plan alone belongs with the planner.
  workflow:
    - id: assign
      title: Assign ready work
      goal: Before assigning work that grants or expands access or introduces a role, tool or procedure, identify the step the direct path cannot complete or the agreed guarantee it would lose. If another proposed step creates that need, question that step first. Split work where a separate contribution helps.
      steps:
        - Identify what each assignment consumes and produces. Start independent assignments together when useful. Hold dependent work until its input is agreed, then give consumers the same version. Assign one writer per shared output and sequence overlapping changes.
        - Give each agent its deliverable, inputs, allowed actions and evidence to return. Assign each check to one owner. Share only relevant guidance. Keep a required reviewer independent of the author.
        - In every assignment, including to a separate session, tell the agent to direct all task communication to you, including questions, blockers and results. Give it an authorized channel or name a shared handoff you will read. Answer what you can. Ask the operator yourself when their input is needed, then relay the answer.
        - Track owners, input versions and handoffs in the conversation or existing project record. Continue ready work and wait only for a blocking result or decision. Use a stable handoff as soon as its required checks pass, even if its author is still running.
    - id: reconcile
      title: Reconcile the results
      goal: Check the assembled work against the original request.
      steps:
        - On a changed input, notify affected owners, reopen stale results and resume them on the agreed version. Keep unrelated work moving. Before reassigning interrupted work, check what the first owner already did and whether they can still write.
        - Revisit inherited steps when their purpose changes. Keep each action with its authorized owner and preserve any independent check it still needs. Weigh an addition's benefit against setup, upkeep and recovery. Return unnecessary complexity to its author with the simpler route to try. A direct solution needs no alternatives report.
        - Accept checks that cover the current result. Before repeating one, identify the changed input, gap in coverage or independence requirement that justifies it. Test only what remains, including interactions between parts. If blocked, the owner changes approach or hands off the gap and the blocker.
  portability:
    required: true
    rules:
      - Use the available agent and messaging facilities within existing permissions. If delegation is unavailable, do the authorized work directly and leave any required independent decision with its owner.
    checklist:
      - Give the requester the combined result, the evidence that supports it, and any open dependency or decision with its owner. Respect the requested stopping point.
