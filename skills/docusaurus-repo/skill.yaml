    target: assets/project-files/.github/workflows/docs-quality.yml
    description: "Bundled asset: assets/project-files/.github/workflows/docs-quality.yml."
  - id: asset-assets-project-files-markdownlint-cli2
    source: assets/project-files/.markdownlint-cli2.jsonc
    target: assets/project-files/.markdownlint-cli2.jsonc
    description: "Bundled asset: assets/project-files/.markdownlint-cli2.jsonc."
  - id: asset-assets-project-files
    source: assets/project-files/.prettierignore
    target: assets/project-files/.prettierignore
    description: "Bundled asset: assets/project-files/.prettierignore."
  - id: asset-assets-project-files-prettierrc
    source: assets/project-files/.prettierrc.json
    target: assets/project-files/.prettierrc.json
    description: "Bundled asset: assets/project-files/.prettierrc.json."
  - id: asset-assets-project-files-agents
    source: assets/project-files/AGENTS.md
    target: assets/project-files/AGENTS.md
    description: "Bundled asset: assets/project-files/AGENTS.md."
copies:
