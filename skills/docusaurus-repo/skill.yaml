apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: docusaurus-repo
  source-version: 0.1.1
  recommended-skill-md-max-bytes: 20000
  description: |-
    Create and manage a documentation repository built on Docusaurus. Use for repository
    bootstrap, pnpm tooling, AGENTS.md, GitHub workflows, docs-only or hybrid docs/blog
    sites, config, sidebars, MDX authoring, theme and UI customization, search,
    versioning, i18n, deployment, and common ecosystem plugins such as Mermaid or
    OpenAPI docs.
  metadata:
    author: skills-etc
    version: 1.0.0
fragments:
  overview: fragments/overview.md
references:
  - id: ref-references-bootstrap-and-structure
    title: Bootstrap And Structure
    source: references/bootstrap-and-structure.md
    target: references/bootstrap-and-structure.md
    required: true
    trigger: Read this when you need Bootstrap, project shape, and monorepo setup.
  - id: ref-references-config-presets-and-routing
    title: Config Presets And Routing
    source: references/config-presets-and-routing.md
    target: references/config-presets-and-routing.md
    required: true
    trigger: Read this when you need Config, presets, plugins, routing, and multi-instance docs.
  - id: ref-references-content-authoring
    title: Content Authoring
    source: references/content-authoring.md
    target: references/content-authoring.md
    required: true
    trigger: Read this when you need Authoring docs, sidebars, MDX, Mermaid, and live code blocks.
  - id: ref-references-customization-and-ux
    title: Customization And Ux
    source: references/customization-and-ux.md
    target: references/customization-and-ux.md
    required: true
    trigger: Read this when you need UI, UX, theme config, CSS, pages, and swizzling.
  - id: ref-references-deployment-versioning-i18n
    title: Deployment Versioning I18n
    source: references/deployment-versioning-i18n.md
    target: references/deployment-versioning-i18n.md
    required: true
    trigger: Read this when you need Deployment, versioning, and i18n.
  - id: ref-references-doc-quality-tooling-and-agents
    title: Doc Quality Tooling And Agents
    source: references/doc-quality-tooling-and-agents.md
    target: references/doc-quality-tooling-and-agents.md
    required: true
    trigger: Read this when you need Mandatory Prettier, markdownlint-cli2, AGENTS, and GitHub workflow bootstrap.
  - id: ref-references-search-and-ecosystem
    title: Search And Ecosystem
    source: references/search-and-ecosystem.md
    target: references/search-and-ecosystem.md
    required: true
    trigger: Read this when you need Search, local search, Typesense, Ask AI, and API docs plugins.
