    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.
supporting: []
surfaces:
  active:
    requiredReferences:
      - ref-references-bootstrap-and-structure
      - ref-references-config-presets-and-routing
      - ref-references-content-authoring
      - ref-references-customization-and-ux
      - ref-references-deployment-versioning-i18n
      - ref-references-doc-quality-tooling-and-agents
      - ref-references-search-and-ecosystem
    optionalReferences: []
  supportingGlobs:
    - docs/*
sections:
  startHere:
    - Confirm the task matches docusaurus-repo's applicability criteria.
    - Use the preserved overview guidance as the normative workflow for this skill.
    - Load only the active references that match the current task.
    - Preserve existing project conventions unless the overview explicitly requires a stricter invariant.
  whenToUse:
    - New Docusaurus documentation repository or migration of an existing docs repo to Docusaurus
    - Docs-only, docs + blog/changelog, or docs + landing page
    - Versioned docs, multi-instance docs, i18n, search, API reference docs
    - Repository bootstrap, pnpm scripts, doc-quality tooling, AGENTS.md, GitHub workflows
    - Custom theme work, navbar/footer/search UX, MDX components, swizzling
  whenNotToUse:
    - General-purpose marketing site with little documentation
    - Pure content rewriting without site architecture work
    - Non-Docusaurus stacks like VitePress, Starlight, MkDocs, Astro, or a Next.js app
  workflow:
    - id: stage-apply-docusaurus-repo
      title: Apply docusaurus-repo guidance
      goal: Apply the preserved docusaurus-repo guidance without changing its domain behavior.
      steps:
        - Match the request to the applicability criteria.
        - Follow the preserved overview sections for the concrete work.
        - Read the smallest relevant active reference before using detailed guidance from it.
        - Run the relevant verification from the overview or report why it could not be run.
      validation:
        - The outcome follows the preserved skill guidance and any loaded reference constraints.
  interop: []
  commands: []
  gotchas: []
  policies: []
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory docusaurus-repo guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
