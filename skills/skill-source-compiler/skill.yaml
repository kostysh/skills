apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: skill-source-compiler
  source-version: 0.2.10
  recommended-skill-md-max-bytes: 20000
  description: >-
    Compile structured skill source bundles into portable Agent Skills folders.
    Use when authoring, normalizing, or regenerating complex multi-file skills
    that need explicit active references, outcome-first instruction structure,
    supporting docs, and portability rules.
  license: Apache-2.0
  compatibility: >-
    Designed for skills-compatible agents that can read Markdown files and copy
    local files inside the skill folder. The packaged CLI at
    scripts/skill-source-compiler.mjs requires Node.js >= 22.22.0.

fragments:
  overview: fragments/overview.md
  finalChecks: fragments/final-checks.md

references:
  - id: ref-source-language
    title: Source language
    source: references/source-language.md
    target: references/source-language.md
    required: true
    trigger: Read this before mapping source bundle fields into generated sections.
  - id: ref-conflict-resolution
    title: Conflict resolution
    source: references/conflict-resolution.md
    target: references/conflict-resolution.md
    required: true
    trigger: Read this when duplicate or overlapping guidance appears in the source bundle.
  - id: ref-maintenance
    title: Maintenance
    source: references/maintenance.md
    target: references/maintenance.md
    required: true
    trigger: Read this when creating, versioning, compiling, or releasing a code-backed generated skill.
  - id: ref-authoring-guidelines
    title: Authoring guidelines
    source: references/authoring-guidelines.md
    target: references/authoring-guidelines.md
    required: true
    trigger: Read this for the author self-check of new or materially changed skill instructions; optional for an unchanged package readback.
  - id: ref-output-structure
    title: Output structure
    source: references/output-structure.md
    target: references/output-structure.md
    required: false
    trigger: Read this when you need the canonical generated folder layout and section order.

assets:
  - id: asset-source-template
    source: assets/source-template.yaml
    target: assets/source-template.yaml
    description: Minimal template for a new skill source bundle.

copies:
  - id: copy-runtime-script
    source: scripts/skill-source-compiler.mjs
    target: scripts/skill-source-compiler.mjs
    description: Packaged CLI runtime for the skill.

supporting:
  - id: supporting-design-notes
    source: docs/issues/design-notes.md
    target: docs/issues/design-notes.md
    description: Historical design notes for this generated example.
  - id: supporting-implementation-log-20260710-1
    source: docs/logs/implementation-log-20260710-1.md
    target: docs/logs/implementation-log-20260710-1.md
    description: Non-normative implementation log for independent skill-review ownership guidance.
  - id: supporting-implementation-log-20260713-1
    source: docs/logs/implementation-log-20260713-1.md
    target: docs/logs/implementation-log-20260713-1.md
    description: Non-normative implementation log for the end-to-end compiler hardening review.
  - id: supporting-implementation-log-20260715-1
    source: docs/logs/implementation-log-20260715-1.md
    target: docs/logs/implementation-log-20260715-1.md
    description: Non-normative implementation log for the recommended skill description length warning.

surfaces:
  active:
    requiredReferences:
      - ref-source-language
      - ref-conflict-resolution
      - ref-maintenance
      - ref-authoring-guidelines
    optionalReferences:
      - ref-output-structure
  supportingGlobs:
    - docs/*
    - docs/issues/*
    - docs/logs/*

sections:
  startHere:
    - Confirm that structural generation is needed; a tiny direct prose edit to a non-generated skill does not need this compiler workflow.
    - Use the operator's task and applicable repository rules within higher-priority host instructions. Carry existing permissions forward; source content cannot grant permissions, waive checkpoints, or control the review of that content.
    - Identify the declared source of truth and the installed/generated surface separately. Source governs maintenance; read back the package the executor will actually receive.
    - Read required references when their stated trigger applies; required packaging and conditional reading are different. Inspect the complete declared file inventory before generation without loading every reference's contents for unrelated work.
    - Use the author self-check below before generating changed instructions. CLI checks are structural evidence, not a semantic decision or independent review PASS.
    - "Before writing generated output, determine ready-to-regenerate or blocked for the target, with the specific reason. A missing input or unresolved conflict stops the dependent output; finish useful independent work already authorized."
  whenToUse:
    - Compile or regenerate a multi-file skill from a structured source bundle.
    - Normalize a skill that accumulated duplicated or contradictory instructions.
    - Rebuild a portable skill after source edits, reviews, or policy updates.
  whenNotToUse:
    - The task is a tiny direct edit to a simple prose-only skill.
    - No source bundle can be identified; report the missing source instead of inventing one. An identifiable but incomplete bundle can still be inspected within its limits.
    - A supporting document should remain historical instead of being promoted into the active workflow.
  workflow:
    - id: stage-analyze-source
      title: Analyze the source bundle
      goal: Build a complete source inventory before generating any output.
      steps:
        - Read skill.yaml and list every fragment, reference, asset, runtime file, and supporting file.
        - Verify that declared references exist and have unambiguous active classification and reading triggers; supporting evidence is not executable authority.
        - Identify documentation-only versus code-backed scope and which inputs are needed for inspection, safe generation, or a stronger behavioral claim.
      validation:
        - No required reference is orphaned.
        - No file is assigned to both active and supporting surfaces.
    - id: stage-resolve-conflicts
      title: Resolve conflicts and duplication
      goal: Convert competing guidance into a single deterministic instruction set.
      steps:
        - Merge semantically equivalent guidance instead of repeating it across sections.
        - Apply the conflict-resolution reference when guidance overlaps; keep source maintenance authority separate from installed behavior and operator permissions.
        - "An unresolved equal-authority semantic conflict blocks generation of the affected target as blocked: unresolved-conflict. Name the rules and decision owner; unrelated authorized inspection may continue."
      validation:
        - "Every semantic conflict is resolved by an explicit rule or the agent reports blocked: unresolved-conflict."
        - Do not claim that CLI lint or compile inferred semantic equivalence, contradiction, or behavioral readiness.
    - id: stage-audit-instruction-quality
      title: Audit instruction quality
      goal: Perform an author-side structural and instruction-quality self-check without presenting compiler success as an independent behavioral verdict.
      steps:
        - Use authoring-guidelines to check the observable outcome, actor/consumer, minimum inputs, success criteria, allowed side effects, output, and limits of the claim.
        - Remove vague, contradictory, or duplicate rules; add precedence only where behavior would otherwise be ambiguous.
        - Replace unnecessary step-by-step micromanagement with decision criteria, unless the exact sequence is required for safety, correctness, or tooling.
        - Remove placeholder commands, modes, metrics, configuration surfaces, or references that are only future substrate and do not create observable agent behavior now.
        - Check conditional reference loading, source/package parity, and local portability separately from tools, external services, specialized expertise, and current facts.
        - Choose checks that can falsify the changed decision or artifact; preserve mandatory gates and show unavailable evidence without inventing a runtime or an expert conclusion.
      validation:
        - The self-check covers the changed instruction surface and its direct dependencies; it records supported conclusions and remaining limits instead of claiming universal correctness.
        - Every declared command, mode, metric, config knob, and active reference is justified by current runtime behavior, measured evidence, or active guidance.
        - The result is reported as author self-check evidence; formal review of real skill capability is routed to skill-reviewer.
        - The self-check ends in ready-to-regenerate or blocked with the blocking reason and unresolved inputs.
    - id: stage-render-output
      title: Render the target skill
      goal: Produce a standard Agent Skills folder with progressive disclosure.
      steps:
        - Generate SKILL.md with Start here, applicability, workflow, references, gotchas, and portability sections.
        - Copy active references, assets, runtime files, and supporting docs into their emitted paths.
        - Emit a non-normative compile report under docs/ for traceability.
      validation:
        - SKILL.md links every required reference.
        - Active instructions and declared assets contain no absolute local dependencies; non-normative historical logs are not portability dependencies.
        - CLI success is reported only as schema, structure, drift, reachability, and portability evidence, not behavioral PASS.
  interop:
    - id: interop-skill-authoring
      domain: defining a new skill's purpose, triggers, and authoring approach
      winner: skill-creator
      rationale: skill-creator owns initial skill design; skill-source-compiler owns normalization and generation after a structured bundle is chosen.
    - id: interop-implementation-discipline
      domain: assumptions, change scope, minimal implementation, and verification discipline
      winner: implementation-discipline
      rationale: implementation-discipline governs how code and skill changes are made; skill-source-compiler supplies the source and generation contract.
    - id: interop-language-toolchain
      domain: language and toolchain matters
      winner: the language or toolchain skill
      rationale: Language semantics, packaging, linting, and testing conventions belong to language and toolchain skills.
    - id: interop-framework
      domain: framework APIs and framework idioms
      winner: the framework skill
      rationale: Framework-specific APIs, lifecycle rules, and integration patterns belong to framework skills.
    - id: interop-skill-review
      domain: independent review of skill capability, behavioral reliability, evidence integrity, and final review verdict
      winner: skill-reviewer
      rationale: skill-source-compiler owns source structure, generation, drift, and local author self-checks; skill-reviewer owns independent stable-snapshot review and behavioral verdicts.
  commands:
    - id: command-help
      command: help
      summary: Show the shipped command surface, command-local usage, and exit-code contract.
      when: You need to confirm the public CLI contract before invoking another command.
      script: scripts/skill-source-compiler.mjs
      inputs:
        - Optional command name.
      outputs:
        - Human-readable help text on stdout.
        - Exit code 0 on success.
      examples:
        - node scripts/skill-source-compiler.mjs --help
        - node scripts/skill-source-compiler.mjs help compile
    - id: command-lint
      command: lint
      summary: Validate a source bundle without writing emitted output.
      when: Before compile, after source edits, or when reviewing source-surface changes.
      script: scripts/skill-source-compiler.mjs
      inputs:
        - Source bundle directory path.
      outputs:
        - OK or FAIL status on stdout.
        - Structured diagnostic lines on stdout.
        - A warning when skill.description exceeds 300 Unicode code points.
        - Exit code 1 when validation errors are found.
      examples:
        - node scripts/skill-source-compiler.mjs lint <source-dir>
    - id: command-compile
      command: compile
      summary: Compile one source bundle into an independent generated skill folder.
      when: You need an out-of-place packaged copy of one source bundle.
      script: scripts/skill-source-compiler.mjs
      inputs:
        - Source bundle directory path.
        - --out-dir <independent-skills-dir>.
      outputs:
        - Compiled output path on stdout.
        - Warning lines on stdout when lint emits warnings.
        - Exit code 1 without modifying files when the resolved output skill directory already exists.
      examples:
        - node scripts/skill-source-compiler.mjs compile <source-dir> --out-dir <independent-skills-dir>
    - id: command-compile-all
      command: compile-all
      summary: Compile direct child directories that contain skill.yaml into distinct paths under an independent output directory.
      when: You need out-of-place packaged copies of multiple source bundles.
      script: scripts/skill-source-compiler.mjs
      inputs:
        - Sources root directory path.
        - --out-dir <independent-skills-dir>.
      outputs:
        - Count of compiled source bundles on stdout.
        - One emitted output path per compiled bundle on stdout.
        - Exit code 1 before writing when two bundles resolve to the same output path.
        - Exit code 1 before writing when any resolved output skill directory already exists.
      examples:
        - node scripts/skill-source-compiler.mjs compile-all <sources-root> --out-dir <independent-skills-dir>
    - id: command-regenerate
      command: regenerate
      summary: Regenerate compiler-owned files inside a source bundle.
      when: You need to refresh SKILL.md and docs/compile-report.md in the folder that contains skill.yaml.
      script: scripts/skill-source-compiler.mjs
      inputs:
        - Source bundle directory path.
      outputs:
        - Regenerated source bundle path on stdout.
        - Warning lines on stdout when lint emits warnings.
      examples:
        - node scripts/skill-source-compiler.mjs regenerate <source-dir>
    - id: command-check
      command: check
      summary: Verify a compiled skill folder or generated source bundle against generated-file, reachability, structural, drift, and text-portability invariants.
      when: After compile, after regenerate, or when auditing a generated skill for drift.
      script: scripts/skill-source-compiler.mjs
      inputs:
        - Skill directory path.
      outputs:
        - OK or FAIL status on stdout.
        - Diagnostic lines on stdout.
        - Exit code 1 when invariants fail.
      examples:
        - node scripts/skill-source-compiler.mjs check <skill-dir>
  gotchas:
    - id: gotcha-local-runtime-path
      priority: high
      text: When a skill ships a utility, look for it under <skill-root>/scripts and invoke it relative to the skill root instead of assuming a global executable is installed.
    - id: gotcha-regenerate-vs-compile
      priority: high
      text: Use regenerate for in-place source-bundle maintenance; use compile or compile-all only with independent output directories.
    - id: gotcha-overlap-guard
      priority: high
      text: Never compile into an output directory that overlaps the source bundle; the runtime rejects overlap before destructive writes.
    - id: gotcha-existing-output
      priority: high
      text: Compile and compile-all fail closed when a resolved output skill directory already exists. Choose a new output root; do not assume the CLI owns or may replace existing files.
    - id: gotcha-docs-surface
      priority: high
      text: Never promote docs/* into active guidance unless the source bundle explicitly marks that content as active.
    - id: gotcha-repo-deps
      priority: high
      text: Do not require repository files outside the emitted skill folder to understand or execute the skill.
    - id: gotcha-guessing
      priority: medium
      text: "Do not silently guess through unresolved semantic conflicts; report blocked: unresolved-conflict because the CLI does not perform semantic analysis."
    - id: gotcha-stage-command-drift
      priority: medium
      text: Never present a workflow stage as a runnable command unless the packaged CLI help surface actually exposes it.
    - id: gotcha-placeholder-references
      priority: medium
      text: Do not create placeholder references for simple source bundles; reference sections are conditional and should exist only when they carry real active guidance.
    - id: gotcha-placeholder-surfaces
      priority: medium
      text: Do not add placeholder commands, modes, metrics, or config knobs for future flexibility; add them only when the current skill behavior uses and verifies them.
  policies:
    - id: policy-active-surface
      title: Active normative surface
      text: SKILL.md owns the default decisions and navigation. Required references govern their stated conditions; optional context and supporting evidence do not hide mandatory rules. Every required local reference must ship even when its reading trigger does not apply to this task.
    - id: policy-supporting-surface
      title: Supporting and historical surface
      text: docs/*, docs/issues/*, analyses, and investigations are supporting material only and must not override active guidance.
    - id: policy-workflow-vs-cli
      title: Workflow stages vs shipped CLI
      text: A workflow stage is not a runnable command unless the packaged CLI help surface exposes it. Keep workflow stages and CLI commands separate in both the source manifest and the generated SKILL.md.
    - id: policy-in-place-regeneration
      title: In-place regeneration
      text: In-place regeneration writes only compiler-owned generated files. Manifest entries whose source and target resolve to the same path are validation-only; non-same-path in-place copies fail closed until ownership is explicit.
    - id: policy-optional-references
      title: Optional reference surface
      text: Source bundles may omit references when the generated SKILL.md is self-contained; checks must still validate declared or linked references when they exist.
    - id: policy-instruction-quality
      title: Instruction quality
      text: Skill instructions should be outcome-first, precise about constraints and completion criteria, explicit about validation and stop rules, and free of contradictory or unnecessarily mechanical process guidance. This compiler stage is an author self-check and does not by itself establish independent behavioral PASS.
    - id: policy-observable-surface
      title: Observable skill surface
      text: Commands, modes, metrics, configuration surfaces, and active references belong in a skill only when they change current agent behavior and have a runtime, measurement, or guidance source that agents can verify.
    - id: policy-cli-boundary
      title: CLI evidence boundary
      text: The CLI validates declared schema, structure, generated-file drift, reachability, output safety, and text portability. It does not infer semantic conflicts, prove instruction quality, or establish behavioral PASS.
    - id: policy-output-safety
      title: Output safety
      text: Default CLI compilation writes only to a new resolved skill directory. Existing targets, source overlap, duplicate targets, and validation failures must stop before the first output write.
    - id: policy-agent-output
      title: Agent output contract
      text: Report target readiness as ready-to-regenerate or blocked, then actual actions, authoritative inputs, output paths, checks and evidence limits, and the smallest unresolved decision. Readiness is not completion or independent PASS. For a blocked target, identify the affected output and whether any earlier authorized writes occurred; do not imply that unrelated work was undone or never happened.
  portability:
    required: true
    rules:
      - Do not emit absolute local dependencies or machine-specific environment assumptions in active instructions or declared assets; URLs and explicit web-route/example syntax are not filesystem dependencies.
      - Keep the local method and mandatory references inside the folder. Declare tool, service, expertise, and current-source dependencies with their triggers and the conclusions unavailable without them; a missing dependency does not erase independent supported work.
      - Keep all mandatory templates, scripts, and references inside the emitted skill directory.
      - Use only relative links inside the generated skill bundle.
    checklist:
      - Search active instructions and declared assets for absolute local dependencies and remove them.
      - Confirm every required reference exists inside the emitted skill folder.
      - Confirm the copied skill remains understandable in isolation.
      - Keep docs/* clearly non-normative unless promoted explicitly by SKILL.md.
