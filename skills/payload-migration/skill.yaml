apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: payload-migration
  source-version: 0.1.2
  recommended-skill-md-max-bytes: 20000
  description: >-
    Migrate WordPress, Contentful, Strapi, Sanity, Webflow or CSV/JSON content into
    Payload. Analyze exports, design schemas, map fields, relations, media, rich
    text and locales; execute authorized imports, recover reruns and reconcile
    results. Use payload for target runtime mechanics.
  compatibility: >-
    Portable documentation-only migration skill. Execution needs the supplied
    source, installed Payload environment and operation authority; no bundled
    importer or universal source CMS converter is claimed.

fragments:
  overview: fragments/overview.md

references:
  - id: ref-payload-field-reference
    title: Payload Field Reference
    source: references/payload-field-reference.md
    target: references/payload-field-reference.md
    required: true
    trigger: Read this when mapping source fields, nested data, arrays, media, rich text, relationships, auth/upload collections, or CMS-specific patterns to Payload field configs.

assets: []
copies:
  - id: copy-agents-openai-yaml
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.
supporting:
  - id: supporting-implementation-log-20260715-1
    source: docs/logs/implementation-log-20260715-1.md
    target: docs/logs/implementation-log-20260715-1.md
    description: Non-normative log for the skill description length update.
  - id: supporting-docs-readme
    source: docs/README.md
    target: docs/README.md
    description: Non-normative navigation for payload-migration skill maintenance records.
  - id: supporting-implementation-log-20260509-1
    source: docs/logs/implementation-log-20260509-1.md
    target: docs/logs/implementation-log-20260509-1.md
    description: Non-normative implementation log for initial payload-migration skill creation.

surfaces:
  active:
    requiredReferences:
      - ref-payload-field-reference
    optionalReferences: []
  supportingGlobs:
    - docs/*
    - docs/logs/*

sections:
  startHere:
    - Establish the requested outcome (analysis, schema, script, import or reconciliation), source/version/format, target environment and existing authority from the conversation and project.
    - Reuse accepted schema, fixed enums, source mapping and execution approvals; do not restart confirmation when they are already supplied.
    - Inspect representative and edge-case source records, the accepted model, installed Payload/editor/adapter packages and declared project commands; missing facts stop only dependent work.
    - Load the field reference when mapping data or choosing target config; retain the source namespace and full expected identity set for execution.
    - Continue through the authorized import, recovery and reconciliation scope; report only the boundary actually exercised.
  whenToUse:
    - Migrating WordPress, Contentful, Strapi, Sanity, Webflow, custom CMS, CSV, JSON, API or database content into Payload.
    - Designing or implementing field mappings, collections/globals, source identity, relationships, media, rich text and locale conversion.
    - Implementing or running authorized imports, recovering interrupted runs, rerunning safely and reconciling migrated data.
  whenNotToUse:
    - General Payload development unrelated to source migration; use payload for target runtime mechanisms.
    - The migration target is not Payload CMS, or the task is generic ETL without a Payload boundary.
    - A pure frontend rendering/cache task belongs to nextjs; pair it when migration acceptance needs a rendered page.
  workflow:
    - id: stage-analyze-source-data
      title: Establish source and accepted target
      goal: Resolve the source contract and the existing target model without inventing missing semantics.
      steps:
        - Identify source system/version/API or export shape, identity namespace, content types, all pages, source snapshot boundaries and expected IDs.
        - Identify null/absent values, timestamps and units, statuses/privacy, relationships, arrays/blocks, media, editor format and explicit locale variants.
        - Reuse accepted collections/globals, cardinality, enums and constraints; propose changes only for a material uncovered source requirement.
        - Ask only for missing or conflicting decisions that affect the dependent mapping or action; continue supported inspection or pure transformation.
      validation:
        - The model includes the required related collections/globals and preserves accepted choices.
        - Unsupported source formats or nodes remain explicit gaps, not invented conversions.
    - id: stage-propose-collection-config
      title: Prepare schema and transformations
      goal: Produce version-matched target config and transformations for the agreed source model.
      steps:
        - Use exported Payload types and installed version-specific APIs; pair payload for target config/access/adapter behavior and preserve existing supported legacy versions.
        - Prefer relationships for editable content vocabularies and select for accepted fixed enums; sample repetition alone does not decide either.
        - Define source-ID to target-ID keys, media import and editor-specific node/link conversion, locale writes and the create/update/retry policy before executing dependent writes.
        - Validate the actual config and pure transformations with declared project checks; label incomplete fragments and unsupported values honestly.
      validation:
        - Config, transformed data and required host dependencies are distinguished from an imported dataset.
        - Genuine unresolved schema decisions remain with the owner; existing accepted decisions need no repeated approval.
    - id: stage-execute-import
      title: Execute and recover the authorized import
      goal: Persist the intended dataset and recover partial failures without duplicates or lost relationships.
      steps:
        - For analysis-only or script-only tasks, stop at the requested artifact. Otherwise continue using existing authorization for the named target; production/destructive actions need their own existing authority.
        - Import through the installed public Payload API or accepted project importer, using durable source identity, recoverable checkpoints and an explicit failure/skipped ledger.
        - Import entities and media before resolving cyclic relationships and embedded links; use a second pass where necessary and never invent placeholder IDs to satisfy required fields.
        - Recover interruption and transient failures using stable identities and source versions; verify persisted success before advancing checkpoints or retrying writes.
        - Preserve unrelated target records; deletion, overwriting user edits, source removal and cutover require their own accepted policy.
      validation:
        - A retry can locate already-persisted records even after a crash between target write and checkpoint update.
        - Failed media, unresolved links/nodes and missing locale values are visible; a successful process exit does not establish completeness.
    - id: stage-reconcile-import
      title: Reconcile and report
      goal: Establish which source content survived the actual target boundary and what remains incomplete.
      steps:
        - Compare full expected and observed source-identity sets and per-collection counts; detect missing, extra and duplicate imports independently of the in-memory checkpoint.
        - Reread content, relation IDs/cardinality/order, media bytes/metadata and locale fields with fallback disabled; compare explicit source values and agreed transforms.
        - Exercise interrupted or repeated runs when reliable rerun is claimed, and confirm they do not duplicate or silently omit data.
        - When requested, follow migrated content through public API and the consuming frontend after reload; pair nextjs for routing/cache/rendering and retain exact source-to-page evidence.
        - Report source/target versions, actions and target, counts and identity reconciliation, failures, rerun results, checks and unverified boundaries with the next supported action.
      validation:
        - Completion applies only to the authorized dataset and requested evidence boundary; representative records alone do not prove a full import.
        - Any unresolved required record, relation, media, locale or rich-text node keeps the migration partial.
  interop:
    - id: interop-payload
      domain: target Payload schema, Local API, access, hooks, adapters and transactions
      winner: payload
      rationale: payload supplies target runtime mechanisms and API/DB evidence; this skill retains extraction, transformation, execution, rerun and reconciliation ownership.
    - id: interop-typescript
      domain: TypeScript language, module structure, type generation, and compile errors in import scripts
      winner: typescript-engineer
      rationale: This skill owns migration semantics; TypeScript language/toolchain rules belong to typescript-engineer.
    - id: interop-tests
      domain: deterministic tests for import scripts, fixtures, and parity checks
      winner: typescript-test-engineer
      rationale: This skill defines migration verification targets; test design belongs to typescript-test-engineer.
    - id: interop-nextjs
      domain: consuming frontend routing, rendering, cache and reload
      winner: nextjs
      rationale: Provide migrated IDs/URLs and expected content; consume actual page readback without treating build/cache config as rendered migration evidence. If unavailable, report that frontend boundary unverified and finish supported data work.
  commands: []
  gotchas:
    - id: gotcha-select-vs-relationship
      priority: high
      text: Repeated strings such as categories, tags, authors, topics, or labels often need relationship collections, not select fields.
    - id: gotcha-partial-samples
      priority: high
      text: Partial source data can hide nullable fields, mixed types, relationship cardinality, rich text formats, media variants, and localization.
    - id: gotcha-import-is-later
      priority: high
      text: Schema or script creation is not migrated data; complete the authorized execution and full reconciliation before claiming an import complete.
    - id: gotcha-rich-text
      priority: medium
      text: Rich text sources may be HTML, Markdown, Lexical JSON, Slate JSON, or vendor-specific ASTs; choose a conversion path explicitly.
    - id: gotcha-media
      priority: medium
      text: Media URLs are not equivalent to Payload upload relationships unless download, upload, metadata, and failure handling are planned.
  policies:
    - id: policy-config-first
      title: Config-first policy
      text: Establish the accepted target model before dependent writes; reuse prior acceptance and authority. Missing or conflicting schema decisions stop only the affected mapping/action, not independent work.
    - id: policy-ambiguity
      title: Ambiguity policy
      text: Ask when a material choice lacks an accepted source; do not reopen an already accepted enum, cardinality or mapping merely because another design is possible.
    - id: policy-capability-claims
      title: Capability claims policy
      text: Distinguish schema design, import planning, generated scripts, and verified migrated data in final reports.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory migration guidance inside this skill folder through SKILL.md and local references.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
