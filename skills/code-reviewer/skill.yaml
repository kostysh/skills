apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: code-reviewer
  source-version: 0.4.5
  recommended-skill-md-max-bytes: 20000
  description: >-
    Perform read-only review of PRs, diffs, and local branch changes. Use to find
    bugs or regressions, assess maintainability, tests, compatibility, or lightweight
    intent alignment, and provide evidence-backed merge guidance with stable scope,
    severity, and findings; pair with relevant domain skills.
fragments:
  overview: fragments/overview.md
references:
  - id: ref-references-diff-completeness
    title: Review Basis and Diff Completeness
    source: references/diff-completeness.md
    target: references/diff-completeness.md
    required: true
    trigger: Always read this before reviewing to freeze the target, preserve read-only scope, account for changed files, and recheck snapshot identity before the verdict.
  - id: ref-references-domain-routing
    title: Domain Routing
    source: references/domain-routing.md
    target: references/domain-routing.md
    trigger: Read this when changed code needs specialized framework, platform, security, privacy, financial, skill-package, or other domain authority.
  - id: ref-references-findings-format
    title: Findings Format
    source: references/findings-format.md
    target: references/findings-format.md
    required: true
    trigger: Always read this before reporting findings, evidence limits, or a merge recommendation.
  - id: ref-references-methodology
    title: Methodology
    source: references/methodology.md
    target: references/methodology.md
    trigger: Read this for a broad, formal, high-risk, or large review that needs the full pass order and completeness audit.
  - id: ref-references-policy-admission-merge-risk
    title: Policy Admission Merge Risk
    source: references/policy-admission-merge-risk.md
    target: references/policy-admission-merge-risk.md
    trigger: Read this when changed files or linked review intent touch policy gates, admission-before-side-effect flow, decision or audit persistence, active scope, idempotency, replay, or freshness checks.
  - id: ref-references-runtime-gate-deployed-path
    title: Runtime Gate Deployed Path
    source: references/runtime-gate-deployed-path.md
    target: references/runtime-gate-deployed-path.md
    trigger: Read this when changed files or linked review intent touch runtime gates that authorize execution through a shipped lifecycle, production construction path, deployed dependency wiring, request or tick path, invocation boundary, idempotency lock scope, or deployment/cell identity binding.
  - id: ref-references-severity-confidence
    title: Severity Confidence
    source: references/severity-confidence.md
    target: references/severity-confidence.md
    required: true
    trigger: Always read this before promoting a candidate concern to a finding or assigning severity.
  - id: ref-references-spec-pass
    title: Spec Pass
    source: references/spec-pass.md
    target: references/spec-pass.md
    trigger: Read this when a linked issue, acceptance criteria, contract, ADR, migration note, or other normative source exists.
  - id: ref-references-complexity-only
    title: Complexity-only Review
    source: references/complexity-only.md
    target: references/complexity-only.md
    trigger: Read this only when the user explicitly asks to review for over-engineering, simplification, unnecessary dependencies, dead flexibility, or what can be deleted.
assets:
  - id: asset-assets-pr-review-template
    source: assets/pr-review-template.md
    target: assets/pr-review-template.md
    description: "Bundled asset: assets/pr-review-template.md."
  - id: asset-assets-review-checklist
    source: assets/review-checklist.md
    target: assets/review-checklist.md
    description: "Bundled asset: assets/review-checklist.md."
  - id: asset-assets-fixtures-policy-admission-review
    source: assets/fixtures/policy-admission-review.md
    target: assets/fixtures/policy-admission-review.md
    description: "Fixture examples for the conditional policy/admission merge-risk pass."
  - id: asset-assets-fixtures-runtime-gate-deployed-path-review
    source: assets/fixtures/runtime-gate-deployed-path-review.md
    target: assets/fixtures/runtime-gate-deployed-path-review.md
    description: "Fixture examples for runtime-gate deployed-path and identity-binding review."
copies:
  - id: copy-agents-openai
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.
supporting:
  - id: supporting-implementation-log-20260715-1
    source: docs/logs/implementation-log-20260715-1.md
    target: docs/logs/implementation-log-20260715-1.md
    description: Non-normative log for the skill description length update.
surfaces:
  active:
    requiredReferences:
      - ref-references-diff-completeness
      - ref-references-findings-format
      - ref-references-severity-confidence
    optionalReferences:
      - ref-references-domain-routing
      - ref-references-methodology
      - ref-references-policy-admission-merge-risk
      - ref-references-runtime-gate-deployed-path
      - ref-references-spec-pass
      - ref-references-complexity-only
  supportingGlobs:
    - docs/*
sections:
  startHere:
    - Confirm the request is for read-only merge-risk review, not implementation or a specialized audit owned by another skill.
    - Read the three required references and freeze a reproducible target, base, scope, and starting snapshot before judging code.
    - Load only conditional references and available domain skills whose triggers match the changed behavior.
    - Recheck snapshot identity before reporting and return an evidence-calibrated recommendation with explicit limits.
  whenToUse:
    - Reviewing a pull request, diff, branch, or changed file set
    - '"Review my changes", "find bugs in this patch", "what should block this merge"'
    - Auditing maintainability, regression risk, test adequacy, or compatibility impact
    - Reviewing a diff or repository scope specifically for over-engineering, unnecessary abstraction, avoidable dependencies, or deletable code
    - Running a lightweight issue or spec alignment check as part of normal PR review
    - Producing concise review comments with severity and evidence
  whenNotToUse:
    - "Security-first or exploitability-driven review: use `security-reviewer`"
    - "Full implementation-versus-spec compliance audit: use `spec-conformance-reviewer`"
    - "UI, accessibility, or UX-only audit: use `web-ui-reviewer`"
    - "Framework implementation guidance or design from scratch: use the relevant domain skill"
    - "Test architecture or runner policy design: use `typescript-test-engineer`"
    - "AI-agent skill capability or instruction-quality audit: use `skill-reviewer`; use this skill only for ordinary code/runtime merge risk inside a skill package"
    - "Implementing review fixes: use the relevant implementation skill; any mutation makes the prior verdict stale"
  workflow:
    - id: stage-conduct-stable-review
      title: Conduct a stable evidence-backed review
      goal: Produce findings and merge guidance for one reproducible read-only snapshot.
      steps:
        - Resolve target and base by the authority order in `references/diff-completeness.md`; return `blocked` instead of guessing through unresolved candidates.
        - Freeze the snapshot, account for the changed scope, and use surrounding code only as research evidence.
        - Run matching conditional and domain passes, then validate candidates against reachable behavior and existing guards.
        - Recheck the snapshot identity and mark the result stale if the reviewed surface changed.
        - Start with one plain-language outcome sentence, then report findings and the mandatory evidence footer with one recommendation status.
      validation:
        - Another reviewer can reconstruct the reviewed target and scope from the report.
        - No recommendation exceeds the behavioral evidence or specialized authority actually assessed.
  interop: []
  commands: []
  gotchas:
    - id: gotcha-review-moving-target
      priority: high
      text: Compare the ending snapshot identity to the starting identity. Any reviewed-surface mutation makes the prior result stale and requires a fresh or bounded delta review before approval.
    - id: gotcha-behaviorless-pass
      priority: high
      text: Do not pass a change only because types/tests/docs look correct when the requested outcome is runtime behavior, browser behavior, security behavior, or data persistence that was not exercised.
  policies:
    - id: policy-read-only-review
      title: Read-only review boundary
      text: Review is read-only absent separate remediation authority. For review-and-fix, record review first, remediate separately, and invalidate the verdict after mutation. A related blocker recurring after remediation requires root-cause review of assumptions, failure path, adjacent surfaces, and scope before another fix.
    - id: policy-review-scope-evidence
      title: Review scope evidence
      text: Every review must state the target/base/snapshot, changed-scope accounting, checks and behavioral evidence considered, untested or unassessed user/API/data paths, and exactly one recommendation status. The absence of findings is not evidence for paths outside that boundary.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory code-reviewer guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
