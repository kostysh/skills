skill:
  name: cli-engineer
  source-version: 0.2.0
  recommended-skill-md-max-bytes: 20000
  description: >-
    Design, review, implement, verify, package, and release production-grade
    TypeScript CLIs and TUIs on Node.js. Use for Vite builds, node:test,
    command/help/output/error contracts, prompts, terminal UI, installability,
    service-backed commands, and release readiness.
