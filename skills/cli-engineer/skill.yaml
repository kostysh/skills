sections:
  startHere:
    - Classify the request as design, review, implementation, release preparation, or authorized publication; review and release preparation do not authorize external mutation.
    - Define the representative user jobs, command/output/error contract, supported platforms, install boundary, service boundary, and side-effect class before selecting tools or claiming readiness.
    - "Apply this skill's standard stack for new CLI work and build/test selection: current Active LTS Node.js, TypeScript, Vite, node:test, native type stripping, and no tsx."
    - Preserve an existing non-Vite build when migration is outside the request, report the deviation, and do not extend it into a competing standard.
    - Load only the optional active references whose triggers match the current task.
    - Match every completion claim to observed behavior through the built or installed command; files, scripts, mocks, and green checks alone are not the capability.
  whenToUse:
    - Designing a new CLI package or restructuring an existing one
    - Choosing between `node:util.parseArgs`, `commander`, `oclif`, `cac`, `clipanion`, prompt libraries, or Ink
    - Standardizing help text, errors, stdout/stderr behavior, `--json`, conditional `--plain`, and exit codes
    - Building interactive prompts or a terminal UI while preserving automation-safe behavior
    - Setting up CLI testing, release preparation, packaging, explicitly authorized npm publishing, provenance, or optional standalone distribution
    - Requiring modular CLI architecture for better testability or adding a missing repo quality gate
    - Standardizing Vite-based CLI bundling and `node:test` process-level verification
    - Reviewing a CLI for UX, scripting composability, cross-platform behavior, manifest/package contracts, or operational safety
  whenNotToUse:
    - General Node backend or service runtime work without a CLI surface; use `node-engineer`
    - Type-level library API design that is not CLI-specific; use `typescript-engineer`
    - Pure test-runner troubleshooting without CLI-specific behavior; use `typescript-test-engineer`
    - Broad security review without CLI-specific attack surfaces; use `security-reviewer`
    - Git commits, tags, pushes, or GitHub release operations as a standalone task; use `git-engineer` or `gh-utility`
    - Maintaining a project-specific alternative CLI build system as a reusable standard; use that system's owning skill
  workflow:
    - id: stage-resolve-mode-and-contract
      title: Resolve mode, authority, and CLI contract
      goal: Establish the requested outcome, allowed side effects, standard-stack applicability, and evidence boundary before acting.
      steps:
        - Classify the request as design, review, implementation, release preparation, or authorized publication.
        - Record the target repository, representative jobs, public command contract, supported platforms, install/distribution boundary, service boundary, and protected side effects.
        - Verify the current Active LTS from official Node.js sources before setting engines, CI, Vite targets, or TypeScript execution guidance.
        - For new or replaced build/test surfaces, apply Vite and node:test; preserve an existing alternative build only when migration is outside scope, and use Vitest only when the user or an authoritative project contract explicitly requires it.
        - Stop publication when package, registry, version, dist-tag, access/visibility, release target, or mutation authority is missing.
      validation:
        - Mode, authority, inputs, supported boundary, and strongest honest output state are explicit.
        - Review and release preparation remain non-mutating; publication has exact targets and authority.
    - id: stage-design-review-or-implement
      title: Design, review, or implement the CLI contract
      goal: Produce the smallest standard-conformant CLI change or an evidence-backed read-only assessment.
      steps:
        - Design thin CLI, application, domain, and infrastructure boundaries; define non-interactive, stdout/stderr, exit-code, config, TTY, protected-option, and completion behavior before polish.
        - In design mode, return a decision-complete design without editing files; in review mode, inspect and report without remediation.
        - In implementation mode, use Vite, node:test, TypeScript, and current-LTS native type stripping; never add or invoke tsx.
        - Keep directly executed TypeScript erasable and independent of tsconfig-only runtime transforms; otherwise rewrite it to the supported profile or execute Vite-built JavaScript.
        - For an existing non-Vite build outside migration scope, make only the requested compatible change and report that the package does not conform to the standard build baseline.
      validation:
        - The result preserves the requested mode and standard-stack boundary without unrelated migration.
        - Protected commands reject invalid options before side effects, and every interactive job retains an automation-safe path.
    - id: stage-verify-capability
      title: Verify observable CLI capability
      goal: Prove the claimed user job through the same built or installed entrypoint consumers will use.
      steps:
        - Run typecheck, format check, lint, node:test unit/integration/contract tests, Vite build, and artifact smoke checks required by the repository.
        - Pack or install durable CLIs into an isolated platform-appropriate temporary location, invoke the exact bin outside the source tree, and verify help, version, a representative success path, and a representative failure path.
        - For service-backed jobs, exercise a real, sandbox, or authoritative contract-conformant boundary; label mock/stub-only evidence as partial and do not claim the real boundary was verified.
        - Record observed command, exit status, stdout/stderr, side effects, environment, and any unverified platform or boundary.
      validation:
        - "`verified` is used only when a representative job passes through the built or installed entrypoint and the claimed boundary."
        - Build files, help-only smoke, mocks, stubs, and green structural checks cannot produce a stronger claim than they exercise.
    - id: stage-prepare-or-publish
      title: Prepare or execute release safely
      goal: Keep release readiness separate from authorized external publication and verify every executed write.
      steps:
        - For release preparation, inspect package identity and packed contents, run clean-install verification, and return release-ready evidence without publishing, tagging, pushing, or creating a release.
        - Publish only when the exact package, registry, version, dist-tag, access/visibility, release target, credentials path, and mutation authority are supplied and freshly confirmed.
        - Prefer trusted publishing and provenance when supported; route Git, tags, pushes, and GitHub releases to their owning skills.
        - After an authorized publish, freshly read registry metadata and install the published version from the target registry before reporting `published`.
      validation:
        - Release preparation never implies publication authority or a published state.
        - Every executed external mutation and its terminal readback are reported separately from proposed actions.
  interop:
    - id: interop-node
      domain: Node.js runtime, current Active LTS evidence, ESM/CJS behavior, native type stripping, signals, and resources
      winner: node-engineer
      rationale: cli-engineer owns the CLI contract and standard baseline; node-engineer owns runtime semantics and version-specific feasibility.
    - id: interop-typescript
      domain: TypeScript language, compiler, module-resolution, and tsconfig rules
      winner: typescript-engineer
      rationale: cli-engineer requires TypeScript and an erasable direct-execution profile; typescript-engineer owns language and compiler correctness.
    - id: interop-testing
      domain: Test mechanics, node:test diagnostics, coverage, hangs, and CI runner behavior
      winner: typescript-test-engineer
      rationale: cli-engineer owns mandatory CLI unit/process/contract/artifact coverage and the node:test standard; typescript-test-engineer owns test implementation mechanics.
    - id: interop-review
      domain: Stable diff review, finding severity, and merge guidance
      winner: code-reviewer
      rationale: code-reviewer owns formal read-only review; cli-engineer supplies CLI-domain judgments.
    - id: interop-implementation
      domain: Authorized implementation scope and minimal remediation
      winner: implementation-discipline
      rationale: implementation-discipline owns mutation discipline; cli-engineer owns the required CLI behavior.
    - id: interop-security
      domain: Threat modeling, secrets, plugins, subprocesses, supply chain, and security sign-off
      winner: security-reviewer
      rationale: cli-engineer owns CLI safeguards; security-reviewer owns deep exploitability and sign-off.
    - id: interop-git
      domain: Commits, tags, branches, and pushes
      winner: git-engineer
      rationale: Release readiness does not authorize Git mutations; git-engineer owns exact Git targets and verification.
    - id: interop-github
      domain: GitHub Actions, releases, repository settings, and remote readback
      winner: gh-utility
      rationale: cli-engineer supplies release requirements; gh-utility owns GitHub operations and target verification.
  commands: []
  gotchas:
    - id: gotcha-substrate-readiness
      priority: high
      text: A Vite build, package scripts, green tests, help output, mock, or stub proves only its exercised boundary; none alone proves the representative installed CLI job or real service integration.
    - id: gotcha-release-authority
      priority: high
      text: A request to prepare, review, configure, or make a CLI release-ready does not authorize npm publication, Git tags or pushes, GitHub releases, or trusted-publisher configuration.
    - id: gotcha-dynamic-lts
      priority: high
      text: Never hardcode a remembered Node LTS major as this skill's permanent baseline; resolve the current Active LTS and version-specific TypeScript/Vite behavior from official sources when the task runs.
    - id: gotcha-tsx
      priority: high
      text: Do not add or invoke tsx. Keep direct TypeScript entrypoints compatible with current-LTS native type stripping, or execute Vite-built JavaScript.
    - id: gotcha-posix-only-smoke
      priority: medium
      text: Do not present /tmp, command -v, POSIX signals, shell chaining, or executable-bit checks as universal cross-platform verification.
  policies:
    - id: standard-toolchain
      title: Standard CLI toolchain
      text: For new CLI work and when selecting or replacing build/test tooling, use current Active LTS Node.js, TypeScript, Vite, node:test, and native type stripping; tsx is prohibited. Use Vitest only when the user or an authoritative project contract explicitly requires it. Preserve an existing alternative build when migration is outside scope, but report the deviation and do not make it a competing standard.
    - id: mode-and-side-effects
      title: Mode and side-effect boundary
      text: Design returns a decision-complete design; review is read-only; implementation changes the authorized project scope; release preparation may build, pack, and verify locally but does not publish or mutate Git/GitHub; publication requires exact targets and explicit mutation authority.
    - id: outcome-states
      title: Outcome and evidence states
      text: Report design/draft, implemented, verified, release-ready, published, partial, or blocked according to observed evidence. `verified` requires a representative job through the built or installed entrypoint and claimed boundary; `release-ready` additionally requires packed-content and clean-install evidence; `published` requires authorized registry write plus fresh registry and install readback.
    - id: output-contract
      title: Agent output contract
      text: Report task mode, authoritative inputs, standard-stack deviations, changed or reviewed scope, observed commands and results, stdout/stderr and exit behavior when relevant, proposed versus executed side effects, strongest warranted state, evidence limits, and next owner or blocker.
    - id: publication-safety
      title: Publication safety
      text: Before npm publication require and confirm package identity, registry, version, dist-tag, access/visibility, release target, credentials path, and exact authorization. Inspect packed contents before the write; after it, read registry metadata and clean-install the published version. Stop on ambiguous write results instead of retrying blindly.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory cli-engineer guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every linked reference and copied eval fixture listed by SKILL.md or the source manifest exists inside this skill folder.
