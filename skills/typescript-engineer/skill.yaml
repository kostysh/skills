sections:
  startHere:
    - "Confirm the work is TypeScript language, type-system, type-safe debugging, or TypeScript toolchain work."
    - "Run the existing typecheck command before non-trivial typing changes, or use pnpm tsc --noEmit when no wrapper exists."
    - "Identify the root compiler or inference cause before patching symptoms."
    - "Use the narrowest sound type fix and rerun typecheck after changes."
  whenToUse:
    - "Writing type-safe TypeScript code in any project."
    - "Designing generics, mapped types, conditional types, overloads, type guards, branded types, or runtime-derived types."
    - "Resolving compiler errors, removing any, configuring tsconfig, ESLint, Biome, pnpm, or Zod validation."
  whenNotToUse:
    - "React-specific patterns, hooks, routing, or UI behavior."
    - "Backend framework patterns that belong to a framework skill."
    - "Frontend design or UI implementation guidance."
  workflow:
    - id: "stage-type-safe-change"
      title: "Make the TypeScript change"
      goal: "Resolve TypeScript problems with narrow, sound fixes and deterministic verification."
      steps:
        - "Run the repo typecheck or pnpm tsc --noEmit to capture the baseline."
        - "Identify root causes such as widened literals, missing constraints, invalid indexing, overload mismatch, unsafe any, or unsound assertions."
        - "Prefer constraints, narrowing, satisfies, runtime-derived types, overloads, or schema inference over broad widening."
        - "Validate call sites and IntelliSense; add type tests or negative assertions for fragile type-level APIs."
        - "Rerun typecheck and verify the error count moved in the intended direction."
      validation:
        - "The fix avoids implicit any, unsafe assertions, and unnecessary broadening."
        - "Typecheck or an explicit equivalent verification was run or the gap is reported."
  interop:
    - id: "interop-framework"
      domain: "framework APIs and framework-specific patterns"
      winner: "the relevant framework skill"
      rationale: "This skill owns TypeScript language and toolchain rules, while framework skills own framework behavior."
    - id: "interop-testing"
      domain: "testing patterns"
      winner: "typescript-test-engineer"
      rationale: "Use the testing skill for test design and runner behavior."
  commands: []
  gotchas: []
  policies: []
