apiVersion: "skillforge/v1alpha1"
kind: "SkillSource"
skill:
  name: "typescript-engineer"
  source-version: "0.2.2"
  recommended-skill-md-max-bytes: 20000
  description: "Use for TypeScript language and type-system work, compiler diagnostics, type-safe APIs, tsconfig, and Biome/ESLint configuration. Ground explanations, review, diagnosis, and changes in repository and installed-version evidence; pair with runtime, framework, testing, validation, and domain owners."
fragments:
  overview: "fragments/overview.md"
references:
  - id: "ref-generics"
    title: "Generics"
    source: "references/generics.md"
    target: "references/generics.md"
    required: true
    trigger: "Read this when designing or diagnosing generics, mapped or conditional types, template literal types, variadic tuples, or reusable type transforms."
  - id: "ref-monorepo"
    title: "Monorepo Typechecking"
    source: "references/monorepo.md"
    target: "references/monorepo.md"
    required: true
    trigger: "Read this when the affected TypeScript project uses workspaces, project references, solution configs, composite builds, or shared tsconfig files."
  - id: "ref-overloads"
    title: "Function Overloads"
    source: "references/overloads.md"
    target: "references/overloads.md"
    required: true
    trigger: "Read this when return types depend on input shape, an overloaded API is wrapped, or overloads must be compared with unions or an options object."
  - id: "ref-patterns"
    title: "Boundary Type Patterns"
    source: "references/patterns.md"
    target: "references/patterns.md"
    required: true
    trigger: "Read this when modeling typed success/failure states, unknown boundaries, schema-derived types, or branded values without taking over runtime or domain policy."
  - id: "ref-practices"
    title: "TypeScript Practices"
    source: "references/practices.md"
    target: "references/practices.md"
    required: true
    trigger: "Read this when migrating JavaScript, reducing unsafe any or assertions, preserving public type contracts, or handling TypeScript suppression directives."
  - id: "ref-runtime-derived-types"
    title: "Runtime-Derived Types"
    source: "references/runtime-derived-types.md"
    target: "references/runtime-derived-types.md"
    required: true
    trigger: "Read this when deriving literal unions or API types with as const, typeof, indexed access, satisfies, or const type parameters."
  - id: "ref-toolchain"
    title: "TypeScript Toolchain"
    source: "references/toolchain.md"
    target: "references/toolchain.md"
    required: true
    trigger: "Read this when changing tsconfig, module or moduleResolution, TypeScript versions, or coordinated Biome and ESLint plus typescript-eslint coverage."
  - id: "ref-type-debugging"
    title: "Type Debugging"
    source: "references/type-debugging.md"
    target: "references/type-debugging.md"
    required: true
    trigger: "Read this when diagnosing compiler errors, inference failures, invalid indexing, assignability, overload resolution, or type-regression evidence."
  - id: "ref-type-system"
    title: "Type System"
    source: "references/type-system.md"
    target: "references/type-system.md"
    required: true
    trigger: "Read this when the task needs TypeScript type-system fundamentals, narrowing, unions, intersections, interfaces, aliases, satisfies, unknown, or never."
assets: []
copies:
  - id: "copy-agents-openai-yaml"
    source: "agents/openai.yaml"
    target: "agents/openai.yaml"
    description: "Portable copy of agents/openai.yaml."
supporting:
  - id: supporting-implementation-log-20260908-1
    source: docs/logs/implementation-log-20260908-1.md
    target: docs/logs/implementation-log-20260908-1.md
    description: Non-normative author implementation record; independent acceptance remains separate.
  - id: "supporting-implementation-log-20260715-1"
    source: "docs/logs/implementation-log-20260715-1.md"
    target: "docs/logs/implementation-log-20260715-1.md"
    description: "Non-normative log for the skill description length update."
surfaces:
  active:
    requiredReferences:
      - "ref-generics"
      - "ref-monorepo"
      - "ref-overloads"
      - "ref-patterns"
      - "ref-practices"
      - "ref-runtime-derived-types"
      - "ref-toolchain"
      - "ref-type-debugging"
      - "ref-type-system"
    optionalReferences: []
  supportingGlobs:
    - "docs/*"
    - "docs/logs/*"
sections:
  startHere:
    - "Classify the request as explain, review/diagnose, or authorized change; review and diagnosis stay read-only unless the user also requests remediation."
    - "Establish the expected type or compiler behavior, repository policy, installed TypeScript and lint versions, relevant tsconfig and package or workspace commands, current diagnostics, and affected public call sites before choosing a fix."
    - "Apply precedence in this order: explicit user requirements, repository policy and compatible installed behavior, current official version-matched documentation, then this skill's portable defaults; stop when equal-authority inputs conflict."
    - "Load only the required references whose conditions are triggered by the current problem and keep framework, runtime, testing, validation-library, and domain decisions with their owning skills."
    - "Define the evidence boundary before changing code: compiler and lint checks prove only the paths they inspect, not runtime or domain behavior."
  whenToUse:
    - "Explaining, designing, reviewing, diagnosing, or changing TypeScript language and type-system behavior."
    - "Resolving compiler diagnostics, unsafe any flow, inference and narrowing failures, overload or generic API behavior, public declaration contracts, and type regressions."
    - "Configuring TypeScript compiler behavior or coordinating Biome with ESLint plus typescript-eslint for complementary lint coverage."
  whenNotToUse:
    - "Framework APIs, component or route behavior, bundler integration, or Vite/React application setup except for the narrowly isolated TypeScript compiler facet."
    - "Node execution mode, built-in type stripping, ESM or CJS runtime behavior, runtime import extensions, or process behavior; use node-engineer."
    - "Test strategy, runner configuration, coverage, mocks, or CI contours; use typescript-test-engineer, pairing this skill only for compile-time type assertions."
    - "Package-manager selection, business or domain modeling policy, validation-library runtime semantics, or application architecture without a TypeScript-specific decision."
  workflow:
    - id: "stage-establish-basis"
      title: "Establish the TypeScript basis"
      goal: "Make the task, authority, installed behavior, affected contract, and allowed side effects explicit before drawing conclusions."
      steps:
        - "Record explain, review/diagnose, or change mode and whether mutations are authorized."
        - "Inspect repository instructions, package and workspace scripts, installed TypeScript and lint versions, relevant tsconfig inheritance or project references, current diagnostics, and affected call sites or declaration consumers."
        - "Define the targeted diagnostic or type/API behavior and identify any runtime, framework, test, validation-library, or domain owner that must be paired."
        - "If required sources are missing or conflict, provide bounded guidance or report blocked instead of inventing a contract."
      validation:
        - "The task mode, source precedence, target behavior, verification command, public contract, and mutation boundary are reconstructable."
    - id: "stage-diagnose-design"
      title: "Diagnose and choose the first sound construct"
      goal: "Resolve the root compiler or inference cause without broadening types or importing unnecessary machinery."
      steps:
        - "Trace the first actionable root cause, such as widening, missing constraints, invalid indexing, unsound assertions, incorrect overloads, module-resolution mismatch, or unsafe boundary data."
        - "Prefer inference, control-flow narrowing, satisfies, built-in utility types, runtime- or schema-derived types, and constrained generics before bespoke conditional types or helper dependencies."
        - "Check public call sites and declaration consumers before tightening or widening an exported type."
        - "Keep runtime and domain semantics unchanged unless the user explicitly authorized that separate owner-controlled change."
      validation:
        - "The proposed result explains why it is sound, what contract changes, and what remains outside the TypeScript claim."
    - id: "stage-apply-authorized-change"
      title: "Apply only the authorized TypeScript change"
      goal: "Implement the narrowest sound change while preserving repository and owner boundaries."
      steps:
        - "In explain or review/diagnose mode, return the explanation or findings without editing."
        - "In change mode, modify only the accepted TypeScript or toolchain scope and avoid broad assertions, implicit any, unowned suppressions, or unrelated dependency and config changes."
        - "For a new setup or explicit lint hardening, keep both Biome and ESLint plus typescript-eslint, assign one owner to overlapping rules, and retain ESLint rules that cover installed-version gaps."
        - "In an existing project, do not install a missing linter during an unrelated task; report the missing contour as a verification gap unless toolchain changes are authorized."
      validation:
        - "Every mutation traces to the requested behavior, and dual-lint coverage is either present or honestly reported as incomplete."
    - id: "stage-verify-report"
      title: "Verify and report at the claimed boundary"
      goal: "Prove the targeted TypeScript behavior without treating partial or substrate checks as broader completion."
      steps:
        - "Run the repository's relevant typecheck or build-graph command and both configured lint contours; use a local compiler fallback only after confirming it targets the intended files and config."
        - "Confirm the targeted diagnostic is resolved or intentionally preserved, no new relevant diagnostics were introduced, and affected call sites or declarations still satisfy the intended contract."
        - "Use positive and negative compile assertions for fragile type APIs; route runtime, integration, and test-runner evidence to the owning skill."
        - "Report the outcome or root cause, changed type/API contract, exact checks, remaining diagnostics, unverified boundaries, and status as verified, partial, or blocked."
      validation:
        - "A lower error count, an empty solution program, compiler success, lint success, generated files, or mocks cannot by themselves satisfy completion."
  interop:
    - id: "interop-framework"
      domain: "framework APIs, framework lifecycle, bundler integration, React or Vite application setup"
      winner: "the relevant framework skill"
      rationale: "typescript-engineer owns the isolated TypeScript compiler and type-system facet; the framework owner decides framework behavior and integration."
    - id: "interop-node-runtime"
      domain: "Node execution mode, type stripping, ESM or CJS runtime semantics, and runtime import behavior"
      winner: "node-engineer"
      rationale: "Consume node-engineer's exact executed entry, Node/loader versions, module mode, resolver rules, and smoke results before choosing module/emit settings. Return the compiler config, emitted specifiers and type evidence for Node to check against that same entry; typecheck cannot close its runtime claim."
    - id: "interop-testing"
      domain: "test strategy, runner behavior, mocks, coverage, and CI test contours"
      winner: "typescript-test-engineer"
      rationale: "Pass expected public call/declaration behavior and positive/negative type assertions to typescript-test-engineer. Consume its scenario-to-command results only for the exercised files and boundary; it owns runner and test strategy, while this skill owns type soundness."
    - id: "interop-validation"
      domain: "runtime validation-library semantics and domain validation policy"
      winner: "the relevant validation-library, framework, or domain skill"
      rationale: "typescript-engineer may derive and inspect types from an accepted runtime schema but cannot invent what must be validated or claim runtime safety from a type alone."
    - id: "interop-review"
      domain: "formal code-review scope, severity, findings format, and merge guidance"
      winner: "code-reviewer"
      rationale: "Pass the stable diff, affected callers/declarations, root diagnostics, and exact compiler evidence to code-reviewer for formal severity and merge-risk synthesis. A domain fix or green compiler is not that verdict."
    - id: "interop-security"
      domain: "security exploitability and vulnerability judgment"
      winner: "security-reviewer"
      rationale: "Pass the concrete type/runtime boundary, untrusted-input path and evidence to security-reviewer when a security judgment is required. Consume its scoped findings for authorized remediation; type soundness alone cannot establish security."
  commands: []
  gotchas:
    - id: "gotcha-empty-typecheck"
      priority: "high"
      text: "Do not run a generic tsc --noEmit fallback until you know which config and files it checks; an empty solution config can return success without traversing referenced projects."
    - id: "gotcha-compiler-boundary"
      priority: "high"
      text: "Do not treat compiler or lint success as runtime, framework, validation, security, or domain proof."
    - id: "gotcha-unsound-silencing"
      priority: "high"
      text: "Do not replace a diagnostic with any, a broad assertion, a non-null assertion, or a suppression unless the authority, invariant, and regression evidence justify that exact boundary."
    - id: "gotcha-dual-lint-drift"
      priority: "high"
      text: "Do not assume Biome and ESLint coverage is static; inspect installed versions, assign one owner to overlapping rules, and preserve the complementary contour required by repository policy."
    - id: "gotcha-public-type-compatibility"
      priority: "medium"
      text: "Do not silently tighten an exported type without checking source compatibility, declaration output, and affected consumers."
  policies:
    - id: policy-handoff-use
      title: Use owner results
      text: "Load another skill only when its decision is material to this task. Consume accepted product behavior from prd-engineer, implementation requirements from spec-engineer, architecture constraints from architecture-engineer, and task scope/checkpoints from delivery-planner when supplied; return the conflicting fact or missing decision to its owner rather than redesigning it. A handoff is usable only for the same contract, version and snapshot it covers."
    - id: policy-missing-owner
      title: Unavailable owner or evidence
      text: "If a specialist, source or check is unavailable, continue supported local analysis and authorized changes. Identify the missing output and leave only its dependent decision or conclusion partial/blocked; do not invent a review verdict, product rule, security guarantee or runtime result."
    - id: policy-publication-handoff
      title: Publication handoff
      text: "For an authorized publication step, pass changed paths, verification results, exact revision and remaining risks to git-engineer for Git operations and gh-utility for GitHub state. Consume fresh ref/check evidence for the matching revision; local success grants no publication authority and cannot replace unavailable remote evidence."
    - id: "policy-source-precedence"
      title: "Source precedence"
      text: "Explicit user requirements override repository policy only for the authorized task; compatible repository policy and installed behavior override generic defaults. Equal-authority conflicts stop the strongest claim."
    - id: "policy-dual-lint-baseline"
      title: "Dual-lint baseline"
      text: "New TypeScript setup and explicit lint hardening use Biome plus ESLint with typescript-eslint because their coverage is complementary. Existing repositories retain their declared policy; a missing required contour is reported rather than silently treated as equivalent coverage."
    - id: "policy-mutation-boundary"
      title: "Mutation boundary"
      text: "Explain and review/diagnose requests are read-only. Change requests authorize only the TypeScript or toolchain scope explicitly requested or necessarily implied by the accepted behavior."
    - id: "policy-evidence-completion"
      title: "Evidence and completion"
      text: "Verified requires the targeted behavior or diagnostic, no new relevant diagnostics, a command that actually covers the affected project graph, and any necessary consumer checks. Partial and blocked states must remain visible."
    - id: "policy-output-contract"
      title: "Output contract"
      text: "Report the outcome or root cause, source basis and assumptions, changed type or API contract, exact verification and remaining diagnostics, unverified runtime or owner boundaries, and verified, partial, or blocked status."
  portability:
    required: true
    rules:
      - "Do not reference machine-specific absolute paths or require repository files outside this skill folder to understand core behavior."
      - "Treat package-manager commands, TypeScript versions, lint versions, tsconfig paths, workspace layout, and CI gates as discovered project context rather than portable constants."
      - "Use only relative links for conditional references and supporting documents inside the skill folder."
    checklist:
      - "Run skill-source-compiler lint, regenerate, and check after source changes."
      - "Confirm every conditional reference has a precise trigger and is reachable from generated SKILL.md."
      - "Search the copied skill for absolute paths, stale assets or scripts, and external mandatory dependencies."
