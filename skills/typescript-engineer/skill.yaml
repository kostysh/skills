skill:
  name: "typescript-engineer"
  source-version: "0.1.0"
  recommended-skill-md-max-bytes: 26000
  description: "Professional TypeScript development skill focused purely on the language, type system, and type-safe debugging. Covers type inference, generics, mapped/conditional/template literal types, type guards, overloads, branded types, removing `any`, diagnosing compiler errors, validation with Zod, and modern toolchain configuration (tsconfig, ESLint, Biome, pnpm). Framework-agnostic: no React, NestJS, or other framework-specific content."
