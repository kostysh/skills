apiVersion: skillforge/v1alpha1
kind: SkillSource
skill:
  name: spec-conformance-reviewer
  source-version: 0.1.7
  recommended-skill-md-max-bytes: 20000
  description: >-
    Review code against authoritative specs, contracts, ADRs, tickets, PRDs, RFCs,
    migrations, and acceptance criteria. Build requirement-to-code traceability,
    identify compliance gaps or ambiguities, and issue an implementation-versus-spec
    verdict limited by source authority and evidence.
fragments:
  overview: fragments/overview.md
references:
  - id: ref-references-methodology
    title: Methodology
    source: references/methodology.md
    target: references/methodology.md
    required: true
    trigger: Read this for every review before selecting normative sources, extracting requirements, or judging implementation evidence.
  - id: ref-references-reporting
    title: Reporting
    source: references/reporting.md
    target: references/reporting.md
    required: true
    trigger: Read this before assigning requirement statuses or issuing any final verdict.
  - id: ref-references-policy-admission-matrix
    title: Policy/admission matrix
    source: references/policy-admission-matrix.md
    target: references/policy-admission-matrix.md
    required: false
    trigger: Read this when normative sources mention policy decisions, admission gates, external consultant invocation, fail-closed behavior, activation decisions, or refusal semantics.
assets:
  - id: asset-consultant-admission-policy-fixture
    source: assets/fixtures/consultant-admission-policy.md
    target: assets/fixtures/consultant-admission-policy.md
    description: Portable worked regression oracle for consultant admission policy matrix behavior; not blind or independent behavioral evidence.
copies:
  - id: copy-agents-openai
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.
supporting:
  - id: supporting-implementation-log-20260727-1
    source: docs/logs/implementation-log-20260727-1.md
    target: docs/logs/implementation-log-20260727-1.md
    description: Ненормативные свидетельства реализации и ревью для Aequitas-ADR/app#226.
  - id: supporting-implementation-log-20260715-1
    source: docs/logs/implementation-log-20260715-1.md
    target: docs/logs/implementation-log-20260715-1.md
    description: Non-normative log for the skill description length update.
surfaces:
  active:
    requiredReferences:
      - ref-references-methodology
      - ref-references-reporting
    optionalReferences:
      - ref-references-policy-admission-matrix
  supportingGlobs:
    - docs/*
sections:
  startHere:
    - Confirm the request asks for implementation-versus-normative-source conformance, not general review, security analysis, concept review, or spec authoring.
    - Fix a read-only review scope and stable identities for the implementation snapshot and every candidate normative source before reaching conclusions.
    - Read the required methodology for every review and the reporting reference before assigning statuses or a verdict.
    - Establish source ownership, approval, version, applicability, supersession, and project-declared precedence; do not infer authority from artifact type alone.
    - For remediation re-audit, fix the prior findings, remediation delta, original requirement failure paths, and adjacent regression surface; do not repeat unchanged previously verified requirements.
    - Load optional references only when their stated trigger applies.
  whenToUse:
    - '"implementation vs spec", "spec compliance review", or "does this match the spec"'
    - Verifying a PR, module, or behavior against a feature spec, ADR, RFC, OpenAPI contract, schema, or acceptance criteria
    - Producing a requirement extraction table, traceability matrix, verification gaps list, or compliance verdict
    - Separating confirmed non-compliance from ambiguity, missing evidence, or pre-existing issues
  whenNotToUse:
    - "General merge-risk or bug-hunting review without normative sources: use `code-reviewer`"
    - "Security-first review: use `security-reviewer`"
    - Architecture, performance, or style review unless those concerns are explicit in the normative sources
    - Authoring or refining a spec instead of checking implementation against it
  workflow:
    - id: stage-establish-review-basis
      title: Establish the review basis
      goal: Make the read-only scope, source authority, and reviewed snapshot reproducible before judging conformance.
      steps:
        - Record the implementation commit, diff plus base, aggregate hash, or equivalent immutable identity and the layers included in scope.
        - Record each candidate normative source's owner, approval state, version, applicability, supersession, and any explicit project or user precedence.
        - For remediation re-audit, record the prior snapshot and findings, current stable remediation delta, unchanged verified requirements excluded from repetition, and blast-radius boundary.
        - Classify missing, lower-authority, generated, stale, or conflicting inputs and stop if the reviewed snapshot moves.
      validation:
        - Another reviewer can reconstruct the implementation and normative source surface from the recorded identities.
        - Artifact type alone never selects the normative authority.
        - The reviewer has not modified the reviewed implementation or normative sources.
    - id: stage-trace-requirements-and-evidence
      title: Trace requirements and evidence
      goal: Map atomic requirements to the actual enforcement boundaries without accepting substrate as broader runtime capability.
      steps:
        - Extract atomic requirements with separate modality and origin fields, preserving derivation basis and confidence.
        - Trace each requirement to implementation, runtime or boundary evidence, and tests in both directions.
        - In remediation re-audit, re-evaluate the fixed requirements and adjacent contracts only; widen to a fresh conformance review when normative authority, requirement meaning, public behavior, or material scope changed or blast radius cannot be bounded.
        - Assign fulfilled, partial, not-fulfilled, ambiguous, or cannot-determine status according to the observed evidence surface.
      validation:
        - Every material conclusion cites an authoritative requirement and either observed implementation evidence or the exact missing evidence surface.
        - Substrate satisfies only an atomic substrate requirement; broader runtime behavior requires boundary-matched evidence.
        - A derived requirement retains its independent must, should, or optional modality.
    - id: stage-derive-and-handoff-verdict
      title: Derive and hand off the verdict
      goal: Produce a deterministic verdict whose strength does not exceed source authority or mandatory implementation evidence.
      steps:
        - Apply the reporting aggregation rules to mandatory statuses, confirmed deviations, ambiguities, and verification gaps.
        - Start with one plain-language outcome sentence, then report snapshot identity, source authority, coverage limits, blocked inputs, findings, routed observations, and the final verdict.
        - Name the owner of clarification or remediation without resolving product intent or editing the reviewed surface.
      validation:
        - Compliant and compliant-with-minor-gaps are impossible while any mandatory requirement is ambiguous or cannot be determined.
        - Confirmed deviations remain distinct from missing proof and source ambiguity.
        - Any material change to the reviewed implementation or normative source invalidates the verdict.
  interop:
    - id: interop-spec-conformance
      domain: requirement extraction, implementation traceability, compliance statuses, evidence limits, and the final implementation-versus-spec verdict
      winner: spec-conformance-reviewer
      rationale: This skill owns the conformance decision while preserving the authority and evidence supplied by upstream and domain owners.
    - id: interop-spec-authority
      domain: authoring, approving, clarifying, or changing normative product and software requirements
      winner: spec-engineer or the named product and requirement owner
      rationale: Upstream owners resolve ambiguity and establish authority; this reviewer records blockers and must not invent or rewrite intent.
    - id: interop-concept
      domain: whether requirements or implementation deliver the established product or system concept beyond literal spec compliance
      winner: concept-conformance-reviewer
      rationale: Concept conformance owns the broader capability boundary; this skill owns only implementation-versus-authoritative-requirement conformance.
    - id: interop-code-review
      domain: general merge risk, bugs, regressions, maintainability, and non-spec implementation concerns
      winner: code-reviewer
      rationale: Route non-spec findings to code-reviewer while retaining any direct requirement-backed deviation in this verdict.
    - id: interop-security
      domain: exploitability, attack paths, vulnerability classification, and security risk not explicitly defined by a normative requirement
      winner: security-reviewer
      rationale: Security-reviewer owns security judgment; this skill may consume its sourced facts without transferring the spec verdict.
    - id: interop-domain-and-remediation
      domain: stack-specific correctness facts and implementation remediation
      winner: the relevant domain skill or implementation owner
      rationale: Domain owners supply specialized facts and implement accepted corrections; this reviewer remains read-only and preserves traceability.
  commands: []
  gotchas:
    - id: gotcha-issue-is-not-normative
      priority: high
      text: Do not treat a delivery issue body as the normative source when PRD, SPEC, PD, architecture, or validation artifacts define the contract.
    - id: gotcha-substrate-acceptance
      priority: high
      text: Do not mark conformance PASS when acceptance can be satisfied by mock screens, storybook stories, generated artifacts, docs, or tests without the claimed runtime behavior.
    - id: gotcha-type-is-not-authority
      priority: high
      text: A formal or generated contract is not automatically more authoritative than its owning approved requirement; establish ownership, version, applicability, and supersession first.
    - id: gotcha-mandatory-unknown
      priority: high
      text: Do not issue compliant or compliant with minor gaps while a mandatory requirement is ambiguous or lacks sufficient implementation evidence.
    - id: gotcha-moving-snapshot
      priority: high
      text: Stop when the reviewed implementation or normative source changes; the prior scope identity and verdict are no longer valid.
  policies:
    - id: policy-trace-to-source
      title: Trace to source policy
      text: Conformance review must trace public contracts, statuses, routes, payloads, and UX claims to their owning artifacts and name any unmatched behavior as drift, not as an implementation choice.
    - id: policy-authority-before-type
      title: Authority before artifact type
      text: Explicit project or user source ownership, approval, version, applicability, and supersession win over generic artifact-type precedence; use type-based ordering only as a disclosed fallback among otherwise applicable sources.
    - id: policy-read-only-snapshot
      title: Read-only stable snapshot
      text: Review a reproducible implementation and normative-source snapshot without remediation; stop on movement and invalidate the verdict after any material change.
    - id: policy-verdict-ceiling
      title: Verdict ceiling
      text: The final verdict cannot exceed the weakest unresolved mandatory requirement basis or implementation evidence surface.
    - id: policy-repeated-failure-escalation
      title: Repeated-failure escalation
      text: If a follow-up review after remediation repeats the same or a materially related blocking deviation, require root-cause investigation of assumptions, the full requirement-to-behavior path, adjacent contracts and surfaces, and remediation scope before another point fix.
    - id: policy-bounded-remediation-reaudit
      title: Bounded remediation re-audit
      text: Re-audit fixed prior findings on a new stable snapshot against their original requirements, remediation delta, closure evidence, and adjacent contracts. Do not re-evaluate unchanged verified requirements or accept cosmetic edits as closure; widen when authority, requirement meaning, public behavior, or material scope changed or blast radius is unbounded.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory spec-conformance-reviewer guidance inside this skill folder.
      - Use relative links for local references, assets, scripts, tests, and supporting docs.
    checklist:
      - Run the skill-source-compiler check command after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
