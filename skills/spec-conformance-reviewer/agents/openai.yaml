interface:
  display_name: "Spec Conformance Reviewer"
  short_description: "Requirement-traceable implementation-versus-spec review"
  default_prompt: "Use $spec-conformance-reviewer to fix a stable read-only implementation snapshot, establish normative source authority, extract atomic requirements, trace them to boundary-matched implementation and test evidence, and limit the verdict when a mandatory requirement is ambiguous or cannot be determined. Default to terse chat output unless a formal report is requested."
