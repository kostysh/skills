sections:
  startHere:
    - Identify the requested planning scope before decomposing anything; support whole project, feature, module/service, integration, specific architecture handoff item, or backlog audit.
    - For every non-trivial creation, revision, or review, apply `implementation-discipline` before decomposition or process-depth decisions; capture the outcome or invariant, actor or consumer and claim boundary, source-authorized scope and non-goals, permitted planning output, simplest sufficient delivery path, and narrowest falsifier.
    - Verify product authority per the required methodology. Material product requirements trace past derived artifacts to an exact customer/contract statement or explicit customer decision. Preserve product and architecture handoff readiness; do not invent requirements or decisions.
    - For project/feature planning, create vertical slices around observable capabilities.
    - For module/service planning, create module increments around accepted responsibilities, boundaries, contracts, invariants, integrations, and verification hooks.
    - Treat the workflow as decision guidance, not a mandatory procedure; skip irrelevant detail when a compact plan is enough.
    - Disposition every in-scope product requirement and architecture handoff obligation to a task, specialist route, spike, or explicit not-applicable rationale; do not treat the handoff itself as a task list.
    - Before creating or recommending a persistent delivery plan, module delivery plan, task brief, or backlog audit artifact, check whether the current repository defines artifact conventions and follow them when present.
    - Produce one compact Markdown Delivery Plan by default; do not output YAML or multiple registers unless explicitly requested.
    - Route product gaps to prd-engineer, architecture gaps to architecture-engineer, and behavior/specification gaps to spec-engineer.
    - Sequence work to expose architectural, integration, migration, rollback, security, data, tenancy, and operability risk early.
    - Distinguish parallel implementation from independent acceptance; type dependency edges and require shared acceptance for same-record or shared-race evidence.
    - Reject tasks whose acceptance can pass through scaffold, metadata, docs, mocks, or wrappers without real observable or verifiable behavior.
    - Reject future-only support tasks unless they name the owner slice/module increment, the evidence they unlock, and the trigger that makes them necessary.
  whenToUse:
    - Decomposing accepted architecture handoff into executable implementation tasks.
    - Planning delivery for an entire project after product and architecture context are available.
    - Planning one feature, epic, module, service, adapter, integration, subsystem, or architecture handoff item.
    - Creating compact task briefs and sequencing for AI-agent implementation.
    - Auditing an existing backlog for layer-only tasks, hidden risks, missing verification, poor granularity, or wrong sequencing.
  whenNotToUse:
    - Creating or normalizing product requirements, product scope, success metrics, or non-goals; use prd-engineer.
    - Choosing architecture patterns, producing ASR records, writing ADRs, or changing architecture handoff; use architecture-engineer.
    - Writing implementation-ready behavior specifications, edge cases, falsifiers, and verification maps; use spec-engineer.
    - Implementing code, tests, migrations, or infrastructure directly.
    - Producing heavyweight project management artifacts when a compact plan is enough.
  workflow:
    - id: stage-scope
      title: Define planning scope
      goal: Respect the requested target and avoid planning more than needed.
      steps:
        - Capture the outcome, actor or consumer, claim boundary, source-authorized scope and non-goals, permitted output, direct delivery path, narrowest falsifier, and exact scope baseline; classify the delta as `unchanged`, `narrowed`, `expanded`, or `mixed`, then inventory every material change or addition with exact authority/customer disposition, consequences, and status or blocker.
        - Classify scope as project, feature, module/service, integration, handoff item, or backlog audit.
        - Identify included and excluded areas.
        - Select compact output mode unless a deeper mode is explicitly required.
        - Use explicit assumptions for non-blocking gaps instead of escalating every unknown.
      validation:
        - Every scope delta has an inventory row with authority and consequences; every unauthorized addition is individually named and blocked, and risk, evidence, or planner-created artifacts have not expanded scope or process depth.
    - id: stage-intake
      title: Intake and authority check
      goal: Identify authoritative product, architecture, spec, repository, and code inputs.
      steps:
        - Load PRD or product brief when product scope matters.
        - Load architecture handoff when boundaries, contracts, data, security, deployment, or operations matter.
        - Load existing specs and repo instructions when available.
        - Verify product Authority and Handoff for the named planning consumer plus architecture handoff item status, blockers, next owner, and expected output; use repository-equivalent fields when names differ.
        - Treat same-session PRDs, architecture notes, specs, and plans as outputs, not higher-authority inputs that can authorize their own expansion.
        - Apply the required methodology's customer-coordination and bounded non-product-authority gates; a missing or conflicting chain blocks only dependent work.
        - Allow non-authoritative, draft, or blocked inputs to inform draft decomposition, but keep their dependent tasks draft or blocked.
        - Classify gaps as blocking or non-blocking and route blocking gaps to the responsible skill.
    - id: stage-architecture-to-tasks
      title: Convert architecture handoff into delivery work
      goal: Turn accepted architecture obligations into tasks without redesigning architecture.
      steps:
        - Extract boundaries, contracts, data constraints, security constraints, operational obligations, integration points, validation obligations, risks, and revisit triggers.
        - Map every in-scope product requirement and architecture obligation, with source trace, to a vertical slice, module increment, support task, spike, specialist route, or explicit not-applicable rationale.
        - Trace every material planned item back to customer-coordinated product authority or bounded non-product authority; a missing reverse trace invalidates it.
        - For a ready planner-owned spike, produce only a bounded brief naming the executor, success and failure signals, evidence contract, and return route; do not claim empirical evidence.
        - Route unresolved architecture choices to architecture-engineer.
    - id: stage-decomposition
      title: Create slices or module increments
      goal: Decompose around observable or verifiable outcomes.
      steps:
        - Use vertical slices for project and feature planning.
        - Use module increments for module, service, adapter, or subsystem planning.
        - Tie substrate work to a named capability, module increment, validation obligation, or explicit developer-experience goal.
        - Merge or delete layer-only and future-only tasks when they cannot produce independent evidence of progress.
        - For valid support tasks, name the current source obligation or protected boundary, owner outcome, evidence unlocked, and why a direct task or existing verification contour is insufficient.
    - id: stage-task-briefs
      title: Create compact task briefs
      goal: Create executable planning-level tasks without writing full specs.
      steps:
        - Give each task one primary goal.
        - Include item-level origin authority/customer coordination, scope, out-of-scope, dependencies, risk, handoff status, blockers, next owner, expected output or evidence, and unblock or evidence-return route.
        - Use `draft`, `blocked`, or `ready for <owner>`; use `ready for coding` only when accepted product and architecture inputs, sufficient behavior detail, ready dependencies, and concrete verification and review evidence let the coding owner act without source-owned decisions.
        - Split only when risk, dependency order, review path, or verification evidence requires it.
        - Route detailed behavior to spec-engineer instead of inventing it.
        - Record adjacent defects as findings, blockers, or follow-ups unless a current source includes their remediation; do not expand the original slice automatically.
    - id: stage-sequencing
      title: Sequence and parallelize safely
      goal: Expose risk early and avoid parallel work on unstable assumptions.
      steps:
        - Put source-required clarifications, bounded spikes, and accepted contract stabilization before dependent implementation; add a harness only when a current obligation needs it and existing verification is insufficient.
        - Type every material dependency as `start`, `merge`, `acceptance`, or `future-owner`; record source, target, gate or evidence, owner, and unblock or return route.
        - Parallelize when `start` edges are clear, contracts are stable, and write sets do not conflict; this does not imply independent acceptance.
        - Require shared `acceptance` evidence for same-record or shared-race invariants; add `merge` for integration order and `future-owner` for deferred ownership.
    - id: stage-audit
      title: Planning audit
      goal: Ensure the plan is useful, compact, scope-respecting, and safe for downstream agents.
      steps:
        - Check that architecture was not redesigned.
        - Check that no task is more ready than its product, architecture, specification, or dependency inputs.
        - Check that every in-scope requirement and architecture obligation has a task, route, spike, or explicit not-applicable rationale.
        - Check the exact-baseline scope inventory and item-level reverse authority trace; reject aggregate `findings`, missing consequences, or unnamed unauthorized additions.
        - Check that high-risk work is visible.
        - Check that acceptance cannot be satisfied by substrate-only work unless the task is explicitly substrate or developer-experience work.
        - Check that future scaffolds, wrappers, config, or harnesses have a named dependent increment and revisit trigger; otherwise merge, delete, or route them as a planning gap.
        - Check that every task has a handoff status, next owner, expected output or evidence, and unblock or return route.
        - Check that implementation parallelism is not presented as acceptance independence and every same-record or shared-race invariant has a joint acceptance gate.
        - Check that completing the plan is not reported as implementation or runtime capability progress.
        - Check that output does not create unnecessary registers or YAML structures.
        - Repeat the scope-and-simplicity gate after a material delta adds a task family, boundary, lifecycle, support artifact, dependency, or verification contour.
  interop:
    - id: interop-implementation-discipline
      domain: source-authorized scope, simplest sufficient delivery path, self-expansion prevention, support-task exceptions, and proportional evidence
      winner: implementation-discipline
      rationale: implementation-discipline supplies the cross-cutting authoring gate; delivery-planner remains the owner of slices, tasks, dependencies, sequencing, and delivery handoff.
  policies:
    - id: policy-minimal-output
      title: Minimal output policy
      text: Produce the smallest useful Markdown Delivery Plan by default. The workflow is a decision checklist, not a required form; omit irrelevant sections and do not output YAML, multiple registers, or detailed task forms unless explicitly requested or required by repository automation.
    - id: policy-repository-artifact-conventions
      title: Repository artifact conventions policy
      text: Before a persistent planning artifact, check repo-local conventions. Follow mandatory content, audit, checkpoint, stop, reporting, location, ID, metadata, source-link, and indexing rules; compactness never permits omission. Do not hard-code repository paths. Without conventions, use the compact Markdown defaults and state location assumptions only when writing files.
    - id: policy-scope-flexibility
      title: Scope flexibility policy
      text: The skill must work for whole projects and for partial scopes such as one module, service, integration, feature, or architecture handoff item. Always respect the requested boundary.
    - id: policy-architecture-boundary
      title: Architecture boundary policy
      text: Consume accepted architecture handoff as constraints and obligations. Do not select or revise architecture decisions; route unresolved architecture questions to architecture-engineer.
    - id: policy-source-readiness
      title: Source and handoff readiness policy
      text: Verify product and architecture readiness. Material product authority requires the customer/contract chain defined in the required methodology. Draft, blocked, unresolved, or uncoordinated inputs may inform draft decomposition but cannot make dependent work ready; name its owner and unblock evidence.
    - id: policy-obligation-disposition
      title: Obligation disposition policy
      text: Trace both directions. Each in-scope requirement or architecture obligation leads to a task, route, spike, or explicit not-applicable rationale; each material planned item leads back to customer-coordinated product authority or bounded non-product authority. Either gap makes planning incomplete.
    - id: policy-module-increments
      title: Module increment policy
      text: For module/service planning, decompose into verifiable module increments tied to accepted responsibilities, contracts, invariants, data touchpoints, integrations, operations, and tests.
    - id: policy-capability-or-verifiability
      title: Capability or verifiability policy
      text: A decomposition unit must be observable or verifiable. Substrate tasks are allowed only when linked to a slice, module increment, validation obligation, or explicit developer-experience goal.
    - id: policy-no-substrate-only-success
      title: No substrate-only success policy
      text: Do not mark a task or plan ready when its acceptance could pass by adding scaffolds, wrappers, metadata, mocks, docs, or empty tests without changing observable or verifiable behavior. Reframe it around the capability, merge it into its owner task, or label it as a support task with a clear dependent increment.
    - id: policy-no-future-only-support
      title: No future-only support policy
      text: Do not create scaffolds, wrappers, config surfaces, harnesses, folders, or extension points only because they may be useful later. Keep support work only for a current source obligation or protected boundary with a dependent increment, evidence unlocked, and proof that the direct task or existing contour is insufficient.
    - id: policy-support-task-contract
      title: Support task contract
      text: A remediation, tooling, documentation, or skills task must name the capability it protects, the defect class it prevents, the evidence it unlocks, and the effectiveness check for the next slice. Do not present support substrate as delivered product capability.
    - id: policy-right-sized-tasks
      title: Right-sized task policy
      text: Each task should have one primary goal, source trace, clear dependencies, a risk label, a handoff status, blockers, a next owner, an expected output or evidence contract, and an unblock or evidence-return route.
    - id: policy-task-handoff
      title: Task handoff output contract
      text: Use `draft`, `blocked`, or `ready for <owner>` for every task. Ready means the named owner can produce the expected output without inventing product intent, architecture, behavior, or dependency state. `ready for coding` additionally requires accepted product and architecture inputs, sufficient behavior detail or an accepted spec, ready dependencies, and concrete verification and review evidence. A planner-owned spike ends at an executable brief and never claims the executor's empirical evidence.
    - id: policy-planning-completion
      title: Planning completion anti-claim
      text: A delivery plan may be complete while some tasks remain blocked. Completing, reviewing, persisting, or tracking the plan is planning capability only; it does not demonstrate implementation progress, runtime behavior, or release readiness.
    - id: policy-routing
      title: Specialist routing policy
      text: Route product gaps to prd-engineer, architecture gaps to architecture-engineer, behavior/spec gaps to spec-engineer, and domain judgment to the relevant review or skill.
    - id: policy-risk-first-sequencing
      title: Risk-first sequencing policy
      text: Sequence work to expose architecture, integration, migration, rollback, security, data, tenancy, operability, and contract risks early.
    - id: policy-typed-dependency-edges
      title: Typed dependency edge policy
      text: Type dependencies as `start`, `merge`, `acceptance`, or `future-owner` and record source, target, gate or evidence, owner, and unblock route. Clear `start` edges permit parallel implementation, not independent acceptance. Same-record or shared-race behavior requires shared `acceptance` evidence.
    - id: policy-no-hidden-high-risk
      title: No hidden high-risk policy
      text: Do not hide high-risk changes inside generic low-risk implementation tasks. Promote, split, or route them.
    - id: policy-output-language
      title: Output language policy
      text: Use the user's working language unless repository rules differ. Start with a concise result in plain, understandable language; remove unnecessary jargon, explain needed specialist terms, and preserve technical identifiers.
  portability:
    required: true
    rules:
      - Do not reference machine-specific absolute paths or local files outside this skill folder.
      - Keep all mandatory delivery-planner guidance inside this skill folder.
      - Treat repository docs, external standards, and domain examples as optional context unless supplied by the current task.
      - Use relative links for local references, assets, and supporting docs.
      - Keep artifact templates portable and free of repository-specific paths or assumptions.
    checklist:
      - Validate skill.yaml syntax after regeneration.
      - Search the skill folder for absolute local paths before finishing.
      - Confirm every required reference listed by SKILL.md exists inside this skill folder.
      - Confirm default output templates are Markdown and do not require YAML structures.
      - Confirm instruction quality audit passed for outcome, constraints, freedom, validation, fallback, and stop rules.
