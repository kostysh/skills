  - id: asset-template-gdpr-architecture-audit
    source: assets/templates/gdpr-architecture-audit.md
    target: assets/templates/gdpr-architecture-audit.md
    description: Copy-ready template for a GDPR architecture audit report.
  - id: asset-template-processing-map
