apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: financial-calculations-engineer
  source-version: 0.3.0
  recommended-skill-md-max-bytes: 20000
  description: >-
    Design, implement, and review deterministic money arithmetic and cross-layer
    parity. Keep EUR as default; use discovered currency engines only with
    authoritative code and scale. Cover VAT/IVA, rates, allocation, parsing,
    formatting, and ledger amounts; never invent FX, tax, or accounting policy.

fragments:
  overview: fragments/overview.md

