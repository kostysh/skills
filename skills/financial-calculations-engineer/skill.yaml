apiVersion: skillforge/v1alpha1
kind: SkillSource

skill:
  name: financial-calculations-engineer
  source-version: 0.3.1
  recommended-skill-md-max-bytes: 20000
  description: >-
    Design, implement, and review EUR-first money arithmetic and cross-layer
    parity using accepted currency, scale, and rounding rules. Use verified
    project APIs or a local formula for VAT/IVA, rates, allocation, and units;
    never invent FX, tax, or accounting policy.

fragments:
  overview: fragments/overview.md

references:
  - id: ref-browser
    title: Browser boundaries
    source: references/browser.md
    target: references/browser.md
    required: true
    trigger: Read this when browser input, preview, state, serialization, or formatting is in scope.
  - id: ref-database-sql
    title: Database and SQL conformance
    source: references/database-sql.md
    target: references/database-sql.md
    required: true
    trigger: Read this when PostgreSQL storage, SQL formulas, allocation, or database parity is in scope.
  - id: ref-money-library-usage
    title: Canonical money engine
    source: references/money-library-usage.md
    target: references/money-library-usage.md
    required: true
    trigger: Read this when discovering or using a money library, and for every non-EUR engine task.
  - id: ref-parity-testing
    title: Cross-layer parity evidence
    source: references/parity-testing.md
    target: references/parity-testing.md
    required: true
    trigger: Read this before claiming parity or designing fixtures across two or more runtime contours.
  - id: ref-server-backend
    title: Server and backend boundaries
    source: references/server-backend.md
    target: references/server-backend.md
    required: true
    trigger: Read this when DTOs, JSON serialization, server calculation, persistence, or backend configuration is in scope.
  - id: ref-vat-iva
    title: VAT and IVA arithmetic
    source: references/vat-iva.md
    target: references/vat-iva.md
    required: true
    trigger: Read this when an accepted source requires forward VAT/IVA, reverse VAT/scorporo, or residual-minor-unit handling.

assets: []

copies:
  - id: copy-agents-openai
    source: agents/openai.yaml
    target: agents/openai.yaml
    description: Portable copy of agents/openai.yaml.

