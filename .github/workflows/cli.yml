name: CLI checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kostysh/skills format:check
      - run: pnpm --filter @kostysh/skills lint
      - run: pnpm --filter @kostysh/skills test:ci
      - run: pnpm --filter @kostysh/skills verify:package
